plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.portfolio'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // 비밀번호 재설정 메일 발송용. spring.mail.host 가 없으면 발송 시점에만 실패하고
    // (PasswordResetMailSender 가 삼킨다) 앱 기동에는 영향이 없다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 컨테이너/로드밸런서 헬스체크(/actuator/health)용. 다른 엔드포인트는 노출하지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // 분산 락(HoldStrategy.DISTRIBUTED) 용. 커넥션은 지연 생성이라
    // Redis 가 안 떠 있어도 앱 기동에는 영향이 없다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 공공데이터 API 응답이 XML 이라 Jackson XML 모듈 필요
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // 스키마 마이그레이션. ddl-auto: update 는 컬럼 추가만 하고 제약 변경은 안 하며,
    // 실패해도 경고만 남기고 앱을 띄워서 깨진 스키마를 못 알아챈다(실제로 세 번 겪었다).
    // Flyway 10 은 DB 별로 모듈이 갈려서 MariaDB/MySQL 지원을 따로 받아야 한다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // MockMvc 요청에 로그인 주체를 붙이기 위한 것. 컨트롤러가 @AuthenticationPrincipal 로
    // CustomUserDetails 를 받으므로 @WithMockUser 의 기본 User 로는 대체할 수 없다.
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // DISTRIBUTED 전략 측정용 실제 Redis. 로컬/CI 에 Docker 가 없어도
    // 테스트 프로세스가 직접 redis-server 를 띄운다.
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.3'
}

tasks.named('test') { useJUnitPlatform() }
