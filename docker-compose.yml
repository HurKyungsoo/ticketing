services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ticket
      MARIADB_USER: ${DB_USER:-ticket}
      MARIADB_PASSWORD: ${DB_PASSWORD:-ticket}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HoldStrategy.DISTRIBUTED 전용. 앱은 Redis 없이도 기동되며,
  # 이 컨테이너가 없으면 DISTRIBUTED 전략만 사용할 수 없다.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # application.yml 의 prod 데이터소스는 localhost 고정이라, 컨테이너 네트워크에서는
      # 이 환경변수로 db 서비스명을 덮어써서 접속한다.
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-ticket}
      DB_PASSWORD: ${DB_PASSWORD:-ticket}
      # 공공데이터포털(data.go.kr) 키. 표준데이터/문화정보 두 소스가 쓴다.
      PUBLICDATA_SERVICE_KEY: ${PUBLICDATA_SERVICE_KEY:-REPLACE_ME}
      # KOPIS 키는 data.go.kr 이 아니라 kopis.or.kr 에서 별도 발급한다.
      # 이게 빠지면 공연 대부분을 차지하는 KOPIS 소스가 통째로 수집되지 않는다.
      KOPIS_SERVICE_KEY: ${KOPIS_SERVICE_KEY:-REPLACE_ME}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-REPLACE_ME}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-REPLACE_ME}
      # 소셜 로그인. 없으면 폼 로그인만 동작한다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-REPLACE_ME}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-REPLACE_ME}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-REPLACE_ME}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-REPLACE_ME}
      # 공연 상세의 공연장 위치 지도. 없으면 지도 없이 길찾기 링크만 나온다.
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-REPLACE_ME}
      # 공연 상세의 카카오톡 공유 버튼. KAKAO_CLIENT_ID(REST API 키)와 다른 "JavaScript 키".
      # 없으면 버튼 자체가 안 뜬다.
      KAKAO_JS_KEY: ${KAKAO_JS_KEY:-REPLACE_ME}
      # application.yml 기본값은 localhost 라, 컨테이너 네트워크에서는 서비스명으로 덮어쓴다.
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    # Dockerfile 에도 같은 HEALTHCHECK 가 있지만, db/redis 와 같은 방식으로 compose 파일만
    # 보고도 app 상태를 알 수 있게 여기 명시한다. start-period 는 Flyway 마이그레이션을
    # 포함한 최초 기동 시간을 감안한 값이다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  db-data:
