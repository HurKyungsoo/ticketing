spring:
  application:
    name: ticketing
  profiles:
    active: local
  config:
    import: optional:classpath:venue-layouts.yml

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 공공데이터포털 인증키 (활용신청 후 발급) - 절대 커밋하지 말 것
publicdata:
  service-key: ${PUBLICDATA_SERVICE_KEY:REPLACE_ME}
  # 전국공연행사정보표준데이터 (객석수/요금/좌표 포함)
  performance-url: https://api.data.go.kr/openapi/tn_pubr_public_pblprfr_event_info_api
  # 한눈에보는문화정보, 기간별(period2) 오퍼레이션 (썸네일/장르/상세 포함). 응답은 XML.
  culture-url: https://apis.data.go.kr/B553457/cultureinfo/period2
  sync-page-size: 100
  sync-max-pages: 5

# 토스페이먼츠 테스트 키 - 절대 커밋하지 말 것
toss:
  client-key: ${TOSS_CLIENT_KEY:REPLACE_ME}
  secret-key: ${TOSS_SECRET_KEY:REPLACE_ME}
  api-base-url: https://api.tosspayments.com

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 파일 기반이라 bootRun 재시작 후에도 데이터가 유지된다. 스키마를 갈아엎어야 하면
    # data/ 디렉토리를 지우고 다시 띄우면 된다.
    url: jdbc:h2:file:./data/ticket;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # 인메모리 + 테스트 전용 프로필. local 프로필(파일 기반)과 완전히 분리해서,
    # 테스트의 deleteAll() 이 로컬 개발용으로 쌓아둔 데이터를 건드리지 않게 한다.
    url: jdbc:h2:mem:ticket-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://localhost:3306/ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
