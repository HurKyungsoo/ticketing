spring:
  application:
    name: ticketing
  profiles:
    active: local
  config:
    import:
      - optional:classpath:venue-layouts.yml
      - optional:classpath:showtime-distribution.yml

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만들고 Hibernate 는 검사만 한다.
      # update 로 두면 컬럼 추가만 하고 제약 변경은 안 하며, DDL 이 실패해도 경고만 남기고
      # 앱이 떠서 깨진 스키마를 못 알아챈다. validate 는 어긋나면 기동을 중단한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    # DB 별로 타입 표기가 달라서 스크립트를 나눠 뒀다. {vendor} 플레이스홀더 대신 프로파일마다
    # 명시한다 — 벤더 문자열을 잘못 짚으면 마이그레이션을 하나도 못 찾고, 그게 조용히 넘어간다.
    locations: classpath:db/migration/h2
    # 이미 Hibernate 가 만들어 둔 로컬 개발 DB 를 v1 로 인정하고 시작한다.
    # 빈 DB 에는 영향이 없다(Flyway 는 스키마가 비어 있으면 그냥 전부 실행한다).
    baseline-on-migrate: true
    baseline-version: 1

  thymeleaf:
    cache: false

  # 카카오/네이버 소셜 로그인 - 절대 커밋하지 말 것
  # 카카오/네이버 둘 다 Spring Security 기본 제공 provider 가 아니라서
  # authorization-uri/token-uri/user-info-uri 를 전부 직접 지정해야 한다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:REPLACE_ME}
            client-secret: ${KAKAO_CLIENT_SECRET:REPLACE_ME}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:REPLACE_ME}
            client-secret: ${NAVER_CLIENT_SECRET:REPLACE_ME}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 공공데이터포털 인증키 (활용신청 후 발급) - 절대 커밋하지 말 것
publicdata:
  service-key: ${PUBLICDATA_SERVICE_KEY:REPLACE_ME}
  # 전국공연행사정보표준데이터 (객석수/요금/좌표 포함)
  performance-url: https://api.data.go.kr/openapi/tn_pubr_public_pblprfr_event_info_api
  # 한눈에보는문화정보, 기간별(period2) 오퍼레이션 (썸네일/장르/상세 포함). 응답은 XML.
  culture-url: https://apis.data.go.kr/B553457/cultureinfo/period2
  sync-page-size: 100
  sync-max-pages: 5
  # KOPIS(공연예술통합전산망) 인증키는 data.go.kr 이 아니라 www.kopis.or.kr 에서 별도 발급
  kopis-service-key: ${KOPIS_SERVICE_KEY:REPLACE_ME}
  # 목록(pblprfr) 엔드포인트. 상세는 이 URL 뒤에 /{mt20id} 를 붙여서 호출한다.
  kopis-url: http://www.kopis.or.kr/openApi/restful/pblprfr
  # 공연시설상세정보(좌석수 등). 상세는 이 URL 뒤에 /{mt10id} 를 붙여서 호출한다.
  kopis-facility-url: http://www.kopis.or.kr/openApi/restful/prfplc

# 토스페이먼츠 테스트 키 - 절대 커밋하지 말 것
toss:
  client-key: ${TOSS_CLIENT_KEY:REPLACE_ME}
  secret-key: ${TOSS_SECRET_KEY:REPLACE_ME}
  api-base-url: https://api.tosspayments.com

# 네이버 지도 JS API - 절대 커밋하지 말 것
naver:
  map:
    client-id: ${NAVER_MAP_CLIENT_ID:REPLACE_ME}
    # 인증 파라미터명. maps.js 번들이 둘 다 받지만 검증 엔드포인트가 다르다.
    #   ncpKeyId    -> /v3/auth        (신규 Maps 콘솔 console.ncloud.com/maps)
    #   ncpClientId -> /v1/validatev3  (구 AI·NAVER API 콘솔)
    #
    # 주의: 신규 Maps 콘솔도 인증 정보 화면에서 키를 "Client ID"(X-NCP-APIGW-API-KEY-ID)
    # 라고 표시하지만, 그건 서버 REST API 호출용 헤더 이름이고 웹 JS 인증과는 별개다.
    # 화면 문구만 보고 ncpClientId 로 잡으면 Authentication Failed 가 난다.
    # 두 엔드포인트를 직접 호출해 확인한 결과 /v3/auth + ncpKeyId 가 정상 응답한다.
    key-param: ncpKeyId

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 파일 기반이라 bootRun 재시작 후에도 데이터가 유지된다.
    # 스키마를 처음부터 다시 만들려면 data/ 를 지우고 띄운다 — Flyway 가 V1 부터 적용한다
    # (지금 있는 DB 는 Hibernate 가 만든 것이라 baseline 처리로 v1 로 인정받은 상태다).
    url: jdbc:h2:file:./data/ticket;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # 인메모리 + 테스트 전용 프로필. local 프로필(파일 기반)과 완전히 분리해서,
    # 테스트의 deleteAll() 이 로컬 개발용으로 쌓아둔 데이터를 건드리지 않게 한다.
    url: jdbc:h2:mem:ticket-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    # 매번 빈 인메모리 DB 라 baseline 이 필요없다. 오히려 baseline-on-migrate 를 켜두면
    # 마이그레이션을 건너뛰는 사고가 조용히 날 수 있어서 여기서 끈다.
    # 테스트가 곧 "V1 이 맞는지"를 검증하는 자리다 — 빈 DB 에 V1 을 올리고 validate 를 통과해야
    # ReservationConcurrencyTest 가 돌아간다.
    baseline-on-migrate: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://localhost:3306/ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/mariadb
    # 빈 DB 에 처음부터 올리는 게 정상 경로다. baseline 을 켜면 이미 뭔가 들어 있는 DB 에서
    # V1 을 건너뛰고 시작해버려, 스키마가 반쪽인 채로 돌 수 있다.
    baseline-on-migrate: false
