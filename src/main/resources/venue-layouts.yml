# 실제 공연장 좌석 배치.
# 여기서 찾은 구조가 있으면 SeatGenerator 가 그대로 좌석을 만들고,
# 없으면 기본 로직(공연장 규모별 층 구성 + 20석 x N줄)으로 대체된다.
#
# 매칭 키는 두 가지이고 hallId 가 우선이다.
#
#   hallId    KOPIS 공연장 ID(mt13id). 예: FC000001-03
#             홀 단위라 다관 시설도 정확히 구분된다. 이쪽을 권장.
#   venueName 공연장명 완전일치(트림 후).
#             KOPIS 가 아닌 소스(문화정보/표준데이터)는 홀 ID 가 없어서 이것만 쓸 수 있다.
#
# 이름 매칭의 한계: venue 는 "공연장"이 아니라 "공연시설" 이름이다. 실제 수집 데이터에서
# "예술의전당 [서울]" 하나에 354석 홀(FC000001-02)과 2,505석 홀(FC000001-03)이 함께
# 잡힌다. 이름으로 좌석도를 걸면 둘 중 하나는 반드시 틀린 배치를 받는다.
#
# 홀 ID 찾는 법:
#   1) DB 에서 확인 — select venue, venue_hall_id, total_seat_count from performance
#                     where venue_hall_id is not null;
#   2) KOPIS 공통코드 문서의 공연장 코드 목록(1,798개)에서 시설명/공연장명으로 대조
#
# 주의: 실존 공연장 이름이나 홀 ID 아래에 지어낸 좌석도를 넣지 말 것.
# 공식 자료로 확인한 구조만 쓰고, 근사한 부분은 주석으로 남긴다.
#
# 아래 "예시극장"은 실존 극장의 검증된 실제 좌석도가 아니라, 층/구역별로
# 행·열·등급이 달라지는 실제 극장과 유사한 구조를 보여주기 위한 예시다.
# 실제 극장 정보를 알고 있다면 이 항목을 지우고 hallId 기반 항목으로 교체할 것.
venue:
  layouts:
    # ------------------------------------------------------------------
    # 예술의전당 콘서트홀 (KOPIS FC000001-03)
    #
    # 층별 객석수 출처: 예술의전당 공식 홈페이지 공간소개 (2026-07 확인)
    #   https://www.sac.or.kr/site/main/content/concertHall
    #   총 2,505석 = 1층 1,508 (일반 1,226 + 장애인 8 + 합창석 274)
    #                2층   568 (일반 552 + 장애인 16)
    #                3층   429
    #   KOPIS 공연시설 API 가 준 객석수(2,505)와도 일치한다.
    #
    # 근사한 부분: 이 스키마는 "행 x 열" 직사각형만 표현할 수 있어서 실제 극장의
    # 불규칙한 열 배치를 그대로 옮기지 못한다. 아래 구성의 합은 2,501석으로
    # 공식 수치보다 4석 적다. 층별 비중과 전체 규모를 맞추는 데 목적이 있다.
    # 등급 구분도 실제 판매 등급이 아니라 층 기준의 단순화다.
    #
    # 참고: 좌석도가 지정된 공연장은 SeatGenerator 의 좌석 수 상한(1,500)이
    # 적용되지 않는다. 명시적으로 넣은 구조를 그대로 만든다.
    - hallId: FC000001-03
      venueName: 예술의전당 콘서트홀
      # 구역명 주의: 좌석 조회가 구역명 사전순이라 이름이 곧 화면 표시 순서가 된다.
      # "1층앞/1층뒤" 로 두면 뒤(ㄷ)가 앞(ㅇ)보다 먼저 나와 무대에서 먼 줄이 위에 뜬다.
      # 접두어가 짧은 쪽이 먼저 정렬되는 성질을 이용해 "1층" -> "1층뒤" 순서를 만든다.
      sections:
        - name: 1층
          rows: 15
          seatsPerRow: 41
          grade: VIP
        - name: 1층뒤
          rows: 16
          seatsPerRow: 39
          grade: R
        - name: 합창석
          rows: 7
          seatsPerRow: 39
          grade: A
        - name: 2층
          rows: 16
          seatsPerRow: 35
          grade: S
        - name: 3층
          rows: 11
          seatsPerRow: 39
          grade: A

    # ------------------------------------------------------------------
    # 예술의전당 리사이틀홀 (KOPIS FC000001-02)
    #
    # 층별 객석수 출처: 예술의전당 공식 홈페이지 공간소개 (2026-07 확인)
    #   https://www.sac.or.kr/site/main/content/recitalHall
    #   총 354석 = 1층 262 (일반 258 + 장애인 4) + 2층 92
    #   KOPIS 공연시설 API 가 준 객석수(354)와도 일치한다.
    #
    # 근사: 아래 합은 356석으로 공식 수치보다 2석 많다. 위와 같은 이유다.
    - hallId: FC000001-02
      venueName: 예술의전당 리사이틀홀
      sections:
        - name: 1층
          rows: 6
          seatsPerRow: 22
          grade: R
        - name: 1층뒤
          rows: 6
          seatsPerRow: 22
          grade: S
        - name: 2층
          rows: 4
          seatsPerRow: 23
          grade: A

    - venueName: 예시극장
      sections:
        - name: 1층
          rows: 5
          seatsPerRow: 20
          grade: VIP
        - name: 1층뒤
          rows: 10
          seatsPerRow: 24
          grade: R
        - name: 2층
          rows: 8
          seatsPerRow: 22
          grade: S
        - name: 3층
          rows: 6
          seatsPerRow: 20
          grade: A
