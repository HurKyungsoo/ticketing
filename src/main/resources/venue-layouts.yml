# 실제 공연장 좌석 배치.
# 여기서 찾은 구조가 있으면 SeatGenerator 가 그대로 좌석을 만들고,
# 없으면 기본 로직(공연장 규모별 층 구성 + 20석 x N줄)으로 대체된다.
#
# 매칭 키는 두 가지이고 hallId 가 우선이다.
#
#   hallId    KOPIS 공연장 ID(mt13id). 예: FC000001-03
#             홀 단위라 다관 시설도 정확히 구분된다. 이쪽을 권장.
#   venueName 공연장명 완전일치(트림 후).
#             KOPIS 가 아닌 소스(문화정보/표준데이터)는 홀 ID 가 없어서 이것만 쓸 수 있다.
#
# 이름 매칭의 한계: venue 는 "공연장"이 아니라 "공연시설" 이름이다. 실제 수집 데이터에서
# "예술의전당 [서울]" 하나에 354석 홀(FC000001-02)과 2,505석 홀(FC000001-03)이 함께
# 잡힌다. 이름으로 좌석도를 걸면 둘 중 하나는 반드시 틀린 배치를 받는다.
#
# 홀 ID 찾는 법:
#   1) DB 에서 확인 — select venue, venue_hall_id, total_seat_count from performance
#                     where venue_hall_id is not null;
#   2) KOPIS 공통코드 문서의 공연장 코드 목록(1,798개)에서 시설명/공연장명으로 대조
#
# 구역 정의는 두 가지 형태를 쓴다.
#
#   rows + seatsPerRow   직사각형. 줄 길이가 다 같은 구역(발코니, 합창석 등).
#   seatCounts           줄별 좌석 수를 앞줄부터 나열. 뒤로 갈수록 넓어지는 부채꼴을
#                        표현할 때 쓴다. 화면이 줄을 가운데 정렬하므로 길이만 주면
#                        부채꼴 형태가 그대로 그려진다.
#
# 둘 중 정확히 하나만 적어야 하고, 어기면 기동할 때 예외로 막힌다(VenueLayoutProperties).
#
# 구역이 홀에서 어디에 놓이는지는 세 가지로 적는다. 화면 배치에만 쓰고 좌석 테이블에는
# 남지 않는다. 셋 다 생략할 수 있고, 그러면 구역들이 종전처럼 위에서 아래로 쌓인다.
#
#   position  FRONT(기본) / REAR. REAR 는 무대 뒤(합창석 등)로, 무대 위쪽에 그리고 줄 순서를
#             뒤집는다 — 1열이 무대에서 가장 가까운 줄이므로 블록 아래쪽(무대와 맞닿는 쪽)에 와야 한다.
#   tier      같은 값끼리 한 층(밴드)으로 묶여 가로로 나란히 놓인다. 실제 좌석도는 한 층을
#             좌우 구역으로 나눈다 — 세종문화회관 대극장은 1층이 A~E, 3층이 A~H 다.
#   column    밴드 안에서 왼쪽부터 몇 번째 열인지(오름차순). 같은 값이면 그 열에 위아래로 쌓인다.
#             예) 롯데콘서트홀 1층은 좌(LP·L) | 중앙(A~E) | 우(R·RP) 세 열이고 중앙 열에 A~E 가 쌓인다.
#             세종문화회관 대극장 1층은 A~E 가 각자 다른 열이라 다섯 열이다.
#
# 같은 열 안의 표시 순서는 여기 적은 순서 그대로다. 전에는 좌석 조회의 ORDER BY section 에
# 기대서 구역명 사전순으로 그렸고, 그래서 순서를 맞추려고 이름에 접두어 트릭("1층" -> "1층뒤")을
# 써야 했다. 순서는 이름이 아니라 좌석도가 정하는 게 맞다.
#
# 통로는 블록 경계에 생긴다. centerSeats 를 주면 각 줄이 좌 | 중앙 | 우 로 나뉘고
# 경계 좌석에 통로 표시가 붙는다(생성 시 seat.aisle_after 에 기록되므로 화면이 추정하지 않는다).
# centerSeats 를 안 주면 통로 없는 한 덩어리다.
#
# 중앙 블록 폭을 고정하는 게 핵심이다. 줄은 가운데 정렬되므로 중앙이 고정이면 통로가
# 모든 줄에서 같은 위치에 오고, 좌우 블록이 부채꼴 변화를 흡수한다. 반대로 좌우를 고정하면
# 줄이 넓어질 때마다 경계가 밀려 통로가 지그재그가 된다.
#
# 블록 구조 자체는 "실제 극장이 대체로 그렇다"는 일반적 사실이라 근사해도 무리가 없다.
# 반면 특정 홀의 정확한 블록 경계는 공개 자료가 없어 확인할 수 없으므로, 아래 숫자는
# 홀 고유값이 아니라 그럴듯한 구성이다.
#
# 주의: 실존 공연장 이름이나 홀 ID 아래에 지어낸 좌석도를 넣지 말 것.
# 공식 자료로 확인한 구조만 쓰고, 근사한 부분은 주석으로 남긴다.
#
# 아래 실존 홀 네 곳(예술의전당 콘서트홀·리사이틀홀, 롯데콘서트홀, 세종문화회관 대극장)에서
# "공식"인 것과 "근사"인 것을 항목마다 주석으로 구분해뒀다. 대체로 이렇게 갈린다.
#   공식: 층별 좌석 총계, 구역명, 홀의 구조(빈야드/프로시니엄)
#   근사: 줄 수와 줄별 좌석 수의 분포, 등급 구분
# 어느 홀도 줄별 좌석 수를 공개하지 않는다(좌석도는 클릭형 이미지로만 제공). 그래서 층·구역
# 합계는 공식 수치에 정확히 맞추고, 그 합계를 어떻게 줄로 나눌지는 부채꼴 형태가 나오도록
# 우리가 정했다. 실제 극장의 줄 배치가 아니다.
#
# 아래 "예시극장"은 실존 극장의 검증된 실제 좌석도가 아니라, 층/구역별로
# 행·열·등급이 달라지는 실제 극장과 유사한 구조를 보여주기 위한 예시다.
# 실제 극장 정보를 알고 있다면 이 항목을 지우고 hallId 기반 항목으로 교체할 것.
venue:
  layouts:
    # ------------------------------------------------------------------
    # 예술의전당 콘서트홀 (KOPIS FC000001-03)
    #
    # 층별 객석수 출처: 예술의전당 공식 홈페이지 공간소개 (2026-07 확인)
    #   https://www.sac.or.kr/site/main/content/concertHall
    #   총 2,505석 = 1층 1,508 (일반 1,226 + 장애인 8 + 합창석 274)
    #                2층   568 (일반 552 + 장애인 16)
    #                3층   429
    #   KOPIS 공연시설 API 가 준 객석수(2,505)와도 일치한다.
    #
    # 모델링 범위: 일반 예매 좌석만 만든다. 장애인석 24석(1층 8 + 2층 16)은 휠체어 공간이라
    # 일반 좌석과 성격이 달라 제외했다. 그래서 생성 합계는 2,481석이고, 공식 총계 2,505석과의
    # 차이 24석은 전부 이 제외분이다 — 반올림으로 흘린 수가 아니다.
    #   1층 일반 1,226 + 합창석 274 + 2층 552 + 3층 429 = 2,481
    #
    # 블록 구분 출처: 공식 홈페이지 공간소개의 좌석도는 이미지맵이고, 각 area 의 alt 이
    #   "1층A블록4열2번" 형식으로 블록·열·번호를 그대로 담고 있다(맵 concert1_view / concert2_view,
    #   표본 155개). 여기서 층별 블록 구성과 열·번호의 관측 범위를 얻었다.
    #     1층    A B C D E        ~21열,  C 15번 / B·D 12번 / A·E 11번
    #     합창석  F G H            1~4열,  G 35번 / F·H 23번
    #     2층    A B C D E        ~6열,   A·E 18번 / B·D 12번 / C 10번   + BOX1~6
    #     3층    A B C D E F G    ~7열,   A 13 / D 12 / C·E·G 11 / F 7   + M·N, BOX7~12
    #   2층은 가운데(C)가 가장 좁고 양끝(A·E)이 가장 넓다 — 아레나형이라 측면 발코니가 깊다.
    #
    # 근사한 부분: 블록별 좌석 수와 줄별 분포. 표본이라 위 범위는 하한이고 정확한 블록별
    # 좌석 수는 공개되지 않는다. 그래서 층 합계는 공식 수치에 정확히 맞추고, 그 안에서는
    # 관측된 번호 범위를 블록 폭으로 삼아 비례 배분했다. 등급 구분도 단순화다.
    #
    # 제외한 것: BOX석(2층 6개 / 3층 6개)과 3층 M·N 블록. 층 일반석 총계 안에 포함돼 있는데
    # 몇 석인지 알 수 없어서, 그만큼은 같은 층 A~G 블록에 흡수돼 있다.
    #
    # 참고: 좌석도가 지정된 공연장은 SeatGenerator 의 좌석 수 상한(1,500)이
    # 적용되지 않는다. 명시적으로 넣은 구조를 그대로 만든다.
    - hallId: FC000001-03
      venueName: 예술의전당 콘서트홀
      # 표시 순서는 아래 적은 순서 그대로다(구역명과 무관).
      sections:
        # 합창석 274 = F 86 | G 102 | H 86. 무대 뒤라서 화면에서도 무대 위쪽에 놓인다 —
        # 전에는 구역명 사전순('ㅎ') 탓에 3층보다 아래, 무대에서 가장 먼 자리에 그려졌다.
        # 좌석도 표본의 관측 범위(F·H 4열 23번 / G 35번)에 맞춰 F·H 를 4열, G 를 3열로 뒀다.
        - name: 합창석 F
          position: REAR
          tier: 합창석
          column: 1
          seatCounts: [20, 21, 22, 23]
          grade: A
        - name: 합창석 G
          position: REAR
          tier: 합창석
          column: 2
          seatCounts: [34, 34, 34]
          grade: A
        - name: 합창석 H
          position: REAR
          tier: 합창석
          column: 3
          seatCounts: [20, 21, 22, 23]
          grade: A
        # 1층 일반석 1,226 = A 221 | B 241 | C 302 | D 241 | E 221. 가운데가 C 다.
        # 21열이고 블록 폭은 관측 번호 범위(A·E 11 / B·D 12 / C 15, 합 61)를 그대로 썼다.
        #
        # 앞뒤 등급 구분("1층"/"1층뒤")을 블록별 등급으로 바꿨다. 실제로도 이 홀은 블록 단위로
        # 등급이 갈린다(가운데 C 가 최고가). 한 구역에 한 등급이라 블록 안의 앞뒤 차이는
        # 표현하지 않는다 — 우리 모델의 한계다.
        #
        # 통로는 블록 사이 간격이 대신하므로 centerSeats(구역 안 통로)를 쓰지 않는다.
        - name: 1층 A
          tier: 1층
          column: 1
          seatCounts: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10,
                       11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11]
          grade: S
        - name: 1층 B
          tier: 1층
          column: 2
          seatCounts: [11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11,
                       12, 12, 12, 12, 12, 12, 12, 12, 12, 12]
          grade: R
        - name: 1층 C
          tier: 1층
          column: 3
          seatCounts: [14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14,
                       15, 15, 15, 15, 15, 15, 15, 15]
          grade: VIP
        - name: 1층 D
          tier: 1층
          column: 4
          seatCounts: [11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11,
                       12, 12, 12, 12, 12, 12, 12, 12, 12, 12]
          grade: R
        - name: 1층 E
          tier: 1층
          column: 5
          seatCounts: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10,
                       11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11]
          grade: S
        # 2층 552 = A 142 | B 95 | C 78 | D 95 | E 142. 8열.
        # 가운데(C)가 가장 좁고 양끝(A·E)이 가장 넓다 — 아레나형이라 측면 발코니가 깊다.
        - name: 2층 A
          tier: 2층
          column: 1
          seatCounts: [17, 17, 18, 18, 18, 18, 18, 18]
          grade: S
        - name: 2층 B
          tier: 2층
          column: 2
          seatCounts: [11, 12, 12, 12, 12, 12, 12, 12]
          grade: S
        - name: 2층 C
          tier: 2층
          column: 3
          seatCounts: [9, 9, 10, 10, 10, 10, 10, 10]
          grade: R
        - name: 2층 D
          tier: 2층
          column: 4
          seatCounts: [11, 12, 12, 12, 12, 12, 12, 12]
          grade: S
        - name: 2층 E
          tier: 2층
          column: 5
          seatCounts: [17, 17, 18, 18, 18, 18, 18, 18]
          grade: S
        # 3층 429 = A 72 | B 40 | C 66 | D 73 | E 66 | F 40 | G 72. 양 날개(A·B·F·G)가 얕다.
        - name: 3층 A
          tier: 3층
          column: 1
          rows: 6
          seatsPerRow: 12
          grade: A
        - name: 3층 B
          tier: 3층
          column: 2
          rows: 5
          seatsPerRow: 8
          grade: A
        - name: 3층 C
          tier: 3층
          column: 3
          rows: 6
          seatsPerRow: 11
          grade: A
        - name: 3층 D
          tier: 3층
          column: 4
          seatCounts: [12, 12, 12, 12, 12, 13]
          grade: A
        - name: 3층 E
          tier: 3층
          column: 5
          rows: 6
          seatsPerRow: 11
          grade: A
        - name: 3층 F
          tier: 3층
          column: 6
          rows: 5
          seatsPerRow: 8
          grade: A
        - name: 3층 G
          tier: 3층
          column: 7
          rows: 6
          seatsPerRow: 12
          grade: A

    # ------------------------------------------------------------------
    # 예술의전당 리사이틀홀 (KOPIS FC000001-02)
    #
    # 층별 객석수 출처: 예술의전당 공식 홈페이지 공간소개 (2026-07 확인)
    #   https://www.sac.or.kr/site/main/content/recitalHall
    #   총 354석 = 1층 262 (일반 258 + 장애인 4) + 2층 92
    #   KOPIS 공연시설 API 가 준 객석수(354)와도 일치한다.
    #
    # 모델링 범위: 콘서트홀과 같다. 장애인석 4석은 제외해서 생성 합계는 350석이고,
    # 공식 총계 354석과의 차이 4석이 곧 그 제외분이다.
    #   1층 일반 258 + 2층 92 = 350
    #
    # 구역 구성 출처: 이 홀도 콘서트홀처럼 좌석도가 이미지맵이고 alt 에 구역명이 있다
    # (맵 recital1_view, 표본 28개). 다만 콘서트홀(A~E)과 달리 여기는 알파벳 블록이 아니라
    # "왼쪽사이드 / 오른쪽사이드 / 중앙" 세 구역이다 — 실제 표기가 그렇다.
    #   1층 왼쪽사이드   seatRange 2~22, x 155~201(폭 46px, 좁다)
    #   1층 (중앙)       row 2/6/11 표본, seatRange 2~17, x 240~473(폭 233px, 훨씬 넓다)
    #   1층 오른쪽사이드  seatRange 2~22, x 508~554(폭 46px). 오른쪽사이드장애인석 2석 별도 표본
    #   2층 왼쪽사이드   seatRange 2~16, x 62~87(폭 25px, 1층보다 더 좁다)
    #   2층 뒷줄(중앙)   row 1/3 표본, seatRange 2~19, x 219~486(폭 267px)
    #   2층 오른쪽사이드  seatRange 2~16, x 618~643(폭 25px)
    # 사이드 구역은 x 폭이 좁은데(중앙 줄 한 칸 폭 약 20px 기준 2칸 안팎) seatRange 는 22까지
    # 간다 — 폭이 아니라 깊이(줄 수)로 좌석이 늘어난다는 뜻이다. 2칸 x 11줄 = 22 로 표본 최댓값과
    # 정확히 맞아떨어져서 이 폭으로 잡았다. 2층 사이드는 더 좁아(25px, 1칸 폭) 1칸 x 16줄 = 16 으로 봤다.
    #
    # 근사한 부분: 위 구역별 정확한 좌석 수는 공개되지 않는다. 콘서트홀과 같은 원칙으로,
    # 층 합계(258 / 92)는 공식 수치에 정확히 맞추고 그 안의 사이드/중앙 배분과 줄별 분포는
    # 표본 범위에 맞춰 우리가 정했다. 등급은 종전에 앞/뒤로 나눴던 R/S 를 중앙/사이드로 옮겼다
    # (중앙이 정면이라 더 잘 보이는 자리다).
    - hallId: FC000001-02
      venueName: 예술의전당 리사이틀홀
      sections:
        # 1층 258 = 왼쪽사이드 22 + 중앙 214 + 오른쪽사이드 22
        - name: 1층 왼쪽사이드
          tier: 1층
          column: 1
          rows: 11
          seatsPerRow: 2
          grade: S
        # 이름을 "1층" 에서 "1층 중앙" 으로 바꿨다. 층 이름과 똑같으면 층 머릿글이 그 이름을
        # 이미 쓰므로 구역 라벨이 빈 문자열이 되어, 좌우 사이드에는 이름이 있는데 가운데만
        # 라벨이 없는 화면이 된다. 공식 표기도 "왼쪽사이드 / 중앙 / 오른쪽사이드" 라 이쪽이 맞다.
        # 구역명은 좌석에 저장되는 값이라 바꾼 뒤 좌석 재생성이 필요하다.
        - name: 1층 중앙
          tier: 1층
          column: 2
          seatCounts: [15, 16, 16, 17, 17, 18, 18, 18, 19, 19, 20, 21]
          grade: R
        - name: 1층 오른쪽사이드
          tier: 1층
          column: 3
          rows: 11
          seatsPerRow: 2
          grade: S
        # 2층 92 = 왼쪽사이드 16 + 뒷줄(중앙) 60 + 오른쪽사이드 16
        - name: 2층 왼쪽사이드
          tier: 2층
          column: 1
          rows: 16
          seatsPerRow: 1
          grade: A
        # 1층 중앙과 같은 이유로 이름을 바꿨다.
        - name: 2층 중앙
          tier: 2층
          column: 2
          seatCounts: [19, 20, 21]
          grade: A
        - name: 2층 오른쪽사이드
          tier: 2층
          column: 3
          rows: 16
          seatsPerRow: 1
          grade: A

    # ------------------------------------------------------------------
    # 롯데콘서트홀
    #
    # 출처: 롯데콘서트홀 공식 홈페이지 객석안내 (2026-07 확인)
    #   https://www.lotteconcerthall.com/  (시설안내 > 객석안내)
    #   총 2,036석(휠체어 22석 포함) = 1층 1,538 + 2층 498
    #   1층 구역명 LP · L · A · B · C · D · E · R · RP · P 도 공식 표기다.
    #   "국내에서 처음 도입되는 빈야드(포도밭) 스타일로 객석이 무대를 둘러싼 구조" — 공식 소개문.
    #   무대를 감싸는 홀이라 좌/우/무대뒤 구역이 있는 첫 사례로 넣었다.
    #
    # 모델링 범위: 휠체어석 22석은 제외해서 생성 합계는 2,014석이다.
    #   층별 배분이 공개되지 않아 1층에서 뺐다(1층 1,516 + 2층 498). 이 22석은 근사다.
    #
    # 구역 위치: 공식 자료가 구역명은 주지만 배치도는 클릭형 이미지로만 주므로, 위치는
    # 이름과 공식 안내에서 읽어낸 추정이다.
    #   P    무대 뒤. "객석 1층 P구역 뒤편에 파이프오르간이 설치" 라는 공식 안내를 근거로 삼았다.
    #   L/LP 왼쪽, R/RP 오른쪽 — 이름의 L/R 을 그대로 읽었다. LP/RP 를 무대에 더 가까운 쪽으로 뒀다.
    #   A~E  무대 정면. 앞에서 뒤 순서로 봤다 — 이건 근거가 없는 쪽이다. 세종문화회관처럼
    #        좌우로 나열된 구역일 수도 있는데 확인할 자료를 못 찾았다.
    #
    # 근사한 부분: 구역별 좌석 수와 줄별 분포, 등급 구분. 공식 자료는 층별 총계까지만 준다.
    # 예술의전당과 같은 원칙이다 — 층 합계는 공식 수치에 정확히 맞추고 그 안의 분포만 우리가 정했다.
    #
    # 홀 ID: KOPIS mt13id 를 확인하지 못해 공연장명으로만 매칭한다. 수집 데이터의 표기가
    # 다르면 이 좌석도가 안 걸리고 기본 생성 로직으로 넘어간다(그래도 화면은 정상이다).
    - venueName: 롯데콘서트홀
      sections:
        # 무대 뒤 P구역 220. 뒤편이 파이프오르간이다. 한 덩어리라 통로를 두지 않는다.
        #
        # tier 를 자기 이름으로 적는다. 생략하면 빈 문자열이 되어 "층 이름을 못 얻은 밴드"로
        # 분류되는데, 그러면 이 구역만 층 머릿글 없이 옛 구역 라벨 스타일로 그려져서 아래
        # 1층·2층과 스타일 세대가 갈린다(실제로 그렇게 보였다). 한 구역짜리 층이라
        # 머릿글이 곧 구역 이름이고, 구역 라벨은 shortName 이 비어 자동으로 생략된다.
        - name: 1층 P
          position: REAR
          tier: 1층 P
          seatCounts: [34, 34, 36, 36, 40, 40]
          grade: A
        # 1층은 좌(LP·L) | 중앙(A~E) | 우(R·RP) 세 열이다. 좌우 각 148 = LP 48 + L 100.
        # 정면 구역과 통로로 갈리는 게 아니라 아예 다른 열이라 centerSeats 를 쓰지 않는다.
        - name: 1층 LP
          tier: 1층
          column: 1
          rows: 6
          seatsPerRow: 8
          grade: S
        - name: 1층 L
          tier: 1층
          column: 1
          seatCounts: [10, 10, 12, 12, 12, 14, 14, 16]
          grade: R
        # 무대 정면 1,000 = A 156 + B 180 + C 204 + D 224 + E 236. 뒤로 갈수록 넓어진다.
        - name: 1층 A
          tier: 1층
          column: 2
          seatCounts: [24, 24, 26, 26, 28, 28]
          centerSeats: 16
          grade: VIP
          sideGrade: R
        - name: 1층 B
          tier: 1층
          column: 2
          seatCounts: [28, 28, 30, 30, 32, 32]
          centerSeats: 18
          grade: VIP
          sideGrade: R
        - name: 1층 C
          tier: 1층
          column: 2
          seatCounts: [32, 32, 34, 34, 36, 36]
          centerSeats: 22
          grade: R
          sideGrade: S
        - name: 1층 D
          tier: 1층
          column: 2
          seatCounts: [36, 36, 38, 38, 38, 38]
          centerSeats: 24
          grade: S
          sideGrade: S
        - name: 1층 E
          tier: 1층
          column: 2
          seatCounts: [38, 38, 40, 40, 40, 40]
          centerSeats: 26
          grade: S
          sideGrade: A
        - name: 1층 R
          tier: 1층
          column: 3
          seatCounts: [10, 10, 12, 12, 12, 14, 14, 16]
          grade: R
        - name: 1층 RP
          tier: 1층
          column: 3
          rows: 6
          seatsPerRow: 8
          grade: S
        # 2층 498. 2층 구역명은 공식 자료에서 확인하지 못해 한 구역으로 둔다.
        - name: 2층
          tier: 2층
          seatCounts: [34, 34, 34, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36]
          centerSeats: 20
          grade: A
          sideGrade: A

    # ------------------------------------------------------------------
    # 세종문화회관 대극장
    #
    # 출처: 세종문화회관 공식 홈페이지 좌석배치도 (2026-07 확인)
    #   https://www.sejongpac.or.kr/portal/main/contents.do?menuNo=200368
    #   총 3,022석(장애인석 20석 포함) = 1층 1,030 + 2층 964 + 3층 1,028
    #   구역명도 공식 배치도 표기다 — 1층 A~E / 2층 A~G / 3층 A~H.
    #   프로시니엄 3층 구조라 무대 뒤 구역은 없고, 한 층이 좌우 구역으로 갈리는 홀이다.
    #
    # 1층 구역별 좌석 수는 2차 자료(공식 배치도를 옮긴 블로그)에서 얻었다.
    #   A 198 / B 221 / C 192 / D 221 / E 198 = 1,030 으로 공식 층 총계와 정확히 일치하고,
    #   C 는 "12칸 16열, 모든 열 12석"(=192) 이라 딱 떨어지는 직사각형이다. 합이 맞아 채택했다.
    #   좌우 배치("맨 중앙 C를 중심으로 좌우측에 B·D, 그 밖에 A·E")도 같은 자료다.
    # 2·3층 구역별 좌석 수는 자료가 없어 층 총계를 좌우 대칭으로 우리가 나눴다(A=H, B=G ...).
    #
    # 모델링 범위 — 여기만 다른 두 홀과 다르다. 장애인석 20석이 어느 구역에 있는지 공개되지
    # 않아 분리하지 못했고, 그래서 생성 합계가 공식 총계와 같은 3,022석이다. 예술의전당·롯데는
    # 층별 합계에서 장애인석을 뺐지만(각 24석/22석), 여기서 임의의 구역에서 20석을 깎으면
    # 합이 맞아떨어지는 검증 가능한 수치(1층 A~E)를 근거 없이 훼손하게 된다.
    #
    # 실제와 다른 점: 이 홀 1층은 "구역 사이에 공간이 없이 빼곡히 나열된" 형태라고 안내돼 있다.
