# 회차 시각 분포.
#
# 공공데이터 원본에는 "회차" 개념이 없어서 우리가 만들어야 하는데, 예전에는 전부 19:00
# 고정이었다. 임의로 정한 값이라 근거가 없었고, 실제 공연장은 마티네(낮 공연)와 저녁
# 공연이 섞여 있어서 현실과도 달랐다.
#
# 아래 가중치는 KOPIS 예매통계 시간대별 조회(boxStatsTime) 실측값이다.
#   조회일   : 2026-07-29 (직전 30일: 2026-06-29 ~ 2026-07-28)
#   집계대상 : 상연횟수(prfdtcnt) 24,186회
#
#   09:00~11:59   2,518회  10.4%
#   12:00~14:59   5,275회  21.8%
#   15:00~17:59   7,241회  29.9%
#   18:00~20:59   8,782회  36.3%
#   그 외(00~09, 21~24)     1.6%   ← 새벽/심야 회차가 만들어지면 비현실적이라 제외
#
# time 은 각 구간의 대표 시각이다. weight 는 위 비율을 10배한 정수(합 984).
# 이 파일이 없거나 slots 가 비면 SeatGenerator 가 아니라 PerformanceSyncService 가
# 기존 기본값(19:00 고정)으로 대체하므로, 지워도 앱은 그대로 동작한다.
#
# KOPIS dtguidance(요일별 실제 공연시간)가 있는 공연은 이 분포를 쓰지 않고
# 원본의 실제 시각을 그대로 쓴다. 여기는 원본에 시간 정보가 없을 때만 쓰이는 대체 규칙이다.
showtime:
  slots:
    - time: "11:00"
      weight: 104
    - time: "14:00"
      weight: 218
    - time: "16:00"
      weight: 299
    - time: "19:30"
      weight: 363
