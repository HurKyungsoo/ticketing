<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한이 없습니다</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body>
<div class="wrap errorwrap">
    <header th:replace="~{fragment/header :: masthead(tag='접근 불가', showAuthNav=true)}"></header>

    <div th:replace="~{fragment/errorpage :: errorbody(
            code='403',
            heading='이 페이지를 볼 권한이 없습니다.',
            detail='본인 예매 내역만 조회하고 결제할 수 있습니다. 다른 계정으로 예매하셨다면 해당 계정으로 로그인해 주세요.')}"></div>

    <p style="margin-top:24px">
        <a th:href="@{/mypage/reservations}" style="color:var(--brass)">내 예매 내역</a>
        <span style="color:var(--mute);margin:0 8px">·</span>
        <a th:href="@{/}" style="color:var(--brass)">공연 목록으로</a>
    </p>
</div>
</body>
</html>
