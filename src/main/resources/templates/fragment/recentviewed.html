<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!--
    최근 본 공연.

    훑다가 상세로 들어갔다 뒤로 나오는 걸 몇 번 반복하면, 아까 본 게 뭐였는지 목록에서
    다시 찾아야 했다. 홈은 매번 같은 순서(마감 임박 · 이달 · 신규)를 보여주므로 "내가
    지나온 자리"가 화면 어디에도 남지 않는다.

    서버에 안 남기고 localStorage 에 둔다. 이유가 둘이다.
    ① 비로그인 상태에서도 훑는 게 이 서비스의 기본 동선이다(상세·목록은 로그인 없이
       볼 수 있다). 서버에 남기려면 회원이어야 하는데, 그러면 정작 필요한 사람에게
       안 남는다.
    ② 열람 기록은 예매 내역과 달리 증빙이 아니다. 기기에만 있으면 충분하고, 서버에
       쌓아 두면 지워 줄 책임만 생긴다. 「기록 지우기」로 즉시 없앨 수 있게 뒀다.
-->
<th:block th:fragment="storage">
    <script>
    /*
        읽기(홈)와 쓰기(상세)가 다른 화면에 있어서, 저장 모양이 어긋나면 한쪽이 조용히
        아무것도 못 읽는 상태가 된다. 키·상한·항목 모양을 여기 한 곳에만 둔다.

        localStorage 접근을 전부 try 로 감싸는 이유: 사파리 사생활 보호 모드나 쿠키를
        막아 둔 브라우저에서는 읽기만 해도 예외가 난다. 최근 본 공연이 없는 건 아쉬운
        정도지만, 여기서 던진 예외가 같은 스크립트 블록의 뒷부분을 통째로 멈추면
        화면 기능이 같이 죽는다.
    */
    window.__recent = (function () {
        var KEY = 'gaekseok.recent';
        var MAX = 12;

        function read() {
            try {
                var raw = localStorage.getItem(KEY);
                if (!raw) return [];
                var list = JSON.parse(raw);
                // 저장 모양이 바뀌었거나 누가 손으로 고쳐 넣은 경우. 통째로 버린다 —
                // 열람 기록이라 복구할 가치가 없고, 반쯤 깨진 채로 그리는 게 더 나쁘다.
                return Array.isArray(list) ? list.filter(function (it) {
                    return it && typeof it.id === 'number' && typeof it.title === 'string';
                }) : [];
            } catch (e) {
                return [];
            }
        }

        function write(list) {
            try {
                localStorage.setItem(KEY, JSON.stringify(list));
            } catch (e) {
                /* 용량 초과·저장 불가. 기록이 안 남을 뿐이라 조용히 넘긴다. */
            }
        }

        return {
            list: read,
            clear: function () {
                try { localStorage.removeItem(KEY); } catch (e) {}
            },
            /** 맨 앞으로 올린다. 같은 공연을 다시 보면 자리만 옮기고 늘어나지 않는다. */
            push: function (item) {
                var list = read().filter(function (it) { return it.id !== item.id; });
                list.unshift(item);
                write(list.slice(0, MAX));
            }
        };
    })();
    </script>
</th:block>

<!--/*
    상세 화면에서 한 건 기록한다. 화면에 아무것도 안 그리므로 <body> 끝에 둔다.
*/-->
<th:block th:fragment="record(perf)">
    <th:block th:replace="~{fragment/recentviewed :: storage}"></th:block>
    <script th:inline="javascript">
    (function () {
        if (!window.__recent) return;
        // 포스터가 없는 공연이 꽤 있다. 그때는 null 로 두고 그리는 쪽이 첫 글자 폴백을
        // 쓴다 — 빈 문자열을 넘기면 /img/poster?u= 로 프록시를 헛되이 부르게 된다.
        var poster = /*[[${perf.posterUrl != null} ? @{/img/poster(u=${perf.posterUrl})} : null]]*/ null;
        window.__recent.push({
            id: /*[[${perf.id}]]*/ 0,
            title: /*[[${perf.title}]]*/ '',
            poster: poster
        });
    })();
    </script>
</th:block>

<!--/*
    홈에 그리는 띠.

    hidden 으로 시작해서, 기록이 있을 때만 스크립트가 걷어낸다 — 처음 온 사람에게
    빈 제목만 남은 칸을 보여주지 않는다.

    스크립트를 이 자리에 인라인으로 두는 게 핵심이다. 뒤로 미루면 파싱이 끝난 뒤에
    띠가 생기면서 아래 섹션이 통째로 밀려 내려간다(레이아웃 시프트). 여기서 파서를
    잠깐 멈추고 그려 두면 첫 페인트에 이미 자리를 잡은 상태가 된다.
*/-->
<th:block th:fragment="rail">
    <section class="recentsec" id="recentsec" hidden aria-labelledby="recentsecTitle">
        <div class="rs-head">
            <h2 id="recentsecTitle">최근 본 공연</h2>
            <button type="button" class="rs-clear" id="recentsecClear">기록 지우기</button>
        </div>
        <div class="rs-rail" id="recentsecRail"></div>
    </section>
    <th:block th:replace="~{fragment/recentviewed :: storage}"></th:block>
    <script th:inline="javascript">
    (function () {
        var sec = document.getElementById('recentsec');
        if (!sec || !window.__recent) return;

        var rail = document.getElementById('recentsecRail');
        var items = window.__recent.list();
        if (items.length === 0) return;

        // 컨텍스트 경로가 붙는 배포에서도 맞도록 @{} 로 뽑아 둔다. 여기서 문자열을
        // 직접 박으면 이 띠에서만 링크가 깨진다.
        var base = /*[[@{/performances/}]]*/ '/performances/';

        items.forEach(function (it) {
            var a = document.createElement('a');
            // id 는 저장할 때 숫자인 것만 통과시켰다(storage 의 filter 참고). 제목은
            // textContent 로만 넣는다 — innerHTML 로 만들면 저장된 문자열이 그대로
            // 마크업이 된다.
            a.className = 'rs-item';
            a.href = base + it.id;

            var box = document.createElement('div');
            box.className = 'rs-poster';
            if (it.poster) {
                var img = document.createElement('img');
                img.src = it.poster;
                img.alt = '';
                img.loading = 'lazy';
                // 포스터 주소가 죽었을 때(원본이 내려갔거나 프록시 실패) 깨진 이미지
                // 아이콘 대신 첫 글자 폴백으로 넘어간다 — 카드들이 쓰는 처리와 같다.
                img.addEventListener('error', function () {
                    img.remove();
                    box.classList.add('no-img');
                });
                box.appendChild(img);
            } else {
                box.classList.add('no-img');
            }
            var fallback = document.createElement('span');
            fallback.className = 'rs-fallback';
            fallback.setAttribute('aria-hidden', 'true');
            fallback.textContent = it.title.slice(0, 1);
            box.appendChild(fallback);

            var title = document.createElement('span');
            title.className = 'rs-title';
            title.textContent = it.title;

            a.appendChild(box);
            a.appendChild(title);
            rail.appendChild(a);
        });

        sec.hidden = false;

        document.getElementById('recentsecClear').addEventListener('click', function () {
            window.__recent.clear();
            rail.textContent = '';
            sec.hidden = true;
        });
    })();
    </script>
</th:block>
</body>
</html>
