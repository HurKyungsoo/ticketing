<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--/*
    공통 상단 헤더. tag 는 페이지별 부제(문자열), showAuthNav 는 로그인/로그아웃 내비게이션 표시 여부.
    로고 심볼은 currentColor 를 써서, .masthead .logo-mark 의 color 값(브라스색)을 그대로 물려받는다.
*/-->
<header class="masthead" th:fragment="masthead(tag, showAuthNav)">
    <h1>
        <a th:href="@{/}" class="brandlink">
            <svg class="logo-mark" viewBox="0 0 44 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <rect x="1.5" y="1.5" width="41" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect x="8" y="9" width="9" height="10" rx="2" fill="currentColor"/>
                <line x1="30" y1="6" x2="30" y2="22" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
            </svg>
            객석
        </a>
    </h1>
    <span class="tag" th:text="${tag}">태그</span>
    <nav class="authnav" th:if="${showAuthNav}">
        <!--
            지금 보고 있는 구역을 알약으로 채워 표시한다(CurrentPathAdvice.currentPath).
            aria-current 를 같이 주는 게 핵심 — 색으로만 알리면 스크린리더에는 그냥 링크
            셋이라 어디에 있는지가 전달되지 않는다.
        -->
        <a th:href="@{/performances}" class="navlink"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/performances')} ? 'active'"
           th:attr="aria-current=${currentPath != null and #strings.startsWith(currentPath, '/performances')} ? 'page' : null">공연 찾기</a>
        <!-- 비로그인도 항상 보인다 — /mypage/** 는 SecurityConfig 에서 인증 필수라
             누르면 로그인으로 보냈다가 성공 후 다시 여기로 돌아온다(postLoginRedirectHandler). -->
        <a th:href="@{/mypage/reservations}" class="navlink"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/mypage')} ? 'active'"
           th:attr="aria-current=${currentPath != null and #strings.startsWith(currentPath, '/mypage')} ? 'page' : null">마이페이지</a>
        <!--
            navdivider 를 여기 독립 span 으로 두면 좁은 화면에서 authnav 가 줄바꿈될 때
            구분선만 홀로 첫 줄 끝에 남고, 뒤따르는 로그인/닉네임 묶음은 다음 줄로 떨어져
            어색했다. navactions 로 묶어서 구분선을 그 묶음의 ::before 로 옮기면
            줄바꿈 시에도 항상 묶음과 함께 움직인다.
        -->
        <span class="navactions">
        <!--
            닉네임 앞의 이니셜 원. 로그인한 사람이 누구인지 글자만으로 알리는 것보다
            눈에 먼저 걸린다. 장식이라 aria-hidden 이다 — 바로 옆에서 닉네임을 읽어준다.

            빈 닉네임을 방어하는 이유: substring(0,1) 이 터지면 헤더가 공용이라
            전 화면이 500 이 된다. 장식 하나 때문에 감수할 위험이 아니다.
        -->
        <span sec:authorize="isAuthenticated()" class="who">
            <span class="who-avatar" aria-hidden="true"
                  th:text="${#strings.isEmpty(#authentication.principal.nickname)}
                           ? '·' : ${#strings.substring(#authentication.principal.nickname, 0, 1)}">일</span>
            <span sec:authentication="principal.nickname">닉네임</span>
        </span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="linklike">로그아웃</button>
        </form>
        <span sec:authorize="isAnonymous()" class="authbtns">
            <!--
                보던 자리를 실어 보낸다(CurrentPathAdvice.currentPath). 로그인이 필요해서
                막힌 화면은 스프링이 기록해 두므로 PostLoginRedirectHandler 가 알아서
                되돌려 보내지만, 공연 상세처럼 로그인 없이도 볼 수 있는 화면에서 스스로
                「로그인」을 누른 경우엔 막힌 요청이 없어 서버가 보던 자리를 알 수 없다.

                currentPath 가 null 인 화면(로그인·회원가입 자신 등)에서는 안 붙인다 —
                빈 returnTo 를 달면 주소만 지저분해진다.
            -->
            <a class="btn-login"
               th:href="${currentPath} != null ? @{/login(returnTo=${currentPath})} : @{/login}">로그인</a>
            <a class="btn-signup"
               th:href="${currentPath} != null ? @{/signup(returnTo=${currentPath})} : @{/signup}">회원가입</a>
        </span>
        </span>
    </nav>
</header>
</body>
</html>
