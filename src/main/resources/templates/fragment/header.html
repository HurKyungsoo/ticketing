<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--/*
    공통 상단 헤더. tag 는 페이지별 부제(문자열), showAuthNav 는 로그인/로그아웃 내비게이션 표시 여부.
    로고 심볼은 currentColor 를 써서, .masthead .logo-mark 의 color 값(브라스색)을 그대로 물려받는다.
*/-->
<header class="masthead" th:fragment="masthead(tag, showAuthNav)">
    <!--
        전환 대기 표시. 화면 20개가 전부 이 헤더를 부르므로 여기 한 줄이면 어디서든
        붙는다 — 조각을 따로 만들어 20개 템플릿에 각각 넣는 것보다 빠뜨릴 자리가 없다.
        position:fixed 라 헤더 안에 있어도 헤더의 flex 배치에는 끼지 않는다.
    -->
    <th:block th:replace="~{fragment/navprogress :: navprogress}"></th:block>
    <h1>
        <a th:href="@{/}" class="brandlink">
            <svg class="logo-mark" viewBox="0 0 44 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <rect x="1.5" y="1.5" width="41" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect x="8" y="9" width="9" height="10" rx="2" fill="currentColor"/>
                <line x1="30" y1="6" x2="30" y2="22" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
            </svg>
            객석
        </a>
    </h1>
    <span class="tag" th:text="${tag}">태그</span>
    <nav class="authnav" th:if="${showAuthNav}">
        <!--
            검색 열기. 종전에 검색 입력은 홈 히어로와 목록의 필터 패널 안, 두 곳뿐이었다.
            공연 상세를 보다가 다른 공연이 궁금하면 목록으로 되돌아가 패널을 펴야 했고,
            홈에서도 히어로를 지나 스크롤한 뒤에는 검색이 화면에서 사라진다 — 헤더만
            sticky 로 따라오는데 거기에 검색이 없었다.

            접힌 상태에서는 아이콘 하나라 기존 헤더의 무게를 바꾸지 않는다.

            hidden 으로 시작해서 스크립트가 걷어낸다. JS 가 없으면 이 버튼은 눌러도
            아무 일이 없는 죽은 아이콘이 되므로, 그럴 바에는 아예 안 보이는 게 낫다 —
            검색은 「공연 찾기」 링크 너머 필터 패널에 그대로 있어서 길이 막히지 않는다.
            (.grid.reveal 을 JS 가 붙이는 것과 같은 방향: 기본값이 안전한 쪽이다)
        -->
        <button type="button" class="navsearch-toggle" id="navsearchToggle" hidden
                aria-expanded="false" aria-controls="navsearchPanel">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M11.5 11.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">공연 검색</span>
        </button>
        <!--
            지금 보고 있는 구역을 알약으로 채워 표시한다(CurrentPathAdvice.currentPath).
            aria-current 를 같이 주는 게 핵심 — 색으로만 알리면 스크린리더에는 그냥 링크
            셋이라 어디에 있는지가 전달되지 않는다.
        -->
        <a th:href="@{/performances}" class="navlink"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/performances')} ? 'active'"
           th:attr="aria-current=${currentPath != null and #strings.startsWith(currentPath, '/performances')} ? 'page' : null">공연 찾기</a>
        <!-- 비로그인도 항상 보인다 — /mypage/** 는 SecurityConfig 에서 인증 필수라
             누르면 로그인으로 보냈다가 성공 후 다시 여기로 돌아온다(postLoginRedirectHandler). -->
        <a th:href="@{/mypage/reservations}" class="navlink"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/mypage')} ? 'active'"
           th:attr="aria-current=${currentPath != null and #strings.startsWith(currentPath, '/mypage')} ? 'page' : null">마이페이지<!--
            안 읽은 알림 수. 예전엔 마이페이지 탭(mypagetabs.html) 안에만 있어서, 알림이
            와도 마이페이지를 직접 열어보기 전엔 알 방법이 없었다. unreadCount 는
            UnreadNotificationCountAdvice 가 모든 페이지 컨트롤러 응답에 붙여주므로 여기서
            그대로 읽는다 — 에러 페이지(PageExceptionHandler 는 @Controller 가 아니라
            이 어드바이스가 안 붙는다)처럼 아예 없는 화면도 있어 null 부터 방어한다. --><span
              class="navbadge" th:if="${unreadCount != null and unreadCount > 0}"
              th:text="${unreadCount}">3</span></a>
        <!-- 관리자만 보인다. 예전엔 이 링크가 어디에도 없어서 관리자로 로그인해도
             주소창에 /admin/dashboard 를 직접 쳐야 대시보드로 갈 수 있었다. -->
        <a th:href="@{/admin/dashboard}" class="navlink" sec:authorize="hasRole('ADMIN')"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin')} ? 'active'"
           th:attr="aria-current=${currentPath != null and #strings.startsWith(currentPath, '/admin')} ? 'page' : null">관리자 대시보드</a>
        <!--
            navdivider 를 여기 독립 span 으로 두면 좁은 화면에서 authnav 가 줄바꿈될 때
            구분선만 홀로 첫 줄 끝에 남고, 뒤따르는 로그인/닉네임 묶음은 다음 줄로 떨어져
            어색했다. navactions 로 묶어서 구분선을 그 묶음의 ::before 로 옮기면
            줄바꿈 시에도 항상 묶음과 함께 움직인다.
        -->
        <span class="navactions">
        <!--
            닉네임 앞의 이니셜 원. 로그인한 사람이 누구인지 글자만으로 알리는 것보다
            눈에 먼저 걸린다. 장식이라 aria-hidden 이다 — 바로 옆에서 닉네임을 읽어준다.

            빈 닉네임을 방어하는 이유: substring(0,1) 이 터지면 헤더가 공용이라
            전 화면이 500 이 된다. 장식 하나 때문에 감수할 위험이 아니다.
        -->
        <span sec:authorize="isAuthenticated()" class="who">
            <span class="who-avatar" aria-hidden="true"
                  th:text="${#strings.isEmpty(#authentication.principal.nickname)}
                           ? '·' : ${#strings.substring(#authentication.principal.nickname, 0, 1)}">일</span>
            <span sec:authentication="principal.nickname">닉네임</span>
        </span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="linklike">로그아웃</button>
        </form>
        <span sec:authorize="isAnonymous()" class="authbtns">
            <!--
                보던 자리를 실어 보낸다(CurrentPathAdvice.currentPath). 로그인이 필요해서
                막힌 화면은 스프링이 기록해 두므로 PostLoginRedirectHandler 가 알아서
                되돌려 보내지만, 공연 상세처럼 로그인 없이도 볼 수 있는 화면에서 스스로
                「로그인」을 누른 경우엔 막힌 요청이 없어 서버가 보던 자리를 알 수 없다.

                currentPath 가 null 인 화면(로그인·회원가입 자신 등)에서는 안 붙인다 —
                빈 returnTo 를 달면 주소만 지저분해진다.
            -->
            <a class="btn-login"
               th:href="${currentPath} != null ? @{/login(returnTo=${currentPath})} : @{/login}">로그인</a>
            <a class="btn-signup"
               th:href="${currentPath} != null ? @{/signup(returnTo=${currentPath})} : @{/signup}">회원가입</a>
        </span>
        </span>
    </nav>
    <!--
        열린 검색 줄. 헤더 안에 두 번째 줄로 들어간다(.masthead.searchopen 이 flex-wrap 을
        켜고 이 폼이 flex-basis:100% 를 갖는다). 헤더 바깥에 따로 뜨는 패널로 만들지 않은
        이유는 헤더가 sticky 반투명 바라서다 — 바 밑에 겹쳐 뜨면 그 아래 콘텐츠가 패널
        뒤로 비쳐 지나가 글자끼리 겹쳐 읽힌다.

        status 를 같이 실어 보낸다. 목록 화면에서는 지금 보고 있는 범위를 유지하고
        (「종료된 공연」을 보다가 검색했는데 진행작으로 튀지 않게), 그 밖의 화면에서는
        모델에 status 가 없으므로 히어로 검색과 같은 ongoing 이 된다.
    -->
    <form class="navsearch" id="navsearchPanel" th:if="${showAuthNav}" hidden
          th:action="@{/performances}" method="get" role="search">
        <input type="hidden" name="status" th:value="${status} ?: 'ongoing'">
        <label class="sr-only" for="navsearchKeyword">공연 검색</label>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
            <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11.5 11.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <!-- 목록 화면에서 열면 지금 걸려 있는 검색어가 들어가 있다 — 무엇으로 찾은
             결과를 보고 있는지가 보이고, 한 글자만 고쳐 다시 찾을 수 있다. -->
        <input type="text" id="navsearchKeyword" name="keyword" th:value="${keyword}"
               placeholder="공연명, 아티스트로 검색" autocomplete="off">
        <button type="submit">검색</button>
    </form>
    <script th:if="${showAuthNav}">
    (function () {
        var toggle = document.getElementById('navsearchToggle');
        var panel = document.getElementById('navsearchPanel');
        if (!toggle || !panel) return;

        var bar = toggle.closest('.masthead');
        var field = document.getElementById('navsearchKeyword');

        // 여기까지 왔으면 스크립트가 도는 브라우저다. 그제서야 아이콘을 꺼내 놓는다.
        toggle.hidden = false;

        function setOpen(open) {
            // searchopen 은 헤더의 flex-wrap 을 켜는 스위치다. 닫힌 동안에는 클래스가
            // 없으므로 헤더 레이아웃이 종전과 완전히 같다 — 좁은 화면에서 authnav 가
            // 내부적으로 줄바꿈되는 기존 동작을 건드리지 않으려고 이렇게 나눠 뒀다.
            bar.classList.toggle('searchopen', open);
            panel.hidden = !open;
            toggle.setAttribute('aria-expanded', String(open));
            if (open) field.focus();
        }

        toggle.addEventListener('click', function () {
            setOpen(panel.hidden);
        });

        // Esc 로 닫고 초점을 아이콘으로 돌려준다. 돌려주지 않으면 사라진 요소에 초점이
        // 남아 다음 Tab 이 문서 맨 앞으로 튄다.
        panel.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            setOpen(false);
            toggle.focus();
        });

        // 빈 검색어로 보내면 필터 없는 전체 목록이 열린다 — 「공연 찾기」와 같은 곳이라
        // 검색한 셈이 안 된다. 화면을 옮기는 대신 입력칸에 그대로 둔다.
        panel.addEventListener('submit', function (e) {
            if (field.value.trim() === '') {
                e.preventDefault();
                field.focus();
            }
        });
    })();
    </script>
</header>
</body>
</html>
