<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!--
    전환 대기 표시.

    이 서비스는 Thymeleaf 전체 페이지 로드다. 링크를 누른 순간부터 다음 화면이 그려질
    때까지 **화면에 아무 변화가 없다.** 포스터에는 shimmer 를 깔아 뒀으면서, 정작 가장
    무거운 이동(공연 상세 → 좌석 배치도. 좌석이 수천 개다)에는 눌렸다는 표시조차
    없었다. 응답이 늦으면 사용자는 안 눌린 줄 알고 다시 누른다.

    두 가지를 한다.

    ① 화면 맨 위 진행 막대. 이동이 시작되면 뜨고, 새 문서가 그려지면 그 문서와 함께
       사라진다. 링크·폼을 가리지 않고 전부 잡으므로 화면마다 따로 붙일 게 없다.
    ② 눌린 폼 버튼을 대기 상태로 바꾸고 두 번째 제출을 막는다. 결제 확정처럼 느린
       POST 에서 두 번 눌리는 걸 막는 게 표시보다 중요하다.

    150ms 지연을 두는 이유: 로컬이나 캐시된 화면은 즉시 뜨는데, 그때도 막대가 켜지면
    화면 위에서 뭔가 번쩍하고 사라지는 것으로만 보인다. 사람이 "느리다"고 느끼기
    시작하는 언저리에서만 켠다.
-->
<th:block th:fragment="navprogress">
    <div class="navprogress" id="navprogress" aria-hidden="true"></div>
    <script>
    (function () {
        var bar = document.getElementById('navprogress');
        if (!bar) return;

        var timer = null;
        var busy = false;

        function start() {
            if (busy) return;
            busy = true;
            timer = setTimeout(function () { bar.classList.add('show'); }, 150);
        }

        function stop() {
            busy = false;
            clearTimeout(timer);
            bar.classList.remove('show');
        }

        // 비동기 액션이 있는 화면(토스 결제 등)이 직접 부를 수 있게 열어 둔다 —
        // 그쪽은 링크도 폼 제출도 아니라 아래 리스너에 안 걸린다.
        window.__navProgress = { start: start, stop: stop };

        /* 버블 단계에서 듣고 defaultPrevented 를 본다. 캡처 단계로 올리면 뒤에서
           preventDefault 하는 핸들러(헤더 검색의 빈 검색어 차단 등)보다 먼저 돌아서,
           일어나지도 않을 이동에 막대를 켜게 된다. */
        document.addEventListener('click', function (e) {
            if (e.defaultPrevented || e.button !== 0) return;
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

            var a = e.target.closest ? e.target.closest('a[href]') : null;
            if (!a || a.hasAttribute('download')) return;
            // 새 탭/새 창으로 열리면 이 문서는 그대로 남는다.
            if (a.target && a.target !== '_self') return;

            var url;
            try { url = new URL(a.getAttribute('href'), location.href); } catch (err) { return; }
            // mailto:·tel: 등은 문서를 안 바꾼다.
            if (url.protocol !== 'http:' && url.protocol !== 'https:') return;
            if (url.origin !== location.origin) return;
            /* 같은 문서 안 앵커(좌석도의 #floor-2, 상세의 #schedules)는 스크롤만 한다.
               경로·쿼리가 같고 해시만 다른 경우가 그것이다. */
            if (url.hash && url.pathname === location.pathname && url.search === location.search) return;

            start();
        });

        document.addEventListener('submit', function (e) {
            if (e.defaultPrevented) return;
            var form = e.target;

            /* 이미 보낸 폼이면 두 번째는 막는다. 결제 확정처럼 느린 POST 는 두 번
               눌리면 두 번 처리될 수 있고, 그건 표시가 없는 것보다 훨씬 나쁘다. */
            if (form.dataset.submitting === '1') {
                e.preventDefault();
                return;
            }
            form.dataset.submitting = '1';

            /* 눌린 버튼만 대기로 바꾼다. disabled 를 걸지 않는 이유: 제출 이벤트 안에서
               submit 버튼을 disabled 로 만들면 그 버튼의 name/value 가 전송 값에서
               빠진다. 여기서는 클래스로 표시만 하고, 두 번째 제출은 위 플래그가 막는다. */
            var btn = e.submitter || form.querySelector('button[type="submit"], button:not([type])');
            if (btn) btn.classList.add('is-pending');

            start();
        });

        /* 뒤로가기로 돌아오면 문서가 통째로 복원된다(bfcache) — 막대가 켜진 채, 버튼이
           대기 상태인 채로. 그 화면에서는 아무것도 진행 중이 아니므로 전부 되돌린다.
           이걸 안 하면 뒤로 온 화면의 「결제하기」가 영영 안 눌리는 상태로 남는다. */
        window.addEventListener('pageshow', function () {
            stop();
            document.querySelectorAll('.is-pending').forEach(function (el) {
                el.classList.remove('is-pending');
            });
            document.querySelectorAll('form[data-submitting]').forEach(function (f) {
                delete f.dataset.submitting;
            });
        });
    })();
    </script>

    <!--
        포스터 잇기 (View Transitions).

        카드를 눌러 상세로 갈 때, 누른 포스터가 그대로 상세의 큰 포스터로 커지게 한다.
        두 문서에서 같은 요소에 같은 view-transition-name 을 주면 브라우저가 알아서
        잇는다. 상세 쪽 이름은 템플릿이 박아 두고(포스터가 하나뿐이라 겹칠 일이 없다),
        목록·홈 쪽 이름을 여기서 누른 순간에 붙인다.

        **왜 카드마다 미리 안 박고 클릭 때 붙이는가.** 한 문서 안에 같은
        view-transition-name 이 둘 이상이면 전환이 통째로 무효가 된다. 홈은 같은 공연이
        여러 섹션에 동시에 나올 수 있고(「곧 막을 내려요」와 「새로 들어온 공연」),
        「최근 본 공연」 띠까지 있어서 겹침이 사실상 보장돼 있다. 누른 하나에만 붙이면
        겹칠 수가 없고, 전환에 참여하지 않는 카드 열아홉 장을 따로 스냅숏 뜨지도 않는다.

        지원하지 않는 브라우저에서는 style 속성 하나가 무시될 뿐 이동은 그대로다.
    -->
    <script>
    (function () {
        // 목록·홈·찜 목록의 카드, 홈 에디토리얼 카드, 「최근 본 공연」 띠가 각각 다른
        // 마크업을 쓴다. 공통점은 "공연 상세로 가는 링크 안의 포스터 칸"뿐이다.
        var POSTER = '.poster, .ec-image, .rs-poster';
        var DETAIL = /^\/performances\/(\d+)$/;

        document.addEventListener('click', function (e) {
            if (e.defaultPrevented || e.button !== 0) return;
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

            var a = e.target.closest ? e.target.closest('a[href]') : null;
            if (!a) return;

            var url;
            try { url = new URL(a.getAttribute('href'), location.href); } catch (err) { return; }
            if (url.origin !== location.origin) return;

            var m = DETAIL.exec(url.pathname);
            if (!m) return;

            var poster = a.querySelector(POSTER);
            if (!poster) return;

            /* 지난번에 붙여 둔 이름을 먼저 걷는다. 뒤로가기로 돌아온 화면(bfcache)에는
               그때 누른 카드의 이름이 그대로 남아 있어서, 다른 카드를 누르면 한 문서에
               같은 종류의 이름이 둘이 된다. 되돌아오는 전환을 위해 남겨 두는 것이지
               쌓으라고 두는 게 아니다. */
            document.querySelectorAll('[data-vt-poster]').forEach(function (el) {
                el.style.viewTransitionName = '';
                delete el.dataset.vtPoster;
            });

            poster.style.viewTransitionName = 'poster-' + m[1];
            poster.dataset.vtPoster = '1';
        });
    })();
    </script>
</th:block>
</body>
</html>
