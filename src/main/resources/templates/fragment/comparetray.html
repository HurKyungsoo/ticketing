<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!--
    공연 비교함.

    공연은 후보를 여러 개 놓고 고르는 일이 많은데, 여태 후보를 나란히 볼 자리가 없었다.
    찜은 "나중에 다시 볼 것"을 담는 장기 목록이라 성격이 다르다 — 비교는 지금 이 자리에서
    둘셋을 견주고 하나를 고르면 끝나는 동작이다.

    담아둔 목록은 localStorage 에 둔다. 최근 본 공연과 같은 이유다.
    ① 비교는 로그인 전 훑는 동안 가장 많이 하는 일인데, 서버에 두면 로그인부터 해야 한다.
    ② 고르고 나면 남길 이유가 없는 기록이라 서버에 쌓아 두면 지워 줄 책임만 생긴다.

    다만 비교표 자체는 서버가 그린다(/performances/compare?ids=...). 가격·잔여석·다음 회차는
    브라우저가 알 수 없는 값이고, 주소에 id 가 들어가 있어 "이 셋 중에 뭐 볼래?" 를 그대로
    남에게 보낼 수 있다.
-->
<th:block th:fragment="storage">
    <script>
    /*
        읽기(트레이·비교표)와 쓰기(상세)가 다른 화면에 있어서 저장 모양이 어긋나면 한쪽이
        조용히 아무것도 못 읽는다. 키·상한·항목 모양을 여기 한 곳에만 둔다.
        localStorage 접근을 전부 try 로 감싸는 이유는 fragment/recentviewed 주석과 같다.
    */
    window.__compare = (function () {
        var KEY = 'gaekseok.compare';

        /*
            화면에서의 상한. 서버(PerformanceCompareService.MAX_ITEMS)도 같은 수로 자르므로
            이 값이 어긋나도 표가 깨지지는 않는다 — 여기 것은 "더 담으면 안 된다"를 담기
            전에 알려주기 위한 것이고, 진짜 상한은 서버가 갖는다.
        */
        var MAX = 3;

        var listeners = [];

        function read() {
            try {
                var raw = localStorage.getItem(KEY);
                if (!raw) return [];
                var list = JSON.parse(raw);
                // 저장 모양이 바뀌었거나 손으로 고쳐 넣은 경우. 통째로 버린다 —
                // 후보 목록이라 복구할 가치가 없고, 반쯤 깨진 채로 그리는 게 더 나쁘다.
                return Array.isArray(list) ? list.filter(function (it) {
                    return it && typeof it.id === 'number' && typeof it.title === 'string';
                }).slice(0, MAX) : [];
            } catch (e) {
                return [];
            }
        }

        function write(list) {
            try {
                localStorage.setItem(KEY, JSON.stringify(list));
            } catch (e) {
                /* 용량 초과·저장 불가. 담기지 않을 뿐이라 조용히 넘긴다. */
            }
            listeners.forEach(function (fn) {
                try { fn(list); } catch (e) {}
            });
        }

        return {
            max: MAX,
            list: read,
            ids: function () {
                return read().map(function (it) { return it.id; });
            },
            has: function (id) {
                return read().some(function (it) { return it.id === id; });
            },
            /**
             * @return 'added' | 'exists' | 'full'. 호출부가 안내 문구를 고른다 —
             *         여기서 토스트까지 띄우면 이 조각이 화면을 알아야 한다.
             */
            add: function (item) {
                var list = read();
                if (list.some(function (it) { return it.id === item.id; })) return 'exists';
                if (list.length >= MAX) return 'full';
                list.push(item);
                write(list);
                return 'added';
            },
            remove: function (id) {
                write(read().filter(function (it) { return it.id !== id; }));
            },
            clear: function () {
                write([]);
            },
            /** 같은 화면 안의 버튼과 트레이가 서로를 다시 그리게 한다. */
            onChange: function (fn) {
                listeners.push(fn);
            }
        };
    })();
    </script>
</th:block>

<!--/*
    담기 버튼. 공연 상세의 액션 줄(찜 · 공유)에 함께 선다.

    상태를 서버가 모르므로(목록이 브라우저에 있다) 초기 표시는 스크립트가 정한다. 그래서
    버튼 바로 뒤에 인라인으로 둔다 — 뒤로 미루면 「담기」로 한 번 그려졌다가 「담음」으로
    바뀌는 게 눈에 보인다.
*/-->
<th:block th:fragment="toggle(perf)">
    <th:block th:replace="~{fragment/comparetray :: storage}"></th:block>
    <!--
        글자가 「비교」 두 자인 이유는 폭이다. 상세의 액션 줄은 포스터 칸(320px) 안에서
        flex-wrap: nowrap 으로 버튼들이 한 줄을 나눠 갖는데, 셋이 되면 칸 하나가 100px
        안팎이다. 「비교함에 담기」(약 128px)를 그대로 두면 찜·공유까지 같이 찌그러진다.
        무엇에 담는지는 title 과 눌렸을 때의 「비교 중」이 말해 준다.
    -->
    <button type="button" class="pf-compare" id="compareBtn" title="비교함에 담기"
            th:attr="data-performance-id=${perf.id}, data-title=${perf.title},
                     data-poster=${perf.posterUrl != null} ? @{/img/poster(u=${perf.posterUrl})} : ''"
            aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="6" width="4.5" height="8" rx="1" fill="currentColor"/>
            <rect x="9.5" y="2" width="4.5" height="12" rx="1" fill="none"
                  stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span class="compare-label">비교</span>
    </button>
    <script>
    (function () {
        var btn = document.getElementById('compareBtn');
        if (!btn || !window.__compare) return;

        var id = Number(btn.dataset.performanceId);
        var label = btn.querySelector('.compare-label');

        function paint() {
            var on = window.__compare.has(id);
            btn.setAttribute('aria-pressed', String(on));
            label.textContent = on ? '비교 중' : '비교';
            btn.title = on ? '비교함에서 빼기' : '비교함에 담기';
        }
        paint();
        window.__compare.onChange(paint);

        /*
            뒤로가기 캐시(bfcache) 대응. 이 버튼에서 "비교 중"으로 바꾼 뒤 다른 화면으로
            갔다가(예: 트레이에서 뺌) 브라우저 뒤로가기로 돌아오면, 크롬 등은 페이지를
            다시 불러오지 않고 떠날 때의 DOM 스냅샷을 그대로 복원한다 — 스크립트가 안
            돌아서 이 버튼이 실제로는 바뀐 상태(localStorage)를 안 따라간다.
            pageshow 의 event.persisted 가 그 복원 여부를 알려주므로, 그때만 한 번 더
            읽어서 다시 그린다.
        */
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) paint();
        });

        btn.addEventListener('click', function () {
            var toast = window.__toast || function () {};
            if (window.__compare.has(id)) {
                window.__compare.remove(id);
                toast('비교함에서 뺐습니다.');
                return;
            }
            var result = window.__compare.add({
                id: id,
                title: btn.dataset.title || '',
                // 포스터가 없는 공연이 꽤 있다. 빈 문자열이면 그리는 쪽이 첫 글자 폴백을
                // 쓴다 — null 을 넘기면 /img/poster?u= 로 프록시를 헛되이 부르게 된다.
                poster: btn.dataset.poster || ''
            });
            if (result === 'full') {
                toast('비교함은 ' + window.__compare.max + '개까지 담을 수 있어요.', 3000);
                return;
            }
            toast('비교함에 담았습니다. (' + window.__compare.list().length
                    + '/' + window.__compare.max + ')');
        });
    })();
    </script>
</th:block>

<!--/*
    화면 아래 고정 트레이. 담은 게 있을 때만 뜬다.

    상세에는 넣지 않는다 — 좁은 화면의 상세에는 이미 예매 CTA 가 화면 아래에 고정돼 있어서
    (body.page-detail .mobilebar) 둘이 겹친다. 상세에서 담은 결과는 버튼 상태와 토스트가
    알려주고, 트레이는 훑는 화면(홈 · 목록 · 찜 목록)에만 둔다. 어차피 "이제 비교하자" 는
    후보를 다 담고 목록으로 돌아온 자리에서 누르게 된다.
*/-->
<th:block th:fragment="tray">
    <th:block th:replace="~{fragment/comparetray :: storage}"></th:block>
    <div class="ctray" id="ctray" hidden role="region" aria-label="비교함">
        <div class="ctray-inner">
            <p class="ctray-head">비교함 <em id="ctrayCount">0</em></p>
            <div class="ctray-items" id="ctrayItems"></div>
            <div class="ctray-actions">
                <button type="button" class="ctray-clear" id="ctrayClear">비우기</button>
                <a class="ctray-go" id="ctrayGo" href="#">비교하기</a>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
    (function () {
        var tray = document.getElementById('ctray');
        if (!tray || !window.__compare) return;

        var items = document.getElementById('ctrayItems');
        var count = document.getElementById('ctrayCount');
        var go = document.getElementById('ctrayGo');
        // 컨텍스트 경로가 붙는 배포에서도 맞도록 @{} 로 뽑는다. 문자열을 직접 박으면
        // 이 트레이에서만 링크가 깨진다.
        var comparePath = /*[[@{/performances/compare}]]*/ '/performances/compare';
        var performancePath = /*[[@{/performances/}]]*/ '/performances/';

        /*
            트레이 높이를 실측해 CSS 로 넘긴다. 고정값으로 두면 안 되는 이유는 좌석도
            예매 바에서 겪은 것과 같다 — 담은 개수·제목 길이에 따라 높이가 변하는데
            상수로 두면 본문 마지막 줄이나 토스트가 트레이 뒤로 들어간다.
        */
        function measure() {
            document.body.style.setProperty('--ctray-h', tray.hidden ? '0px' : tray.offsetHeight + 'px');
        }
        if (window.ResizeObserver) {
            new ResizeObserver(measure).observe(tray);
        }

        function render(list) {
            items.textContent = '';
            count.textContent = String(list.length);

            list.forEach(function (it) {
                var row = document.createElement('div');
                row.className = 'ctray-item';

                var link = document.createElement('a');
                link.className = 'ctray-thumb';
                link.href = performancePath + it.id;
                // 제목은 textContent 로만 넣는다 — innerHTML 로 만들면 저장된 문자열이
                // 그대로 마크업이 된다.
                link.title = it.title;
                if (it.poster) {
                    var img = document.createElement('img');
                    img.src = it.poster;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.addEventListener('error', function () {
                        img.remove();
                        link.classList.add('no-img');
                    });
                    link.appendChild(img);
                } else {
                    link.classList.add('no-img');
                }
                var fallback = document.createElement('span');
                fallback.className = 'ctray-fallback';
                fallback.setAttribute('aria-hidden', 'true');
                fallback.textContent = it.title.slice(0, 1);
                link.appendChild(fallback);

                var drop = document.createElement('button');
                drop.type = 'button';
                drop.className = 'ctray-drop';
                // 아이콘만 있는 버튼이라 이름을 따로 준다. "빼기" 하나면 어느 걸 빼는지
                // 모른다 — 목록에 같은 모양 버튼이 셋까지 늘어선다.
                drop.setAttribute('aria-label', it.title + ' 비교함에서 빼기');
                drop.textContent = '×';
                drop.addEventListener('click', function () {
                    window.__compare.remove(it.id);
                });

                row.appendChild(link);
                row.appendChild(drop);
                items.appendChild(row);
            });

            var enough = list.length >= 2;
            go.href = comparePath + '?ids=' + list.map(function (it) { return it.id; }).join(',');
            go.classList.toggle('is-disabled', !enough);
            go.setAttribute('aria-disabled', String(!enough));

            tray.hidden = list.length === 0;
            document.body.classList.toggle('has-ctray', !tray.hidden);
            measure();
        }

        /*
            한 개만 담고 누르면 막되, 왜 막혔는지 말해 준다. 버튼을 disabled 로 두면
            포커스도 못 받아서 키보드로는 이유를 알 방법이 아예 없다.
        */
        go.addEventListener('click', function (e) {
            if (go.classList.contains('is-disabled')) {
                e.preventDefault();
                (window.__toast || function () {})('두 개 이상 담아야 비교할 수 있어요.', 3000);
            }
        });

        document.getElementById('ctrayClear').addEventListener('click', function () {
            window.__compare.clear();
        });

        window.__compare.onChange(render);
        render(window.__compare.list());

        // 위 compareBtn 의 pageshow 대응과 같은 이유. 상세에서 담고 뒤로가기로 이
        // 화면에 돌아오면 bfcache 가 "담기 전" 스냅샷을 그대로 복원해, 방금 담은 게
        // 트레이에 바로 안 보이는 것처럼 보였다.
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) render(window.__compare.list());
        });
    })();
    </script>
</th:block>
</body>
</html>
