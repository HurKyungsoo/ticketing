<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
    공유 시트. 공연 상세와 결제 완료가 같이 쓴다.

    쓰는 쪽은 세 가지를 하면 된다:
      ① id="shareBtn" 인 버튼에 data-url / data-title / data-description / data-image 를 단다
         (모양·문구는 화면마다 다르므로 버튼 자체는 각 화면이 그린다)
      ② body 끝에 sheet 조각을 넣는다
      ③ sheetScript 조각과 sdk 조각을 넣는다(toast 조각보다 뒤에 — 실패 안내에 __toast 를 쓴다)
    모델에 seo(SeoView.Meta)와 kakaoJsKey 가 있어야 한다 — ShareMetaView 가 둘을 같이 넣는다.

    한 벌로 합친 이유: 결제 완료에 공유를 붙이면서 상세의 시트·스크립트·SDK 초기화
    100 여 줄을 그대로 복제할 뻔했다. 카카오 SDK 버전이나 실패 문구를 고칠 때 한쪽만
    고쳐지는 자리가 되고, 그 어긋남은 실제로 공유를 눌러보기 전엔 안 보인다.

    **조각 이름을 HTML 태그명과 겹치게 지으면 안 된다.** 처음에 이 조각을 "script" 로
    지었더니, th:replace="~{... :: script}" 가 th:fragment="script" 뿐 아니라 이 파일의
    <script> 요소를 전부 같이 골라서 끼워 넣었다 — 조각 선택자는 이름만 보는 게 아니라
    마크업 선택자(태그명·id·class 도 매칭)이기 때문이다. 그래서 아래 sdk 조각의
    th:if 게이팅을 건너뛴 채 카카오 SDK 가 키 없이도 로딩됐다. 화면은 멀쩡해 보이고
    (init 은 null 로 스킵된다) 개발자도구를 열어 요청을 봐야 알 수 있는 종류다.
*/-->

<!--/*
    시트 본체. 채널을 시트에서 고르게 하는 방식(카톡/링크복사)이라 popover 대신 화면 전체를
    덮는 dialog 로 둔다 — 배경을 눌러도 뒤 화면 조작이 안 되는 게 맞다(그러라고 어둡게 깐다).
    카카오톡 옵션은 JS 키가 없으면(미발급) 아예 안 그린다.
*/-->
<th:block th:fragment="sheet">
    <div class="sharesheet-backdrop" id="shareSheetBackdrop"></div>
    <div class="sharesheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shareSheetTitle">
        <div class="sharesheet-head">
            <h3 id="shareSheetTitle">공유하기</h3>
            <button type="button" class="sharesheet-close" id="shareSheetClose" aria-label="닫기">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M2 2l12 12M14 2 2 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="sharesheet-options">
            <button type="button" class="sharesheet-option" id="kakaoShareOption" th:if="${kakaoJsKey != null}">
                <span class="sharesheet-icon sharesheet-icon-kakao">
                    <svg width="26" height="26" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="#000000" d="M9 2C4.582 2 1 4.94 1 8.56c0 2.32 1.53 4.36 3.84 5.53-.17.62-.6 2.19-.69 2.53-.11.42.16.42.33.3.14-.1 2.2-1.49 3.09-2.1.47.07.95.1 1.43.1 4.418 0 8-2.94 8-6.56C17 4.94 13.418 2 9 2z"/>
                    </svg>
                </span>
                카카오톡
            </button>
            <button type="button" class="sharesheet-option" id="copyLinkOption">
                <span class="sharesheet-icon sharesheet-icon-link">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                링크복사
            </button>
        </div>
    </div>
</th:block>

<th:block th:fragment="sheetScript">
<script>
(function () {
    var toast = window.__toast;

    var shareBtn = document.getElementById('shareBtn');
    var backdrop = document.getElementById('shareSheetBackdrop');
    var sheet = document.getElementById('shareSheet');
    var closeBtn = document.getElementById('shareSheetClose');
    var kakaoOption = document.getElementById('kakaoShareOption');
    var linkOption = document.getElementById('copyLinkOption');
    if (!shareBtn || !sheet) return;

    function openSheet() {
        backdrop.classList.add('open');
        sheet.classList.add('open');
        shareBtn.setAttribute('aria-expanded', 'true');
    }
    function closeSheet() {
        backdrop.classList.remove('open');
        sheet.classList.remove('open');
        shareBtn.setAttribute('aria-expanded', 'false');
    }

    shareBtn.addEventListener('click', openSheet);
    closeBtn.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
    });

    /**
     * 마지막 폴백. clipboard API 는 보안 컨텍스트(https·localhost)에서만 동작해서,
     * 사내망이나 IP 접속 같은 http 환경에서는 없는 것과 같다. 그때도 최소한
     * "주소를 직접 복사할 수 있는 상태"까지는 만들어 준다.
     */
    function legacyCopy(url) {
        var input = document.createElement('input');
        input.value = url;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(input);
        return ok;
    }

    async function copyLink() {
        var url = shareBtn.dataset.url;
        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(url);
                toast('링크를 복사했습니다');
                return;
            } catch (e) { /* 아래 폴백으로 */ }
        }
        toast(legacyCopy(url) ? '링크를 복사했습니다' : '복사에 실패했습니다. 주소창의 주소를 사용해 주세요.');
    }

    /** 카카오톡 카드형 공유(제목+설명+이미지+버튼). kakaoOption 이 안 그려졌으면(키 미발급)
        이 리스너 자체가 안 붙는다. */
    function kakaoShare() {
        var url = shareBtn.dataset.url;
        var title = shareBtn.dataset.title;
        var link = { mobileWebUrl: url, webUrl: url };
        var buttons = [{ title: '공연 보러가기', link: link }];
        var image = shareBtn.dataset.image;
        var params = image
            ? { objectType: 'feed', content: { title: title, description: shareBtn.dataset.description, imageUrl: image, link: link }, buttons: buttons }
            : { objectType: 'text', text: title + '\n' + shareBtn.dataset.description, link: link, buttons: buttons };
        if (!window.Kakao || !window.Kakao.isInitialized()) {
            toast('카카오톡 공유를 사용할 수 없습니다. 잠시 후 다시 시도해 주세요.');
            return;
        }
        try {
            window.Kakao.Share.sendDefault(params);
        } catch (e) {
            // 도메인이 카카오 콘솔에 등록 안 됐거나 팝업이 차단된 경우 등 — SDK 내부에서 던진다.
            toast('카카오톡 공유를 열지 못했습니다. 잠시 후 다시 시도해 주세요.');
        }
    }

    if (kakaoOption) {
        kakaoOption.addEventListener('click', function () { closeSheet(); kakaoShare(); });
    }
    linkOption.addEventListener('click', function () { closeSheet(); copyLink(); });
})();
</script>
</th:block>

<!--/*
    카카오 JS 키가 있을 때만 SDK 를 받는다(시트의 카카오톡 옵션도 같은 조건으로 안 그려진다).
    초기화만 하고, 실제 공유 호출은 위 sheetScript 조각의 kakaoShare() 가
    window.Kakao.isInitialized() 로 확인해서 쓴다.
*/-->
<th:block th:fragment="sdk">
    <th:block th:if="${kakaoJsKey != null}">
        <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
        <script th:inline="javascript">
          (function () {
            // 도메인이 카카오 콘솔의 "Web 플랫폼"에 등록 안 돼 있으면 init 은 되지만 이후
            // sendDefault 호출에서 KOE101 로 실패한다 — 그건 kakaoShare() 의 try/catch 가 잡는다.
            if (window.Kakao && !window.Kakao.isInitialized()) {
              window.Kakao.init(/*[[${kakaoJsKey}]]*/ '');
            }
          })();
        </script>
    </th:block>
</th:block>
</body>
</html>
