<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공연 목록 - 객석</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
    <th:block th:replace="~{fragment/head :: meta(${seo})}"></th:block>
</head>
<body class="page-list tone-light">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='공공데이터 기반 공연 예매', showAuthNav=true)}"></header>

    <!--
        헤더는 홈과 마찬가지로 화면 폭을 꽉 채우고(아래 가로선이 끝까지 이어진다),
        본문만 이 안쪽 컨테이너가 가운데로 모은다. 헤더까지 .wrap 폭에 갇혀 있으면
        홈에서 목록으로 넘어오는 순간 헤더 폭과 구분선 길이가 눈에 띄게 바뀐다.
    -->
    <div class="listinner">

    <button type="button" class="mobile-filter-btn" id="mobileFilterOpen">
        필터
        <em th:text="${#numbers.formatInteger(result.total,0,'COMMA')}">328</em>
    </button>

    <!--
        필터는 전부 이 폼 하나에 들어있다. genre/venue/status 도 <a> 링크가 아니라 라디오로 만든
        이유는, 링크마다 다른 필터값을 URL 에 일일이 다시 실어주다가 하나라도 빠뜨리면 조건이
        유실되기 때문 (LIBRE 에서 겪은 버그). 폼 하나면 제출 시 모든 필드가 자동으로 같이 실려간다.
    -->
    <form class="filterpanel" id="filterPanel" th:action="@{/performances}" method="get">
        <div class="fp-head">
            <span class="fp-title">필터</span>
            <button type="button" class="fp-close" id="mobileFilterClose" aria-label="닫기">×</button>
        </div>

        <input type="hidden" name="page" value="0">

        <label class="fp-keyword">
            <!-- currentColor 로 두어 .fp-keyword 의 글자색을 따라간다. 종전엔 개편 전 팔레트의
                 보라 회색(#6B6480)이 박혀 있어서, 라이트 톤으로 바꾼 뒤에도 이 아이콘만
                 옛 색으로 남아 있었다. -->
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:rgba(17,18,20,.45)"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M11.5 11.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="text" name="keyword" placeholder="공연명, 아티스트로 검색" th:value="${keyword}">
        </label>

        <div class="fp-grid">
            <div class="fp-col">
                <div class="fp-row">
                    <span class="fp-label">장르</span>
                    <div class="fp-pills">
                        <label class="cattab" th:each="c : ${result.categories}" th:classappend="${c.selected} ? ' active'">
                            <input type="radio" name="genre" th:value="${c.value}" th:checked="${c.selected}">
                            <span th:text="${c.label}">전체</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="fp-col">
                <div class="fp-row">
                    <span class="fp-label">진행 현황</span>
                    <div class="fp-pills">
                        <label class="cattab" th:classappend="${status == 'all'} ? ' active'">
                            <input type="radio" name="status" value="all" th:checked="${status == 'all'}">
                            <span>전체</span>
                        </label>
                        <label class="cattab" th:classappend="${status == 'ongoing'} ? ' active'">
                            <input type="radio" name="status" value="ongoing" th:checked="${status == 'ongoing'}">
                            <span>진행·예정작</span>
                        </label>
                        <label class="cattab" th:classappend="${status == 'ended'} ? ' active'">
                            <input type="radio" name="status" value="ended" th:checked="${status == 'ended'}">
                            <span>종료작</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 자주 쓰는 지역·월은 바로 보이고, 공연장·요일·시간대는 상세 조건으로 접는다.
                 첫 진입에서 모든 선택지를 훑게 만들지 않으면서도 조건은 하나도 줄이지 않는다. -->
            <div class="fp-col fp-col-wide">
                <div class="fp-row">
                    <span class="fp-label">지역 · 날짜</span>
                    <div class="fp-dropdowns">
                        <select name="area" aria-label="지역">
                            <option value="all" th:selected="${area == 'all'}">지역 전체</option>
                            <option th:each="a : ${regions}" th:value="${a}" th:text="${a}" th:selected="${a == area}"></option>
                        </select>
                        <select name="month" aria-label="월 선택">
                            <option value="all" th:selected="${month == 'all'}">월 전체</option>
                            <option th:each="m : ${result.months}" th:value="${m.value}"
                                    th:text="${m.label + ' (' + #numbers.formatInteger(m.count,0,'COMMA') + ')'}"
                                    th:selected="${m.selected}">8월 (42)</option>
                        </select>
                        <span class="fp-hint" th:classappend="${area != 'all'} ? ' fp-hint--hidden'">지역을 먼저 고르면 그 지역 공연장이 다 나와요</span>
                    </div>
                </div>
            </div>

            <!-- 상세 조건을 이미 적용했다면 결과를 왜 보고 있는지 감춰지지 않게 처음부터 연다. -->
            <details class="fp-advanced"
                     th:open="${venue != 'all' or dayOfWeek != 'all' or timeSlot != 'all'}">
                <summary>
                    <span>상세 조건</span>
                    <em th:if="${venue != 'all' or dayOfWeek != 'all' or timeSlot != 'all'}">적용됨</em>
                </summary>
                <div class="fp-advanced-body">
                    <div class="fp-row">
                        <span class="fp-label">공연장</span>
                        <div class="fp-dropdowns">
                            <select name="venue" aria-label="공연장">
                                <option value="all" th:selected="${venue == 'all'}">공연장 전체</option>
                                <option th:each="v : ${result.venues}" th:if="${v.value != null}"
                                        th:value="${v.value}" th:text="${v.label + ' (' + #numbers.formatInteger(v.count,0,'COMMA') + ')'}"
                                        th:selected="${v.selected}">공연장명 (12)</option>
                                <option th:each="v : ${result.venues}" th:if="${v.value == null}" disabled
                                        th:text="${v.label + ' ' + #numbers.formatInteger(v.count,0,'COMMA') + '건'}">기타 30건</option>
                            </select>
                        </div>
                    </div>
                    <div class="fp-row">
                        <span class="fp-label">요일 · 시간</span>
                        <div class="fp-dropdowns">
                        <!--
                            요일. 주중/주말을 위에 따로 둔 건 실데이터 분포 때문이다 —
                            주말에만 하는 공연 48.5%, 평일에만 하는 공연 33.8% 로 두 덩어리가
                            뚜렷하다. 개별 요일도 남긴다(월요일은 4.4% 라 잘 걸러진다).
                            시간대와 마찬가지로 건수는 붙이지 않는다(패싯 쿼리를 늘리지 않는다).
                        -->
                        <select name="dayOfWeek" aria-label="요일">
                            <option value="all"     th:selected="${dayOfWeek == 'all'}">요일 전체</option>
                            <option value="weekday" th:selected="${dayOfWeek == 'weekday'}">주중 (월~금)</option>
                            <option value="weekend" th:selected="${dayOfWeek == 'weekend'}">주말 (토·일)</option>
                            <option value="mon" th:selected="${dayOfWeek == 'mon'}">월요일</option>
                            <option value="tue" th:selected="${dayOfWeek == 'tue'}">화요일</option>
                            <option value="wed" th:selected="${dayOfWeek == 'wed'}">수요일</option>
                            <option value="thu" th:selected="${dayOfWeek == 'thu'}">목요일</option>
                            <option value="fri" th:selected="${dayOfWeek == 'fri'}">금요일</option>
                            <option value="sat" th:selected="${dayOfWeek == 'sat'}">토요일</option>
                            <option value="sun" th:selected="${dayOfWeek == 'sun'}">일요일</option>
                        </select>
                        <select name="timeSlot" aria-label="시간대">
                            <option value="all"       th:selected="${timeSlot == 'all'}">시간대 전체</option>
                            <option value="morning"   th:selected="${timeSlot == 'morning'}">오전(6~12시)</option>
                            <option value="afternoon" th:selected="${timeSlot == 'afternoon'}">오후(12~18시)</option>
                            <option value="evening"   th:selected="${timeSlot == 'evening'}">저녁(18시~)</option>
                        </select>
                        </div>
                    </div>
                </div>
            </details>
        </div>

        <button type="submit" class="fp-apply">적용하기</button>
    </form>
    <div class="fp-backdrop" id="filterBackdrop"></div>

    <!-- 결과 건수는 모바일 필터 버튼에만 있어서 데스크톱에서는 몇 건이 걸렸는지 알 수 없었다.
         필터를 걸었을 때 되돌릴 수단(초기화)도 여기에 같이 둔다. -->
    <div class="resultbar">
        <p class="resultcount">총 <strong th:text="${#numbers.formatInteger(result.total,0,'COMMA')}">328</strong>건</p>

        <!-- 결과가 0건일 때는 빈 화면 쪽에 더 눈에 띄는 초기화 버튼이 있으므로 여기서는 뺀다. -->
        <a class="resultreset" th:if="${filtersApplied and !result.performances.isEmpty()}"
           th:href="@{/performances}">필터 초기화</a>

        <!--
            정렬은 필터 폼과 따로 둔다 — 위치가 결과바라 같은 폼에 넣을 수 없어서, 현재
            필터값을 hidden 으로 전부 실어 보낸다. 하나라도 빠뜨리면 정렬을 바꾸는 순간
            그 조건이 사라지므로(페이저에 실제로 있던 버그다) 필터가 늘면 여기도 같이 늘려야 한다.
            page 를 0 으로 되돌리는 건, 정렬이 바뀌면 3페이지의 내용이 완전히 달라져서
            원래 보던 위치를 유지할 이유가 없기 때문이다.
        -->
        <form class="sortform" th:action="@{/performances}" method="get">
            <input type="hidden" name="genre" th:value="${genre}">
            <input type="hidden" name="month" th:value="${month}">
            <input type="hidden" name="dayOfWeek" th:value="${dayOfWeek}">
            <input type="hidden" name="timeSlot" th:value="${timeSlot}">
            <input type="hidden" name="status" th:value="${status}">
            <input type="hidden" name="venue" th:value="${venue}">
            <input type="hidden" name="area" th:value="${area}">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="page" value="0">
            <label class="sr-only" for="sortSelect">정렬</label>
            <!-- requestSubmit 인 이유는 위 필터 패널과 같다 — submit() 은 submit 이벤트를
                 안 일으켜 진행 막대가 이 이동만 놓친다. -->
            <select id="sortSelect" name="sort" onchange="this.form.requestSubmit ? this.form.requestSubmit() : this.form.submit()">
                <option th:each="s : ${result.sorts}" th:value="${s.value}" th:text="${s.label}"
                        th:selected="${s.selected}">추천순</option>
            </select>
        </form>
    </div>

    <div class="grid" th:if="${!result.performances.isEmpty()}">
        <a class="card" th:each="p : ${result.performances}" th:href="@{/performances/{id}(id=${p.id})}">
            <div class="poster" th:classappend="'gel-' + ${p.id % 6} + (${p.posterUrl == null} ? ' no-img' : '')">
                <span class="card-badge" th:text="${T(com.portfolio.ticket.domain.PerformanceCategory).valueOf(p.category).label()}">장르</span>
                <img th:if="${p.posterUrl != null}" th:src="@{/img/poster(u=${p.posterUrl})}" th:alt="${p.title}" loading="lazy"
                     onerror="this.remove(); this.parentElement.classList.add('no-img')">
                <div class="posterfallback" th:text="${#strings.substring(p.title, 0, 1)}">공</div>
            </div>
            <!--
                제목이 메타보다 먼저 와야 한다. 종전에는 순서가 뒤집혀 있어서
                ① 카드가 공연장·기간 덩어리처럼 보이고(제목이 부차적으로 읽힌다)
                ② 스크린리더가 어느 공연인지 모른 채 "대학로 자유극장 · 2026.07.08–…" 을
                   먼저 읽었다. h3 는 자기 메타보다 앞에 있어야 한다.
                공연장과 기간은 줄을 나눈다 — 한 줄에 이어 붙이면 공연장명이 긴 카드만
                두 줄로 접혀 카드 높이가 들쭉날쭉해진다(실데이터에서 흔하다).
            -->
            <h3 th:text="${p.title}">공연명</h3>
                <!--
                    날짜 두 줄. 회차는 "언제 가지", 기간은 "언제까지 볼 수 있지"에 답하는
                    서로 다른 정보라 둘 다 필요하다 — 종전에는 기간만 있어서 앞의 질문에
                    답이 없었고, 회차만 두면 뒤의 질문에 답이 없어진다. 행동에 더 가까운
                    회차를 앞·진하게, 기간을 뒤·흐리게 둔다.

                    회차는 알약으로 둔다. 메타의 나머지가 전부 맨 글자라, 여기 하나만 "면"을
                    가지면 색·굵기만 올릴 때와 달리 훑는 눈에 먼저 걸린다 — 제목과 크기
                    경쟁을 하지 않고도 띈다. 채우는 건 오늘·내일뿐이다: 전부 채우면 카드마다
                    브라스가 깔려서 "급하다"는 뜻이 사라진다(마감 임박 배지가 로즈를 아껴
                    쓰는 것과 같은 이유).

                    「다음 공연」 머리말은 화면에서 뺐다 — 알약 모양이 그 뜻을 하고, 좁은
                    카드에서 알약이 길어지면 오히려 안 읽힌다. 대신 .sr-only 로 남긴다:
                    안 남기면 스크린리더에 "8/27(목) 19:30"과 "6.4 – 8.30"이 무엇에 대한
                    날짜인지 없이 이어 읽힌다.

                    남은 회차가 없는 공연(기간은 안 끝났는데 회차가 다 지난 경우)은 기간만
                    적는다 — 그때 알약까지 그리면 같은 줄이 두 번 나온다.
                -->
                <p class="meta" th:with="next=${p.nextShow(today)}">
                    <span class="m-venue" th:text="${p.venue}">공연장</span>
                    <span class="m-date" th:if="${next != null}"
                          th:classappend="${next.soon} ? 'm-date--soon'">
                        <span class="sr-only">다음 공연 </span><span th:text="${next.text}">8/27(목) 19:30</span>
                    </span>
                    <span class="m-run">
                        <span class="sr-only" th:if="${next != null}">공연 기간 </span><span th:text="${p.runPeriod(today)}">6.4 – 8.30</span>
                    </span>
                </p>
        </a>
    </div>

    <!-- libraryEmpty(=수집된 공연이 아예 없음)일 때만 관리자용 안내를 띄운다.
         예전엔 result.total == 0 으로 판단해서, 단순히 검색어가 안 맞은 사용자에게도
         "POST /api/admin/sync" 안내가 그대로 노출됐다. -->
    <div class="empty-state" th:if="${result.performances.isEmpty()}">
        <th:block th:if="${result.libraryEmpty}">
            <p>아직 불러온 공연이 없습니다.</p>
            <p><code>POST /api/admin/sync</code> 로 공공데이터를 불러오세요.</p>
        </th:block>
        <th:block th:unless="${result.libraryEmpty}">
            <p>조건에 맞는 공연이 없습니다.</p>
            <p>검색어나 필터를 바꿔 다시 찾아보세요.</p>
            <a class="emptyreset" th:if="${filtersApplied}" th:href="@{/performances}">필터 초기화</a>
        </th:block>
    </div>

    <!--
        페이저 링크는 현재 조건을 하나도 빠짐없이 다시 실어야 한다. dayOfWeek 가 빠져 있어서
        요일을 걸고 2페이지로 넘어가면 요일 조건만 조용히 풀렸다 — 위 필터를 라디오/폼으로
        만든 것과 같은 이유의 버그가 여기 남아 있었다. 새 필터를 추가하면 이 5개 링크에도
        반드시 넣을 것.
    -->
    <nav class="pager" th:if="${result.totalPages > 1}">
        <!-- 처음/마지막 이동 버튼은 첫/마지막 페이지에서 자기 자신으로 가는 링크가 되므로,
             이전/다음 버튼과 같은 조건으로 숨긴다. -->
        <a class="pager-nav" th:if="${result.page > 0}"
           th:href="@{/performances(genre=${genre},month=${month},dayOfWeek=${dayOfWeek},timeSlot=${timeSlot},status=${status},venue=${venue},area=${area},keyword=${keyword},sort=${sort},page=0)}">«</a>
        <a class="pager-nav" th:if="${result.page > 0}"
           th:href="@{/performances(genre=${genre},month=${month},dayOfWeek=${dayOfWeek},timeSlot=${timeSlot},status=${status},venue=${venue},area=${area},keyword=${keyword},sort=${sort},page=${result.page - 1})}">‹</a>

        <a class="pager-num" th:each="p : ${result.pageWindow}"
           th:href="@{/performances(genre=${genre},month=${month},dayOfWeek=${dayOfWeek},timeSlot=${timeSlot},status=${status},venue=${venue},area=${area},keyword=${keyword},sort=${sort},page=${p})}"
           th:text="${p + 1}"
           th:classappend="${p == result.page} ? ' active'">1</a>

        <a class="pager-nav" th:if="${result.page + 1 < result.totalPages}"
           th:href="@{/performances(genre=${genre},month=${month},dayOfWeek=${dayOfWeek},timeSlot=${timeSlot},status=${status},venue=${venue},area=${area},keyword=${keyword},sort=${sort},page=${result.page + 1})}">›</a>
        <a class="pager-nav" th:if="${result.page + 1 < result.totalPages}"
           th:href="@{/performances(genre=${genre},month=${month},dayOfWeek=${dayOfWeek},timeSlot=${timeSlot},status=${status},venue=${venue},area=${area},keyword=${keyword},sort=${sort},page=${result.totalPages - 1})}">»</a>
    </nav>
    </div>
</div>

<script>
(function () {
    var form = document.getElementById('filterPanel');
    var isDesktop = function () { return window.matchMedia('(min-width: 860px)').matches; };

    form.querySelectorAll('input[type=radio], select').forEach(function (el) {
        el.addEventListener('change', function () {
            var pageInput = form.querySelector('input[name=page]');
            if (pageInput) { pageInput.value = '0'; }
            // submit() 이 아니라 requestSubmit(). submit() 은 submit 이벤트를 아예
            // 안 일으켜서, 필터를 바꿔 화면이 통째로 다시 뜨는 이 이동에만 진행 막대가
            // 안 떴다(fragment/navprogress).
            // requestSubmit 이 없는 옛 브라우저(사파리 16 미만)에서는 막대만 못 뜨고
            // 필터는 종전대로 동작해야 한다.
            if (!isDesktop()) return;
            if (form.requestSubmit) { form.requestSubmit(); } else { form.submit(); }
        });
    });

    var openBtn = document.getElementById('mobileFilterOpen');
    var closeBtn = document.getElementById('mobileFilterClose');
    var backdrop = document.getElementById('filterBackdrop');

    function openPanel() { form.classList.add('open'); if (backdrop) backdrop.classList.add('open'); }
    function closePanel() { form.classList.remove('open'); if (backdrop) backdrop.classList.remove('open'); }

    if (openBtn) openBtn.addEventListener('click', openPanel);
    if (closeBtn) closeBtn.addEventListener('click', closePanel);
    if (backdrop) backdrop.addEventListener('click', closePanel);
})();

(function () {
    // 모션을 끈 사용자나 IntersectionObserver 가 없는 환경에서는 아무것도 안 한다 —
    // .reveal 이 안 붙으면 카드는 CSS 기본값(불투명)으로 그냥 보인다.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) return;

    var grid = document.querySelector('.grid');
    if (!grid) return;
    grid.classList.add('reveal');

    var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                io.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    grid.querySelectorAll('.card').forEach(function (card) { io.observe(card); });
})();
</script>
</body>
</html>
