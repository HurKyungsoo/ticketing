<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${performance.title}">공연 상세</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-detail">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='회차 선택', showAuthNav=true)}"></header>

    <div class="detail">
        <div>
            <div class="poster" th:if="${performance.posterUrl != null}">
                <img th:src="@{/img/poster(u=${performance.posterUrl})}" th:alt="${performance.title}">
            </div>
        </div>

        <div>
            <h2 th:text="${performance.title}">공연명</h2>
            <p class="meta" th:text="${performance.genre}">장르</p>

            <h3 class="detail-heading">공연 정보</h3>
            <dl class="spec">
                <div><dt>공연장</dt><dd th:text="${performance.venue}">-</dd></div>
                <div>
                    <dt>주소</dt>
                    <dd>
                        <span th:text="${performance.address} ?: '-'">-</span>
                        <!-- 좌표가 있으면 목적지를 좌표로 넘겨 정확히 찍고, 없으면(수집 소스에 따라
                             10% 정도) 공연장명 검색으로 대체한다. 둘 다 네이버 지도가 알아서
                             PC 는 웹, 모바일은 앱으로 연결한다. -->
                        <a class="map-link" target="_blank" rel="noopener"
                           th:if="${performance.latitude != null and performance.longitude != null}"
                           th:href="|https://map.naver.com/p/directions/-/${performance.longitude},${performance.latitude},${#uris.escapePathSegment(performance.venue)}/-/transit|">길찾기</a>
                        <a class="map-link" target="_blank" rel="noopener"
                           th:if="${performance.latitude == null or performance.longitude == null}"
                           th:href="|https://map.naver.com/p/search/${#uris.escapePathSegment(performance.venue)}|">지도에서 찾기</a>
                    </dd>
                </div>
                <!-- 지도는 좌표와 API 키가 둘 다 있을 때만 그린다. 키 없이 스크립트를 부르면
                     화면에 인증 실패 오버레이가 뜨므로, 없으면 위 링크만 남긴다. -->
                <div th:if="${naverMapScriptUrl != null and performance.latitude != null and performance.longitude != null}">
                    <dt>위치</dt>
                    <dd style="flex: 1;">
                        <div id="venue-map" class="venue-map"
                             th:attr="data-lat=${performance.latitude},
                                      data-lng=${performance.longitude},
                                      data-name=${performance.venue}"></div>
                    </dd>
                </div>
                <div><dt>기간</dt>
                    <dd th:text="|${#temporals.format(performance.startDate,'yyyy.MM.dd')} – ${#temporals.format(performance.endDate,'yyyy.MM.dd')}|">-</dd>
                </div>
                <div><dt>객석수</dt><dd th:text="${performance.totalSeatCount} ?: '미상'">-</dd></div>
                <!-- 실제 좌석에 매겨진 등급별 가격(gradePrices)을 우선 쓴다 — 예매 시 실제로
                     결제되는 값이라 공공데이터 관람요금 문자열에서 뽑은 basePrice 보다 정확하다.
                     회차가 아직 없어 좌석이 없는 경우에만 basePrice 로 대체한다. -->
                <div th:if="${!gradePrices.isEmpty()}">
                    <dt>관람료</dt>
                    <dd>
                        <span th:each="g, iter : ${gradePrices}">
                            <span th:text="${g.grade}">VIP</span>
                            <span th:text="${g.price == 0} ? '무료' : ${#numbers.formatInteger(g.price,0,'COMMA')} + '원'"></span><span th:unless="${iter.last}"> · </span>
                        </span>
                    </dd>
                </div>
                <div th:if="${gradePrices.isEmpty() and performance.basePrice != null}">
                    <dt>관람료</dt>
                    <dd th:text="${performance.basePrice == 0} ? '무료' : ${#numbers.formatInteger(performance.basePrice,0,'COMMA')} + '원부터'">-</dd>
                </div>
                <!-- 관람연령/러닝타임/출연진은 KOPIS 수집분에만 있다(표준데이터·문화정보는 없음). -->
                <div th:if="${!#strings.isEmpty(performance.ageLimit)}">
                    <dt>관람연령</dt><dd th:text="${performance.ageLimit}">-</dd>
                </div>
                <div th:if="${!#strings.isEmpty(performance.runningTime)}">
                    <dt>러닝타임</dt><dd th:text="${performance.runningTime}">-</dd>
                </div>
                <div th:if="${!#strings.isEmpty(performance.castMembers)}">
                    <dt>출연진</dt><dd th:text="${performance.castMembers}">-</dd>
                </div>
            </dl>

            <!-- 공공데이터에 줄거리(KOPIS sty)가 없는 공연도 많아 없으면 섹션째 숨긴다.
                 원문의 줄바꿈은 th:text 로 그대로 이스케이프해 넣고 CSS white-space: pre-line 으로
                 표시한다 (th:utext 로 <br> 를 직접 심으면 XSS 위험이 생긴다). -->
            <th:block th:if="${!#strings.isEmpty(performance.description)}">
                <h3 class="detail-heading">공연 소개</h3>
                <p class="description" th:text="${performance.description}">설명</p>
            </th:block>

            <h3 class="detail-heading">회차 선택</h3>
            <div class="schedules">
                <a th:each="s : ${schedules}"
                   th:href="@{/schedules/{id}/seats(id=${s.id})}"
                   th:classappend="${s.remainingSeats == 0} ? 'soldout'">
                    <span th:text="${#temporals.format(s.showAt, 'M/d(E) HH:mm')}">일시</span>
                    <span th:text="${s.remainingSeats == 0} ? ' 매진' : ' · 잔여 ' + ${s.remainingSeats}"></span>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- 지도를 그리는 경우에만 스크립트를 내려받는다. 325KB 라 필요 없는 페이지에서 받을 이유가 없다. -->
<th:block th:if="${naverMapScriptUrl != null and performance.latitude != null and performance.longitude != null}">
    <script th:src="${naverMapScriptUrl}"></script>
    <script>
      (function () {
        var el = document.getElementById('venue-map');
        // 키가 잘못됐거나 스크립트가 막히면 naver.maps 가 없다. 이때는 조용히 넘어간다 —
        // 지도가 안 뜨는 것 때문에 페이지 전체가 깨지면 안 된다.
        if (!el || !window.naver || !window.naver.maps) return;

        var pos = new naver.maps.LatLng(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng));
        var map = new naver.maps.Map(el, { center: pos, zoom: 16 });
        new naver.maps.Marker({ position: pos, map: map, title: el.dataset.name });
      })();
    </script>
</th:block>
</body>
</html>
