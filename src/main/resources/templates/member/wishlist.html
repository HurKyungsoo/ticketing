<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마이페이지 - 찜한 공연</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<!-- 목록·홈과 같은 카드를 쓰므로 page-list 스코프를 함께 단다.
     page-mypage 는 예매 내역과 공유하는 것(헤더·상단 탭·안쪽 컨테이너)에 쓴다 —
     두 화면은 같은 탭으로 오가는 한 화면의 두 면이라 그 부분이 어긋나면 안 된다. -->
<body class="page-list page-mypage tone-light">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='마이페이지', showAuthNav=true)}"></header>

    <div class="mypageinner">

    <nav th:replace="~{fragment/mypagetabs :: tabs('wishlist')}"></nav>

    <div class="grid" th:if="${!wishes.isEmpty()}">
        <!--
            찜을 푸는 건 여기가 아니라 공연 상세에서 한다. 카드 전체가 링크(<a>)라 그 안에
            버튼을 넣으면 링크 안의 버튼이 되어, 어느 쪽이 눌린 건지 브라우저·스크린리더마다
            해석이 갈린다. 카드는 "들어가기"만 하게 두는 편이 낫다.
        -->
        <a class="card" th:each="w : ${wishes}" th:href="@{/performances/{id}(id=${w.performance.id})}">
            <div class="poster" th:classappend="'gel-' + ${w.performance.id % 6} + (${w.performance.posterUrl == null} ? ' no-img' : '')">
                <span class="card-badge" th:text="${w.performance.category != null}
                        ? ${w.performance.category.label()} : '기타'">장르</span>
                <img th:if="${w.performance.posterUrl != null}"
                     th:src="@{/img/poster(u=${w.performance.posterUrl})}" th:alt="${w.performance.title}" loading="lazy"
                     onerror="this.remove(); this.parentElement.classList.add('no-img')">
                <div class="posterfallback" th:text="${#strings.substring(w.performance.title, 0, 1)}">공</div>
            </div>
            <h3 th:text="${w.performance.title}">공연명</h3>
            <!-- 목록 카드와 같은 두 줄 규칙(list.html 주석 참고). 이 화면만 카드가 엔티티라
                 회차 문구는 서비스가 만들어 넘긴 것(nextShows)을 쓴다. -->
            <p class="meta" th:with="next=${nextShows[w.performance.id]},
                                     run=${T(com.portfolio.ticket.mapper.dto.PerformanceListRow).periodFor(w.performance.startDate, w.performance.endDate, today)}">
                <span class="m-venue" th:text="${w.performance.venue}">공연장</span>
                <span class="m-date" th:if="${next != null}"
                      th:classappend="${next.soon} ? 'm-date--soon'">
                    <span class="sr-only">다음 공연 </span><span th:text="${next.text}">8/27(목) 19:30</span>
                </span>
                <span class="m-run">
                    <span class="sr-only" th:if="${next != null}">공연 기간 </span><span th:text="${run}">6.4 – 8.30</span>
                </span>
            </p>
        </a>
    </div>

    <div class="empty-state" th:if="${wishes.isEmpty()}">
        <p>찜한 공연이 없습니다.</p>
        <p>공연 상세에서 <strong>찜하기</strong>를 누르면 여기에 모입니다.</p>
        <a class="emptyreset" th:href="@{/}">공연 보러 가기</a>
    </div>
    </div>
</div>
<!-- 트레이가 안내(두 개 이상 담아야 함)에 window.__toast 를 쓴다. 반드시 앞에 와야 한다. -->
<th:block th:replace="~{fragment/toast :: toast}"></th:block>
<!-- 비교함 트레이. 담은 게 있을 때만 뜬다(fragment/comparetray). -->
<th:block th:replace="~{fragment/comparetray :: tray}"></th:block>
</body>
</html>
