<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-auth tone-light">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='비밀번호 찾기', showAuthNav=false)}"></header>

    <div class="authwrap">
        <div class="authcard" th:if="${!sent}">
            <div class="authhead">
                <h2>비밀번호 찾기</h2>
                <p>가입할 때 등록한 아이디와 이메일을 입력하세요.</p>
            </div>

            <form class="authform" th:action="@{/password-reset}" method="post">
                <label>
                    아이디
                    <input type="text" name="loginId" required autofocus autocomplete="username">
                </label>
                <label>
                    이메일
                    <input type="email" name="email" required autocomplete="email">
                </label>

                <button type="submit">재설정 링크 보내기</button>
            </form>

            <p class="authlink"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
        </div>

        <!-- 아이디/이메일이 안 맞아도 이 화면과 완전히 같다 — 계정 존재 여부가 응답으로 드러나면 안 된다. -->
        <div class="authcard" th:if="${sent}">
            <div class="authhead">
                <h2>메일을 확인하세요</h2>
                <p>
                    입력하신 정보가 가입 내역과 일치하면 재설정 링크를 보내드렸습니다.<br>
                    메일이 오지 않는다면 아이디·이메일을 다시 확인해주세요.
                </p>
            </div>
            <p class="authlink"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
        </div>
    </div>
</div>
</body>
</html>
