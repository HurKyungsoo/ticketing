<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body>
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='새 비밀번호 설정', showAuthNav=false)}"></header>

    <div class="authwrap">
        <div class="authcard" th:if="${valid}">
            <div class="authhead">
                <h2>새 비밀번호 설정</h2>
                <p>새로 쓸 비밀번호를 입력하세요.</p>
            </div>

            <p class="autherror" th:if="${error}" th:text="${error}">에러</p>

            <form class="authform" th:action="@{'/password-reset/' + ${token}}" method="post">
                <label>
                    새 비밀번호
                    <input type="password" name="password" required autocomplete="new-password" minlength="8">
                </label>
                <label>
                    새 비밀번호 확인
                    <input type="password" name="passwordConfirm" required autocomplete="new-password" minlength="8">
                </label>

                <button type="submit">비밀번호 변경</button>
            </form>
        </div>

        <div class="authcard" th:unless="${valid}">
            <div class="authhead">
                <h2>링크가 유효하지 않습니다</h2>
                <p>이미 사용됐거나 30분이 지나 만료된 링크입니다.</p>
            </div>
            <p class="authlink"><a th:href="@{/password-reset}">다시 요청하기</a></p>
        </div>
    </div>
</div>
</body>
</html>
