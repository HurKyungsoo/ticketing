<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>마이페이지 - 예매 내역</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-mypage tone-light">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='마이페이지', showAuthNav=true)}"></header>

    <!-- 헤더는 화면 폭을 꽉 채우고 본문만 이 안쪽 컨테이너가 가운데로 모은다
         (목록·상세와 같은 처리). -->
    <div class="mypageinner">

    <nav th:replace="~{fragment/mypagetabs :: tabs('reservations')}"></nav>

    <div class="reslist" th:if="${!reservations.isEmpty()}">
        <div class="resrow" th:each="r : ${reservations}">
            <!-- 공연 정보는 예매가 직접 든 회차에서 가져온다. 좌석을 거치면 취소된 예매(좌석 0개)가
                 화면에서 통째로 사라진다. 좌석 표기도 예매 시점 스냅샷을 쓴다.

                 클릭하면 아래 공유 팝업(포스터+정보+좌석)이 뜬다 — data-* 로 필요한 값만
                 미리 실어 두고, 모달 자체는 화면에 하나만 두고 값을 갈아끼운다(예매 건수만큼
                 모달을 복제하면 DOM 이 쓸데없이 커진다). 포스터가 없는 공연은 data-poster 를
                 아예 안 실어서(th:attr 이 null 이면 속성 자체를 안 그린다) JS 가 폴백을 그린다.
                 취소·만료 건도 똑같이 눌리게 둔다 — 그때 뭘 봤었는지 확인하는 것도 유효한
                 용도라 상태로 막을 이유가 없다. -->
            <div class="resinfo" role="button" tabindex="0"
                 th:with="share=${shareMetas.get(r.reservationNo)}"
                 th:attr="data-title=${r.schedule.performance.title},
                          data-venue=${r.schedule.performance.venue},
                          data-datetime=${#temporals.format(r.schedule.showAt, 'yyyy.M.d(E) HH:mm')},
                          data-seat=${r.seatSummary},
                          data-poster=${r.schedule.performance.posterUrl != null} ? @{/img/poster(u=${r.schedule.performance.posterUrl})},
                          data-share-url=${share.canonicalUrl},
                          data-share-title=${share.title},
                          data-share-description=${share.description},
                          data-share-image=${share.imageUrl}">
                <!--
                    포스터 썸네일. 목록을 훑을 때 제목보다 그림이 먼저 걸려서 "그 공연"을 빨리 찾는다.

                    alt 는 비운다(장식). 바로 옆에 같은 공연명이 글자로 있어서 alt 를 채우면
                    스크린리더가 제목을 두 번 읽는다.

                    포스터가 없는 공연은(수집분에 꽤 있다) 목록 카드와 같은 폴백 —
                    그라데이션 + 공연명 첫 글자. 이미지 로딩이 실패할 때도 onerror 로 같은 자리로 온다.
                -->
                <div class="resthumb" th:classappend="${r.schedule.performance.posterUrl == null} ? 'no-img'"
                     aria-hidden="true">
                    <img th:if="${r.schedule.performance.posterUrl != null}"
                         th:src="@{/img/poster(u=${r.schedule.performance.posterUrl})}" alt="" loading="lazy"
                         onerror="this.remove(); this.parentElement.classList.add('no-img')">
                    <span class="resthumb-fallback"
                          th:text="${#strings.substring(r.schedule.performance.title, 0, 1)}">공</span>
                </div>

                <div class="restext">
                    <p class="restitle" th:text="${r.schedule.performance.title}">공연명</p>
                    <p class="resmeta">
                        <span th:text="${#temporals.format(r.schedule.showAt, 'yyyy.M.d(E) HH:mm')}">일시</span> ·
                        <span th:text="${r.seatSummary}">좌석</span> ·
                        <span th:text="${#numbers.formatInteger(r.amount,0,'COMMA')} + '원'">금액</span>
                    </p>
                    <p class="resno">
                        예매번호 <span th:text="${r.reservationNo}">번호</span> ·
                        <span th:text="${#temporals.format(r.createdAt, 'yyyy.M.d HH:mm')}">예매일</span>
                    </p>
                </div>
            </div>

            <div class="resaction">
                <span class="badge" th:switch="${r.status.name()}" th:classappend="'badge-' + ${r.status}">
                    <th:block th:case="'PENDING'">결제 대기</th:block>
                    <th:block th:case="'CONFIRMED'">예매 확정</th:block>
                    <th:block th:case="'CANCELED'">취소됨</th:block>
                    <th:block th:case="'EXPIRED'">선점 만료</th:block>
                </span>

                <a class="btn-pay" th:if="${r.status.name() == 'PENDING' and !r.isHoldExpired(now)}"
                   th:href="@{/reservations/{no}/payment(no=${r.reservationNo})}">결제하기</a>

                <button type="button" class="btn-cancel"
                        th:if="${r.status.name() == 'CONFIRMED' or (r.status.name() == 'PENDING' and !r.isHoldExpired(now))}"
                        th:attr="data-reservation-no=${r.reservationNo}, data-status=${r.status}">
                    취소
                </button>

                <!-- 삭제는 취소·만료된 건만 — 결제 대기·확정 건은 아직 유효한 표라 지우면
                     관람일에 뭘 예매했는지 볼 방법이 없어진다(서버의 Reservation.hide() 가
                     같은 규칙으로 한 번 더 막는다). 행을 실제로 지우는 게 아니라 이 계정의
                     목록에서만 빼는 것이라 "취소"와 문구를 분명히 다르게 뒀다. -->
                <button type="button" class="btn-delete"
                        th:if="${r.status.name() == 'CANCELED' or r.status.name() == 'EXPIRED'}"
                        th:attr="data-reservation-no=${r.reservationNo}">
                    삭제
                </button>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${reservations.isEmpty()}">
        <p>예매 내역이 없습니다.</p>
        <p><a class="emptyreset" th:href="@{/}">공연 보러 가기</a></p>
    </div>
    </div>
</div>

<!-- 예매 건 클릭 시 뜨는 요약 팝업. 공유 시트(공연 상세)와 같은 배경+dialog 구조라 그때
     정한 규칙을 그대로 따른다: 배경을 눌러도 뒤 화면 조작이 안 되고, Esc·배경·닫기 버튼
     셋 다 닫는다. -->
<div class="resmodal-backdrop" id="resModalBackdrop"></div>
<div class="resmodal" id="resModal" role="dialog" aria-modal="true" aria-labelledby="resModalTitle">
    <button type="button" class="resmodal-close" id="resModalClose" aria-label="닫기">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 2l12 12M14 2 2 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
    </button>
    <div class="resmodal-poster">
        <img id="resModalPoster" alt="">
        <!-- 포스터가 없는 공연의 폴백. 공연 상세의 .poster.no-img 와 같은 발상(그라데이션 +
             공연명 첫 글자)이되, 여기는 팝업이라 훨씬 작아서 첫 글자만 남긴다. -->
        <div class="resmodal-posterfallback" id="resModalPosterFallback" aria-hidden="true"></div>
    </div>
    <div class="resmodal-body">
        <h3 id="resModalTitle">공연명</h3>
        <dl class="resmodal-spec">
            <div><dt>공연장</dt><dd id="resModalVenue">-</dd></div>
            <div><dt>일시</dt><dd id="resModalDatetime">-</dd></div>
            <div><dt>좌석</dt><dd id="resModalSeat">-</dd></div>
        </dl>

        <!--
            「공유」. data-* 는 팝업을 열 때 그 행의 값으로 갈아끼운다 — 팝업이
            화면에 하나뿐인 것과 같은 이유다(예매 건수만큼 시트를 복제할 이유가 없다).

            공유되는 건 예매가 아니라 공연이다 — 링크는 공연 상세를 가리키고 예매번호·좌석은
            안 들어간다. 이 팝업에는 좌석이 떠 있지만 그건 본인 확인용이라 밖으로 나가면 안 된다.

            누르면 이 팝업을 닫고 공유 시트를 연다. 겹쳐 띄우지 않는 이유는 둘 다 같은
            z-index(70/71)를 쓰는 dialog 라, 포개면 어두운 배경이 두 겹으로 깔리고 어느 쪽이
            위인지가 DOM 순서에 의존하게 된다.
        -->
        <button type="button" class="resmodal-share" id="shareBtn"
                aria-haspopup="dialog" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M11 5.5a2 2 0 1 0-1.9-2.6L6 4.6a2 2 0 1 0 0 2.8l3.1 1.7a2 2 0 1 0 .5-1L6.5 6.4a2 2 0 0 0 0-.8l3.1-1.7c.36.38.86.6 1.4.6Z"
                      fill="currentColor"/>
            </svg>
            공유
        </button>
    </div>
</div>

<th:block th:replace="~{fragment/sharesheet :: sheet}"></th:block>

<script th:inline="javascript">
    const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]').content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').content;

    document.querySelectorAll('.btn-cancel').forEach(btn => {
        btn.addEventListener('click', async () => {
            const reservationNo = btn.dataset.reservationNo;
            const status = btn.dataset.status;
            const confirmMessage = status === 'CONFIRMED'
                ? '취소하시겠습니까? 관람일에 따라 환불 수수료가 부과될 수 있습니다.'
                : '선점을 취소하시겠습니까?';
            if (!confirm(confirmMessage)) return;

            btn.disabled = true;
            try {
                const res = await fetch(`/api/reservations/${reservationNo}/cancel`, {
                    method: 'POST',
                    headers: { [CSRF_HEADER]: CSRF_TOKEN }
                });
                const data = await res.json();

                if (res.ok) {
                    /*
                       성공 안내를 이 자리에서 alert 로 띄우던 걸 없앴다 — alert 은 블로킹이라
                       "확인"을 누르기 전까지 화면이 멈추고, 그 멈춰 있는 동안에만 환불금액이
                       보이는 구조였다(닫는 순간 곧바로 location.reload()). 토스트로 단순
                       교체하면 reload 가 그 즉시 일어나서 토스트가 뜨기도 전에 화면이
                       사라진다 — 환불금액을 아예 못 보게 되는 퇴보다.

                       그래서 안내문을 새로고침 너머로 넘긴다: sessionStorage 에 적어두고
                       reload 한 뒤, 이 스크립트 맨 아래(새 페이지가 로드된 뒤)에서 다시 읽어
                       토스트로 띄운다. 새로고침 한 번짜리 임시 값이라 쿼리 파라미터로 주소를
                       지저분하게 만들 필요는 없다 — sessionStorage 는 탭이 닫히면 알아서
                       지워지고, 여기서는 읽자마자 즉시 지워서 나중에 수동 새로고침해도
                       엉뚱하게 다시 뜨지 않는다.
                    */
                    sessionStorage.setItem('reservationCancelToast', JSON.stringify({
                        message: status === 'CONFIRMED'
                            ? `취소되었습니다. 환불금액: ${data.refundAmount.toLocaleString()}원`
                            : '선점을 취소했습니다.',
                        // 환불금액은 숫자라 놓치면 다시 확인하기 번거롭다 — 기본 2.2초보다 길게.
                        ms: status === 'CONFIRMED' ? 4000 : 2200
                    }));
                    location.reload();
                } else {
                    window.__toast(data.message, 4000);
                    btn.disabled = false;
                }
            } catch (e) {
                window.__toast('요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.', 4000);
                btn.disabled = false;
            }
        });
    });

    document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async () => {
            const reservationNo = btn.dataset.reservationNo;
            if (!confirm('목록에서 삭제하시겠습니까? 취소·환불 이력은 그대로 보관됩니다.')) return;

            btn.disabled = true;
            try {
                const res = await fetch(`/api/reservations/${reservationNo}/hide`, {
                    method: 'POST',
                    headers: { [CSRF_HEADER]: CSRF_TOKEN }
                });

                if (res.ok) {
                    btn.closest('.resrow').remove();
                } else {
                    const data = await res.json();
                    window.__toast(data.message, 4000);
                    btn.disabled = false;
                }
            } catch (e) {
                window.__toast('요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.', 4000);
                btn.disabled = false;
            }
        });
    });

    (function () {
        const backdrop = document.getElementById('resModalBackdrop');
        const modal = document.getElementById('resModal');
        const closeBtn = document.getElementById('resModalClose');
        const posterImg = document.getElementById('resModalPoster');
        const posterFallback = document.getElementById('resModalPosterFallback');
        const titleEl = document.getElementById('resModalTitle');
        const venueEl = document.getElementById('resModalVenue');
        const datetimeEl = document.getElementById('resModalDatetime');
        const seatEl = document.getElementById('resModalSeat');
        const shareBtn = document.getElementById('shareBtn');
        if (!modal) return;

        function openModal(trigger) {
            titleEl.textContent = trigger.dataset.title;
            venueEl.textContent = trigger.dataset.venue || '-';
            datetimeEl.textContent = trigger.dataset.datetime;
            seatEl.textContent = trigger.dataset.seat;

            // 포스터 유무에 따라 실제 이미지/폴백(첫 글자) 중 하나만 보인다 — 공연 상세의
            // .poster.no-img 와 같은 발상. hidden 속성 대신 style.display 를 직접 건드린다
            // — .resmodal-poster img 에 이미 display:block 규칙이 있어서(공유 시트를 만들
            // 때도, 그 전 회차 상한 버그 때도 겪은 것과 같은 명시도 함정) hidden="" 만으로는
            // 안 먹는다. 인라인 스타일은 어떤 클래스 규칙보다도 이긴다.
            if (trigger.dataset.poster) {
                posterImg.src = trigger.dataset.poster;
                posterImg.alt = trigger.dataset.title;
                posterImg.style.display = '';
                posterFallback.style.display = 'none';
            } else {
                posterImg.removeAttribute('src');
                posterImg.style.display = 'none';
                posterFallback.style.display = 'flex';
                posterFallback.textContent = trigger.dataset.title.charAt(0);
            }

            // 공유 시트는 화면에 하나뿐이라(#shareBtn 도 하나) 어느 예매를 눌렀는지에 따라
            // payload 를 갈아끼운다. 시트 스크립트는 이 dataset 만 읽으므로 여기서 채워 두면 된다.
            if (shareBtn) {
                shareBtn.dataset.url = trigger.dataset.shareUrl;
                shareBtn.dataset.title = trigger.dataset.shareTitle;
                shareBtn.dataset.description = trigger.dataset.shareDescription || '';
                // 포스터가 없는 공연은 서버가 imageUrl 을 안 내려준다(속성 자체가 없다).
                // 빈 문자열로 두면 시트가 이미지 없는 텍스트형 카드로 보낸다.
                shareBtn.dataset.image = trigger.dataset.shareImage || '';
            }

            backdrop.classList.add('open');
            modal.classList.add('open');
        }
        function closeModal() {
            backdrop.classList.remove('open');
            modal.classList.remove('open');
        }

        document.querySelectorAll('.resinfo').forEach(el => {
            el.addEventListener('click', () => openModal(el));
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(el); }
            });
        });
        closeBtn.addEventListener('click', closeModal);
        backdrop.addEventListener('click', closeModal);
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
        });

        // 공유 시트를 열면서 이 팝업은 닫는다. 시트를 여는 건 시트 조각이 붙인 별도 리스너이고,
        // 이건 팝업만 닫는다 — 서로 다른 요소를 건드리므로 둘 중 어느 쪽이 먼저 돌든 결과가 같다
        // (이 스크립트가 조각보다 앞에 있어 실제로는 이쪽이 먼저 등록된다).
        // Esc 는 위 핸들러가 이미 닫힌 팝업을 무시하므로 시트만 닫힌다.
        if (shareBtn) shareBtn.addEventListener('click', closeModal);
    })();
</script>

<!-- 공유 시트가 안내(링크 복사됨 / 공유 실패)에 window.__toast 를 쓴다. 반드시 앞에 와야 한다. -->
<th:block th:replace="~{fragment/toast :: toast}"></th:block>

<!-- 예매 취소 안내를 새로고침 너머로 넘겨받는다. 위 .btn-cancel 클릭 핸들러 참고 —
     환불금액을 alert(블로킹) 없이 보여주려고, reload 직전에 sessionStorage 에 적어 둔
     것을 새 페이지가 뜬 뒤 여기서 다시 읽는다. 반드시 toast 조각 뒤에 와야
     window.__toast 가 정의돼 있다. -->
<script>
(function () {
    const raw = sessionStorage.getItem('reservationCancelToast');
    if (!raw) return;
    sessionStorage.removeItem('reservationCancelToast');   // 수동 새로고침 시 재등장 방지
    try {
        const { message, ms } = JSON.parse(raw);
        window.__toast(message, ms);
    } catch (e) { /* 저장된 값이 깨졌으면 조용히 무시 — 안내 하나 놓치는 것뿐이다 */ }
})();
</script>

<th:block th:replace="~{fragment/sharesheet :: sheetScript}"></th:block>
<th:block th:replace="~{fragment/sharesheet :: sdk}"></th:block>
</body>
</html>
