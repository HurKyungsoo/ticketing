<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-auth page-signup tone-light">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='회원가입', showAuthNav=false)}"></header>

    <div class="authwrap">
        <div class="authcard">
            <div class="authhead">
                <h2>회원가입</h2>
                <p>가입하면 바로 공연을 예매할 수 있습니다.</p>
            </div>

            <p class="autherror" th:if="${error}" th:text="${error}">에러</p>

            <form class="authform" th:action="@{/signup}" method="post">
                <!-- 가입 전에 보던 화면. 가입 후 로그인 화면으로 그대로 들려 보내(MemberController.signup)
                     로그인까지 마치면 원래 자리로 돌아간다. 헤더 링크가 붙여준 쿼리를 그대로 받고,
                     제출 실패로 폼을 다시 그릴 때는 모델에 담긴 값을 쓴다. -->
                <input type="hidden" name="returnTo"
                       th:if="${param.returnTo != null or returnTo != null}"
                       th:value="${param.returnTo != null} ? ${param.returnTo[0]} : ${returnTo}">
                <label>
                    아이디
                    <input type="text" name="loginId" required autofocus autocomplete="username">
                </label>
                <label>
                    비밀번호
                    <input type="password" name="password" required autocomplete="new-password">
                </label>
                <label>
                    닉네임
                    <input type="text" name="nickname" required autocomplete="nickname">
                </label>
                <label>
                    이메일
                    <input type="email" name="email" required autocomplete="email">
                    <span class="hint">비밀번호를 잊었을 때 재설정 메일을 받는 데 씁니다.</span>
                </label>

                <button type="submit">가입하기</button>
            </form>

            <p class="authlink">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
        </div>
    </div>
</div>
</body>
</html>
