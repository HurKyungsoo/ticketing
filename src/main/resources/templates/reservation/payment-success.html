<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결제 완료</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-payment">
<div class="wrap">
    <header th:replace="~{fragment/header :: masthead(tag='결제 완료', showAuthNav=false)}"></header>

    <ol class="paysteps">
        <li class="ps-done">좌석 선택</li>
        <li class="ps-done">결제</li>
        <li class="ps-current" aria-current="step">완료</li>
    </ol>

    <!-- 결제 화면과 같은 부품(.orderhead/.poster/.payseats)을 그대로 써서, 방금 그
         화면에서 확인한 것과 같은 모양으로 "이게 확정됐다"는 걸 보여준다 — 다른 화면처럼
         보이면 정말 확정된 게 맞는지 다시 의심하게 된다. -->
    <div class="paydone">
        <div class="paydone-icon" aria-hidden="true">
            <svg width="20" height="16" viewBox="0 0 20 16" fill="none">
                <path d="M2 8.5 7 13.5 18 2.5" stroke="currentColor" stroke-width="2.4"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <p class="paydone-lead">예매가 확정되었습니다</p>

        <div class="orderhead">
            <div class="poster" th:classappend="${reservation.schedule.performance.posterUrl == null} ? ' no-img'">
                <img th:if="${reservation.schedule.performance.posterUrl != null}"
                     th:src="@{/img/poster(u=${reservation.schedule.performance.posterUrl})}"
                     th:alt="${reservation.schedule.performance.title}">
                <div class="posterfallback">
                    <span class="pf-initial" th:text="${#strings.substring(reservation.schedule.performance.title, 0, 1)}">공</span>
                </div>
            </div>
            <div class="orderhead-text">
                <h2 class="paytitle" th:text="${reservation.schedule.performance.title}">공연명</h2>
                <dl class="payspec">
                    <div>
                        <dt>일시</dt>
                        <dd th:text="${#temporals.format(reservation.schedule.showAt, 'yyyy.M.d(E) HH:mm')}">2026.8.28(금) 11:00</dd>
                    </div>
                    <div>
                        <dt>공연장</dt>
                        <dd th:text="${reservation.schedule.performance.venue}">공연장</dd>
                    </div>
                </dl>
            </div>
        </div>

        <h3 class="detail-heading">좌석</h3>
        <ul class="payseats" th:if="${!seats.isEmpty()}">
            <li th:each="seat : ${seats}">
                <span class="ps-seat" th:text="${seat.seatLabel()}">1층 1열 1번</span>
                <span class="ps-grade" th:text="${seat.grade}">VIP</span>
                <span class="ps-price" th:text="${#numbers.formatInteger(seat.price,0,'COMMA')} + '원'">180,000원</span>
            </li>
        </ul>
        <p class="payseats-fallback" th:if="${seats.isEmpty()}" th:text="${reservation.seatSummary}">1층 1열 1번 VIP</p>

        <dl class="paytotal">
            <div>
                <dt>결제금액</dt>
                <dd th:text="${#numbers.formatInteger(reservation.amount,0,'COMMA')} + '원'">180,000원</dd>
            </div>
        </dl>
        <p class="payno">예매번호 <span th:text="${reservation.reservationNo}">26073177684019</span></p>

        <div class="paydone-actions">
            <a class="paybtn" th:href="@{/mypage/reservations}">예매 내역 보기</a>
            <a class="paybtn paybtn--ghost" th:href="@{/}">공연 더 보기</a>
        </div>
    </div>
</div>
</body>
</html>
