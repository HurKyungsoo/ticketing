<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>좌석 선택</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body>
<div class="wrap wrap-wide">
    <header th:replace="~{fragment/header :: masthead(tag=${performance.title} + ' · ' + ${#temporals.format(schedule.showAt, 'M/d(E) HH:mm')}, showAuthNav=false)}"></header>

    <div class="partysize">
        <label for="partySize">인원수</label>
        <select id="partySize">
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
        </select>
        <span class="hint">선택한 인원수만큼 좌석을 고를 수 있습니다.</span>
    </div>

    <div class="stage">STAGE</div>

    <!-- 층이 여러 개인 홀에서만. 65줄짜리 콘서트홀은 스크롤만으로는 층을 못 찾는다. -->
    <nav class="floornav" th:if="${floors.size() > 1}">
        <a class="floorchip" th:each="floor : ${floors}" th:href="'#' + ${floor.anchorId}">
            <span th:text="${floor.name}">1층</span>
            <b th:text="${floor.availableCount}">615</b><i th:text="'/' + ${floor.seatCount}">/615</i>
        </a>
    </nav>

    <!-- 좌석 격자는 이 안에서만 가로 스크롤된다. 페이지 본문이 옆으로 밀리면 안 된다. -->
    <div class="housescroll" id="housescroll">
        <section class="floor" th:each="floor : ${floors}" th:id="${floor.anchorId}">
            <h2 class="floorname" th:if="${!floor.name.isEmpty()}" th:text="${floor.name}">1층</h2>
            <div class="house">
                <div class="row" th:each="row : ${floor.rows}">
                    <span class="rowlabel" th:text="${row.label}">A</span>
                    <button type="button" class="seat"
                            th:each="seat : ${row.seats}"
                            th:classappend="|grade-${seat.grade}${seat.seatNo % row.aisleEvery == 0 ? ' aisle' : ''}|"
                            th:attr="data-status=${seat.status},
                                     data-seat-id=${seat.seatId},
                                     data-label=${seat.section} + '-' + ${seat.seatNo},
                                     data-price=${seat.price},
                                     data-grade=${seat.grade},
                                     data-tooltip=${seat.grade} + '석 · ' + ${#numbers.formatInteger(seat.price,0,'COMMA')} + '원'"
                            th:disabled="${seat.status != 'AVAILABLE'}"
                            th:title="|${seat.section}-${seat.seatNo} ${seat.grade}석 ${#numbers.formatInteger(seat.price,0,'COMMA')}원|">
                    </button>
                </div>
            </div>
        </section>
    </div>

    <div class="legend">
        <div class="legend-row">
            <span><i style="background:var(--ink-soft);border:1px solid var(--line)"></i> 선택 가능</span>
            <span><i style="background:var(--brass)"></i> 선택함</span>
            <span><i style="background:var(--brass-dim)"></i> 결제 대기</span>
            <span><i style="background:var(--rose);opacity:.55"></i> 판매 완료</span>
        </div>
        <div class="legend-row legend-grades">
            <span><i class="legend-grade grade-VIP"></i> VIP석 <b class="legend-price" data-grade="VIP"></b></span>
            <span><i class="legend-grade grade-R"></i> R석 <b class="legend-price" data-grade="R"></b></span>
            <span><i class="legend-grade grade-S"></i> S석 <b class="legend-price" data-grade="S"></b></span>
            <span><i class="legend-grade grade-A"></i> A석 <b class="legend-price" data-grade="A"></b></span>
        </div>
    </div>
</div>

<div class="bookbar">
    <div class="inner">
        <div class="picked" id="picked">
            <p class="pickedlist">좌석을 선택하세요</p>
        </div>
        <button type="button" id="bookBtn" disabled>예매하기</button>
    </div>
</div>

<script th:inline="javascript">
    const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]').content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').content;

    /* ---------- 좌석 크기 자동 맞춤 ----------
       가장 긴 줄이 컨테이너 폭에 들어가는 최대 좌석 크기를 계산해 --seat-size 에 넣는다.
       콘서트홀(한 줄 41석)을 기본 크기 26px 로 그리면 줄 하나가 1,700px 이 되어 본문 폭을
       벗어난다. 20석짜리 기본 홀은 상한(26px)에 걸려 종전과 같은 크기가 그대로 나온다.

       줄 너비 = 라벨 + N*좌석 + N*간격 + A*통로 이고 간격·통로가 좌석 크기의 배수라,
       좌석 크기로 묶으면 나눗셈 한 번에 떨어진다. 크기를 줄여가며 DOM 을 다시 재는 방식은
       좌석 2,500개짜리 격자에서 레이아웃을 수십 번 다시 계산하게 된다.

       기준값(가장 긴 줄, 통로 개수, 간격 비율)은 전부 렌더된 DOM/CSS 에서 읽는다.
       통로 간격 규칙은 SeatMapView 에, 간격 비율은 CSS 에 이미 있어서 여기에 다시 적으면
       한쪽만 바뀌었을 때 조용히 어긋난다. */
    const SEAT_MIN = 14;   // 이보다 작으면 누르기 어렵다. 여기서 멈추고 가로 스크롤로 넘긴다.
    const SEAT_MAX = 26;   // 기본 크기. 여유가 있어도 이보다 크게는 안 키운다.

    const scroller = document.getElementById('housescroll');

    /**
     * 가장 긴 줄의 좌석 수·통로 수와, 좌석 크기 대비 간격·통로 폭의 비율.
     * 비율은 CSS 가 좌석 크기의 배수로 정의하므로 지금 좌석이 몇 px 이든 같은 값이 나온다.
     */
    function measureGrid() {
        let widest = null, seats = 0;
        scroller.querySelectorAll('.row').forEach(row => {
            const n = row.querySelectorAll('.seat').length;
            if (n > seats) { seats = n; widest = row; }
        });
        if (!widest) return null;

        // border-box 라 좌석의 렌더 폭이 곧 --seat-size 다 (등급별 테두리 두께와 무관).
        const size = widest.querySelector('.seat').getBoundingClientRect().width;
        if (!size) return null;

        const aisleSeat = widest.querySelector('.seat.aisle');
        return {
            seats,
            aisles: widest.querySelectorAll('.seat.aisle').length,
            gapRatio: (parseFloat(getComputedStyle(widest).columnGap) || 0) / size,
            aisleRatio: aisleSeat ? (parseFloat(getComputedStyle(aisleSeat).marginRight) || 0) / size : 0
        };
    }

    const grid = measureGrid();

    function fitSeatSize() {
        if (!grid) return;   // 좌석이 아직 생성되지 않은 회차
        const style = getComputedStyle(scroller);
        const labelWidth = parseFloat(style.getPropertyValue('--rowlabel-w')) || 0;
        const bleed = parseFloat(style.getPropertyValue('--tooltip-bleed')) || 0;

        const perSeat = grid.seats * (1 + grid.gapRatio) + grid.aisles * grid.aisleRatio;
        const usable = scroller.clientWidth - labelWidth - bleed * 2 - 4;   // 4px: 반올림 여유
        const size = Math.floor(usable / perSeat);
        scroller.style.setProperty('--seat-size', Math.min(SEAT_MAX, Math.max(SEAT_MIN, size)) + 'px');
    }

    fitSeatSize();
    // 창 크기가 바뀌면 다시 맞춘다. 리사이즈는 연속으로 들어오므로 한 프레임에 한 번만 계산한다.
    let fitPending = false;
    window.addEventListener('resize', () => {
        if (fitPending) return;
        fitPending = true;
        requestAnimationFrame(() => { fitPending = false; fitSeatSize(); });
    });

    // 각 등급의 대표 가격을 범럈에 표시한다 (이번 회차에 실매한 증 개수로 직적 읽어온다).
    document.querySelectorAll('.legend-price').forEach(el => {
        const sample = document.querySelector(`.seat[data-grade="${el.dataset.grade}"]`);
        if (sample) el.textContent = Number(sample.dataset.price).toLocaleString() + '원';
    });

    const partySizeSelect = document.getElementById('partySize');
    const pickedBox = document.getElementById('picked');
    const bookBtn = document.getElementById('bookBtn');

    /** 선택한 좌석 DOM 엘리먼트들. 선택 순서를 그대로 유지한다. */
    let selectedSeats = [];

    function partySize() {
        return Number(partySizeSelect.value);
    }

    function renderPicked() {
        if (selectedSeats.length === 0) {
            pickedBox.innerHTML = '<p class="pickedlist">좌석을 선택하세요</p>';
            bookBtn.disabled = true;
            return;
        }
        const chips = selectedSeats.map(s => `<span class="pickchip">${s.dataset.label}</span>`).join('');
        const total = selectedSeats.reduce((sum, s) => sum + Number(s.dataset.price), 0).toLocaleString();
        pickedBox.innerHTML =
            `<p class="pickedlist">${chips}</p>` +
            `<p class="pickedtotal">${selectedSeats.length}석 · 총 <strong>${total}원</strong></p>`;
        bookBtn.disabled = false;
    }

    function deselect(seat) {
        seat.classList.remove('selected');
        selectedSeats = selectedSeats.filter(s => s !== seat);
    }

    // 인원수를 줄이면 초과분은 선택 해제한다.
    partySizeSelect.addEventListener('change', () => {
        while (selectedSeats.length > partySize()) {
            deselect(selectedSeats[selectedSeats.length - 1]);
        }
        renderPicked();
    });

    document.querySelectorAll('.seat').forEach(seat => {
        seat.addEventListener('click', () => {
            if (seat.classList.contains('selected')) {
                deselect(seat);
                renderPicked();
                return;
            }
            if (selectedSeats.length >= partySize()) {
                alert(`인원수(${partySize()}명)만큼만 좌석을 선택할 수 있습니다.`);
                return;
            }
            seat.classList.add('selected');
            selectedSeats.push(seat);
            renderPicked();
        });
    });

    const PENDING_HOLD_KEY = 'pendingHold';

    /** 좌석 선점을 시도한다. 비로그인 상태면 authRequired 만 true 로 반환하고 리다이렉트는 호출부가 처리한다. */
    async function attemptHold(seatIds) {
        const res = await fetch('/api/reservations/hold', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [CSRF_HEADER]: CSRF_TOKEN
            },
            body: JSON.stringify({ seatIds, strategy: 'PESSIMISTIC' })
        });

        if (res.redirected || !res.headers.get('content-type')?.includes('application/json')) {
            return { authRequired: true };
        }
        return { authRequired: false, ok: res.ok, data: await res.json() };
    }

    /** 실패한 좌석만 선택 해제하고 판매 불가로 표시한다. 나머지는 여전히 선택된 채로 둬서
        사용자가 실패한 좌석만 바꿔 다시 시도할 수 있게 한다 (전체 재선택 강요 X). */
    function markFailedSeats(failedSeatIds) {
        const failedIds = new Set(failedSeatIds || []);
        selectedSeats.filter(s => failedIds.has(Number(s.dataset.seatId))).forEach(s => {
            s.dataset.status = 'HELD';
            s.disabled = true;
            s.classList.remove('selected');
        });
        selectedSeats = selectedSeats.filter(s => !failedIds.has(Number(s.dataset.seatId)));
    }

    bookBtn.addEventListener('click', async () => {
        if (selectedSeats.length === 0) return;
        bookBtn.disabled = true;
        bookBtn.textContent = '선점 중...';

        const seatIds = selectedSeats.map(s => Number(s.dataset.seatId));

        try {
            const result = await attemptHold(seatIds);

            if (result.authRequired) {
                // 로그인하고 돌아왔을 때 방금 고른 좌석 그대로 결제 페이지까지 바로 이어가기 위해 남겨둔다.
                sessionStorage.setItem(PENDING_HOLD_KEY, JSON.stringify({ pathname: location.pathname, seatIds }));
                location.href = '/login?returnTo=' + encodeURIComponent(location.pathname + location.search);
                return;
            }

            if (result.ok) {
                // 결제 페이지로. 여기서 토스페이먼츠 결제창을 띄운다.
                location.href = `/reservations/${result.data.reservationNo}/payment`;
            } else {
                alert(result.data.message);
                markFailedSeats(result.data.failedSeatIds);
                renderPicked();
            }
        } catch (e) {
            alert('요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            bookBtn.textContent = '예매하기';
            bookBtn.disabled = selectedSeats.length === 0;
        }
    });

    /** 로그인하느라 이 화면을 떠났다가 돌아온 직후라면, 아까 고르던 좌석을 화면에 그대로 표시하고
        선점을 자동으로 재시도해 결제 페이지까지 바로 이어간다. */
    (async function resumePendingHold() {
        const raw = sessionStorage.getItem(PENDING_HOLD_KEY);
        if (!raw) return;
        sessionStorage.removeItem(PENDING_HOLD_KEY);

        let pending;
        try { pending = JSON.parse(raw); } catch { return; }
        if (!pending || pending.pathname !== location.pathname) return;

        pending.seatIds.forEach(seatId => {
            const seat = document.querySelector(`.seat[data-seat-id="${seatId}"]`);
            if (seat && seat.dataset.status === 'AVAILABLE') {
                seat.classList.add('selected');
                selectedSeats.push(seat);
            }
        });
        renderPicked();
        if (selectedSeats.length === 0) return;

        bookBtn.disabled = true;
        bookBtn.textContent = '선점 중...';
        const result = await attemptHold(selectedSeats.map(s => Number(s.dataset.seatId)));

        if (!result.authRequired && result.ok) {
            location.href = `/reservations/${result.data.reservationNo}/payment`;
            return;
        }
        if (!result.authRequired) {
            alert(result.data.message);
            markFailedSeats(result.data.failedSeatIds);
        }
        renderPicked();
        bookBtn.textContent = '예매하기';
        bookBtn.disabled = selectedSeats.length === 0;
    })();
</script>
</body>
</html>
