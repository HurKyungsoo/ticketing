<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>좌석 선택</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragment/head :: favicons}"></th:block>
</head>
<body class="page-seatmap">
<div class="wrap wrap-wide">
    <header th:replace="~{fragment/header :: masthead(tag=${performance.title} + ' · ' + ${#temporals.format(schedule.showAt, 'M/d(E) HH:mm')}, showAuthNav=false)}"></header>

    <div class="partysize">
        <label for="partySize">인원수</label>
        <select id="partySize">
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
        </select>
        <span class="hint">선택한 인원수만큼 좌석을 고를 수 있습니다.</span>
        <button type="button" class="zoomtoggle" id="zoomBtn" aria-pressed="false">확대</button>
    </div>

    <!--
        층이 여러 개인 홀에서만. 63줄짜리 콘서트홀은 스크롤만으로는 층을 못 찾는다.

        구역이 아니라 **층** 단위로 묶는다. 종전엔 구역마다 칩을 하나씩 뒀는데 콘서트홀에서
        20개가 두 줄로 깔려(73px) 지도 위 자리를 먹었다 — 층을 고르려는 사람에게 "1층 A"
        부터 "3층 G"까지 스무 개를 읽게 하는 건 고르라는 게 아니라 훑으라는 것이다.
        층은 넷(합창석·1·2·3층)뿐이라 한 줄에 들어가고, 구역별 잔여석은 층으로 이동한 뒤
        구역 이름 아래에서 확인하면 된다.
    -->
    <nav class="floornav" th:if="${arena.bands().size() > 1}">
        <a class="floorchip" th:each="band : ${arena.bands()}" th:href="'#' + ${band.anchorId}">
            <span th:text="${band.displayName()}">1층</span>
            <b th:text="${band.availableCount()}">615</b><i th:text="'/' + ${band.seatCount()}">/615</i>
        </a>
    </nav>

    <!--
        좌석 격자는 이 안에서만 가로 스크롤된다. 페이지 본문이 옆으로 밀리면 안 된다.
        무대도 이 안에 둔다 — 무대 뒤 구역(합창석)이 무대 위쪽에 와야 하고, 무대와 좌석이
        같이 스크롤돼야 어느 좌석이 무대 정면인지가 유지된다.
    -->
    <div class="housescroll" id="housescroll" th:classappend="${arena.hasSides()} ? 'has-sides'">
      <!-- 핀치 중에는 이 래퍼만 transform 으로 확대해 보여준다(레이아웃 없이 합성만 하므로 부드럽다).
           손을 떼는 순간 실제 좌석 크기로 확정하고 transform 을 지운다. -->
      <div id="housecontent">
        <!-- 무대 뒤 밴드. 무대보다 위에 와야 무대 뒤 좌석으로 읽힌다. -->
        <div class="zoneline zoneline-rear" th:each="band : ${arena.rear}">
            <div class="zone" th:each="column : ${band.columns}">
                <th:block th:replace="~{fragment/seatzone :: floors(${column})}"></th:block>
            </div>
        </div>

        <div class="stage">STAGE</div>

        <!-- 정면 밴드. 층마다 한 줄이고, 한 층이 A~E 로 갈리면 그 줄에 열이 다섯 개 생긴다. -->
        <div class="zoneline" th:each="band : ${arena.front}">
            <div class="zone" th:each="column : ${band.columns}">
                <th:block th:replace="~{fragment/seatzone :: floors(${column})}"></th:block>
            </div>
        </div>
      </div>
    </div>

    <!--
        확대 모드 미니맵. 2,481석 홀을 24px 로 키우면 화면에 한 번에 열 몇 줄밖에 안 들어와서
        지금 홀의 어디를 보고 있는지 알 수 없다 — 열쇠구멍으로 보는 상태가 된다.

        구역 블록은 좌석도 레이아웃을 다시 계산하지 않고 **이미 그려진 DOM 의 기하를 그대로
        축소**해서 만든다. 부채꼴 호·무대 뒤 밴드·한 층이 A~E 로 갈리는 배치가 전부 자동으로
        따라오고, 나중에 배치 규칙이 바뀌어도 미니맵은 손댈 필요가 없다.

        aria-hidden 인 이유: 스크롤로 할 수 있는 일을 좌표로 한 번 더 제공하는 보조 수단이라
        스크린리더에는 좌석 격자만 남기는 편이 낫다.
    -->
    <div class="minimap" id="minimap" hidden aria-hidden="true">
        <div class="minimap-inner" id="minimapInner">
            <div id="minimapZones"></div>
            <div class="minimap-view" id="minimapView"></div>
        </div>
    </div>

    <!-- 좌석 상태 표시는 한 번 익히면 계속 볼 필요가 없어서 본문 맨 아래에 둔다.
         고르는 내내 확인하게 되는 등급별 가격만 예매 바에 고정한다. -->
    <div class="seatstatus">
        <!-- "선택 가능"은 견본을 두지 않는다. 이제 예매 가능한 좌석은 등급색 네 가지 중
             하나로 칠해지므로 대표 견본 하나를 두면 오히려 틀린 설명이 된다
             (예매 바에 고정된 등급별 가격표가 그 넷을 이미 보여준다). -->
        <div class="legend-row">
            <span><i style="background:var(--paper);box-shadow:0 0 0 2px var(--brass)"></i> 선택함</span>
            <span><i style="background:var(--seat-held)"></i> 결제 대기</span>
            <span><i style="background:var(--seat-sold)"></i> 판매 완료</span>
        </div>
    </div>
</div>

<!--
    가격표는 예매 바와 함께 화면 아래에 고정한다. 본문 흐름에 두면 63줄짜리 홀에서는
    "이 등급이 얼마였지"를 확인할 때마다 한참 스크롤해야 한다. 바 높이는 내용에 따라
    달라지므로(좁은 화면에서 가격표가 여러 줄로 접히고, 고른 좌석 칩도 늘어난다)
    본문 아래 여백은 JS 가 실측해서 --footer-h 로 넘긴다.
-->
<div class="bookbar" id="bookbar">
    <div class="legend">
        <!--
            가격표는 보기만 하는 정보가 아니라 필터다. 예산을 먼저 정하고 그 안에서 자리를
            고르는 게 실제 구매 순서라, 등급을 누르면 그 등급만 남기고 나머지를 뒤로 물린다.
            아무것도 안 누른 상태(= 전부 해제)가 곧 "전체 보기"라 초기화 버튼을 따로 두지 않는다.
        -->
        <div class="legend-row legend-grades" id="gradeFilter">
            <button type="button" data-grade="VIP" aria-pressed="false">
                <i class="legend-grade grade-VIP"></i> VIP석 <b class="legend-price" data-grade="VIP"></b>
            </button>
            <button type="button" data-grade="R" aria-pressed="false">
                <i class="legend-grade grade-R"></i> R석 <b class="legend-price" data-grade="R"></b>
            </button>
            <button type="button" data-grade="S" aria-pressed="false">
                <i class="legend-grade grade-S"></i> S석 <b class="legend-price" data-grade="S"></b>
            </button>
            <button type="button" data-grade="A" aria-pressed="false">
                <i class="legend-grade grade-A"></i> A석 <b class="legend-price" data-grade="A"></b>
            </button>
        </div>
    </div>
    <div class="inner">
        <div class="picked" id="picked">
            <p class="pickedlist">좌석을 선택하세요</p>
        </div>
        <button type="button" id="bookBtn" disabled>예매하기</button>
    </div>
</div>

<script th:inline="javascript">
    const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]').content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').content;

    /* ---------- 인원수·확대 줄을 헤더 바로 아래에 고정 ----------
       .partysize 는 CSS 에서 position: sticky; top: var(--header-h) 로 떠 있다. .masthead 도
       sticky(top:0)라서, 이 값이 실제 헤더 높이와 다르면 스크롤 중 두 sticky 요소가 같은
       자리를 다투며 겹친다. 헤더 높이는 부제(공연명+일시)가 좁은 화면에서 줄바꿈되면
       달라지므로 고정폭을 쓰지 않고 실측해서 넣고, ResizeObserver 로 따라간다.

       --sticky-h(헤더+인원수줄 합계)는 층 바로가기(#floor-N)로 점프했을 때 쓴다. .floor 의
       scroll-margin-top 이 이 값보다 작으면, 두 sticky 바가 목적지 층 이름을 가리고 시작한다
       — 실측 전 고정값(80px)으로는 39px 가 가려졌다. */
    const masthead = document.querySelector('.masthead');
    const partysize = document.querySelector('.partysize');
    function syncStickyOffsets() {
        const headerH = masthead.offsetHeight;
        document.documentElement.style.setProperty('--header-h', headerH + 'px');
        document.documentElement.style.setProperty('--sticky-h', (headerH + partysize.offsetHeight) + 'px');
    }
    syncStickyOffsets();
    new ResizeObserver(syncStickyOffsets).observe(masthead);
    new ResizeObserver(syncStickyOffsets).observe(partysize);

    /* ---------- 좌석 크기 자동 맞춤 ----------
       좌석 격자가 컨테이너 폭에 들어가는 최대 좌석 크기를 계산해 --seat-size 에 넣는다.
       콘서트홀(한 줄 43석)을 기본 크기 26px 로 그리면 줄 하나가 1,700px 이 되어 본문 폭을
       벗어난다. 20석짜리 기본 홀은 상한(26px)에 걸려 종전과 같은 크기가 그대로 나온다.

       제약은 "가장 넓은 줄 하나"가 아니라 zoneline(가로로 나란히 놓이는 열 묶음) 단위다.
       무대를 감싸는 홀은 정면이 좌·중앙·우 세 열이라 세 열의 폭 합계 + 열 간격이 들어가야
       하고, 무대 뒤 줄은 그와 별개로 자기 폭만 맞으면 된다. 그래서 zoneline 마다 필요한
       크기를 구하고 가장 빡빡한 쪽을 택한다.

       줄 너비 = 라벨 + N*좌석 + N*간격 + A*통로 이고 라벨만 고정 폭, 나머지는 모두 좌석
       크기의 배수라, 좌석 크기로 묶으면 나눗셈 한 번에 떨어진다. 크기를 줄여가며 DOM 을
       다시 재는 방식은 좌석 2,500개짜리 격자에서 레이아웃을 수십 번 다시 계산하게 된다.

       기준은 렌더된 줄의 실제 너비를 그대로 재서 얻는다. 좌석 수·통로 개수·간격 비율을
       여기서 다시 계산하면 통로 규칙(SeatMapView)과 간격 비율(CSS)을 JS 가 중복으로
       알아야 하고, 한쪽만 바뀌면 조용히 어긋난다. */
    /* 맞춤 모드의 하한. 여기까지 줄여서라도 가로 스크롤 없이 다 보여준다.
       한 층이 75석 폭인 홀(콘서트홀 3층 A~G, 세종 3층 A~H)은 누르기 좋은 크기(14px 이상)로는
       1,400px 화면에 물리적으로 안 들어간다 — 좌석만 1,050px 이고 열마다 행 라벨이 붙는다.
       그래서 기본은 "전체가 보이는 지도", 좌석을 고를 때는 확대 버튼으로 키우게 나눴다. */
    const SEAT_FIT_MIN = 9;
    const SEAT_MIN = 14;   // 확대 모드의 하한이자, 누르기 편한 최소 크기.
    const SEAT_MAX = 26;   // 기본 크기. 여유가 있어도 이보다 크게는 안 키운다.
    const SEAT_ZOOM = 24;  // 확대 모드 기본 크기. 이때는 격자 안에서 가로 스크롤이 생긴다.
    const SEAT_PINCH_MAX = 44;   // 핀치로 키울 수 있는 상한.

    /** 확대 모드 안내문. 손가락으로 만지는 기기면 핀치도 알려준다. */
    const CAN_TOUCH = matchMedia('(any-pointer: coarse)').matches;
    const ZOOM_HINT = CAN_TOUCH
            ? '끌어서 움직이고, 두 손가락으로 확대·축소하세요.'
            : '끌어서 움직이고, 좌석을 눌러 고르세요.';

    /*
       맞춤 모드인데 좌석이 SEAT_MIN 보다 작을 때의 안내.

       2,505석 콘서트홀은 맞춤 모드에서 좌석이 11px 까지 내려간다. 누르면 실제로 골라지긴 하지만
       WCAG 2.2 의 최소 타깃 크기(24×24px)에 한참 못 미쳐서 정확히 겨냥해야 한다. 확대 버튼이
       이미 그 답인데, 종전에는 버튼이 다른 요소와 똑같은 외곽선 스타일이고 안내문도
       "인원수만큼 고를 수 있습니다" 그대로라 <b>확대해야 한다는 신호가 어디에도 없었다.</b>
    */
    const FIT_SMALL_HINT = CAN_TOUCH
            ? '좌석이 작습니다. 두 손가락으로 벌리거나 「확대」를 눌러 고르세요.'
            : '좌석이 작습니다. 「확대」를 누르면 크게 보고 고를 수 있어요.';

    const scroller = document.getElementById('housescroll');
    const bookbar = document.getElementById('bookbar');

    /**
     * 지금 렌더된 좌석 한 변(px). border-box 라 렌더 폭이 곧 --seat-size 다(테두리 두께와 무관).
     *
     * getBoundingClientRect 가 아니라 offsetWidth 를 쓴다 — 좌석에는 부채꼴 호를 만드는
     * transform 이 걸려 있고, getBoundingClientRect 는 변형된 박스를 재기 때문이다.
     * offsetWidth 는 레이아웃 상의 폭이라 transform 과 무관하다.
     */
    function currentSeatSize() {
        const seat = scroller.querySelector('.seat');
        return seat ? seat.offsetWidth : 0;
    }

    /**
     * zoneline 마다 { 고정 폭, 좌석 크기 1px 당 늘어나는 폭 } 을 잰다.
     *
     * 열이 여러 개면 열마다 가장 넓은 줄이 그 열의 폭을 정하고, 열 사이 간격(--zone-gap)도
     * 좌석 크기의 배수라 계수에 함께 넣는다. 간격 비율을 JS 에 다시 쓰지 않으려고 계산된
     * px 을 현재 좌석 크기로 나눠 비율로 되돌린다.
     *
     * 좌석 수가 가장 많은 줄이 아니라 실제로 가장 넓은 줄을 기준으로 삼는다 — 통로가 있는
     * 구역과 없는 구역(부채꼴)이 섞이면 좌석 수만으로는 어느 줄이 넓은지 알 수 없다.
     *
     * 계수는 좌석 크기와 무관하므로 한 번만 재면 된다.
     */
    function measureZonelines() {
        const size = currentSeatSize();
        if (!size) return [];   // 좌석이 아직 생성되지 않은 회차
        const label = parseFloat(getComputedStyle(scroller).getPropertyValue('--rowlabel-w')) || 0;

        return [...scroller.querySelectorAll('.zoneline')].map(line => {
            const zones = [...line.querySelectorAll('.zone')];
            const gap = parseFloat(getComputedStyle(line).columnGap) || 0;

            let coefficient = (zones.length - 1) * (gap / size);
            zones.forEach(zone => {
                let widest = 0;
                zone.querySelectorAll('.row').forEach(row => {
                    widest = Math.max(widest, row.getBoundingClientRect().width);
                });
                coefficient += (widest - label) / size;
            });
            return { fixed: zones.length * label, coefficient };
        }).filter(line => line.coefficient > 0);
    }

    const zonelines = measureZonelines();

    /** 확대 모드 여부. 기본은 맞춤 모드 — 가로 스크롤 없이 좌석 전체가 보인다. */
    let zoomed = false;
    /** 확대 모드의 좌석 크기. 핀치로 바뀐다. */
    let zoomSize = SEAT_ZOOM;
    const zoomBtn = document.getElementById('zoomBtn');
    const zoomHint = document.querySelector('.partysize .hint');
    const FIT_HINT = zoomHint.textContent;

    /* ---------- 맞춤 모드에서 마지막으로 가리킨 지점 ----------
       확대 버튼을 누르면 이 지점이 확대 화면 가운데로 온다. 좌석을 훑어보다 버튼을 누르러
       마우스를 옮겨도 최신 값은 그대로 남는다 — 리스너가 scroller 위에 있을 때만 갱신되므로
       버튼(scroller 밖)으로 이동하는 동안은 마지막으로 가리켰던 좌석이 유지된다. 한 번도
       안 가리켰으면(터치 전용 기기, 키보드로 버튼에 바로 포커스 등) null 이라 기존처럼
       무대 정면을 기준으로 연다. */
    let lastFocusPoint = null;
    scroller.addEventListener('pointermove', (e) => {
        if (zoomed || e.pointerType !== 'mouse') return;
        lastFocusPoint = { x: e.clientX, y: e.clientY };
    }, { passive: true });

    /** 그 지점에서 scroller 안에 있는 요소. 격자 밖(페이지 여백 등)이면 null. */
    function elementAt(clientX, clientY) {
        const el = document.elementFromPoint(clientX, clientY);
        return (el && scroller.contains(el) && el !== scroller) ? el : null;
    }

    /** 맞춤 모드에서 필요한 좌석 크기(하한을 적용하지 않은 값). 이게 하한보다 작으면 맞춤이 불가능하다. */
    function requiredFitSize() {
        // 여유는 zoneline 양끝에만 있으므로(--tooltip-bleed 는 .zoneline 의 padding) 한 번만 뺀다.
        const bleed = parseFloat(getComputedStyle(scroller).getPropertyValue('--tooltip-bleed')) || 0;
        const usable = scroller.clientWidth - bleed * 2 - 4;   // 4px: 반올림 여유
        // 한 줄이라도 넘치면 격자 전체가 가로 스크롤되므로 가장 빡빡한 줄에 맞춘다.
        return Math.floor(Math.min(...zonelines.map(line => (usable - line.fixed) / line.coefficient)));
    }

    function applySeatSize() {
        if (!zonelines.length) return;
        const size = zoomed
                ? zoomSize
                : Math.min(SEAT_MAX, Math.max(SEAT_FIT_MIN, requiredFitSize()));
        scroller.style.setProperty('--seat-size', size + 'px');
    }

    /** 확대(지도) 모드 켜기/끄기. 버튼과 핀치가 같이 쓴다. */
    function setZoomed(on) {
        zoomed = on;
        zoomBtn.setAttribute('aria-pressed', String(on));
        zoomBtn.textContent = on ? '전체 보기' : '확대';
        // 안내문은 syncZoomBtn 이 좌석 크기까지 보고 정한다(아래에서 호출된다).
        // 확대 모드에서만 격자가 지도처럼 상하좌우로 스크롤된다(높이를 고정한다).
        scroller.classList.toggle('zoomed', on);
        applySeatSize();
        sizeMapViewport();
        syncZoomBtn();
        // 좌석 크기와 격자 높이가 확정된 뒤라야 미니맵 배율이 맞는다.
        syncMinimap();
    }

    /**
     * 지도 모드의 격자 높이를 화면에 남은 만큼으로 맞춘다.
     *
     * 고정 바(좌석 표시·가격표·예매 버튼)가 화면 아래를 차지하므로, 높이를 CSS 로만 주면
     * (72vh 등) 지도 아래쪽이 바에 가린다 — 실측으로 631px 지도의 아래 194px 이 가렸다.
     * 격자가 화면에서 시작하는 위치는 층 바로가기 줄 수에 따라 달라져서(콘서트홀은 칩이 20개라
     * 좁은 화면에서 여러 줄로 접힌다) CSS 로는 계산할 수 없다. 그래서 실측해서 넣는다.
     */
    function sizeMapViewport() {
        if (!zoomed) { scroller.style.height = ''; return; }
        const available = window.innerHeight - scroller.getBoundingClientRect().top
                - bookbar.offsetHeight - 12;
        scroller.style.height = Math.round(Math.max(280, Math.min(860, available))) + 'px';
    }

    /**
     * 확대 버튼의 노출·강조와 안내문을 좌석 크기에 맞춰 정한다.
     *
     * <p>맞춤 크기가 이미 넉넉하면 버튼은 할 일이 없다(20석짜리 기본 홀 등). 지도 모드면 항상 보인다.
     *
     * <p>맞춤 모드인데 좌석이 누르기엔 작을 때만 버튼을 <b>주요 액션으로 올린다</b>. 그 순간
     * 사용자가 할 수 있는 의미 있는 행동이 확대뿐이기 때문이다(좌석은 아직 못 골랐으니
     * 예매 버튼도 비활성이다). 좌석이 충분히 크면 다시 보조 스타일로 내려서, 화면에 강조가
     * 두 개씩 떠 있지 않게 한다.
     */
    function syncZoomBtn() {
        const tooSmallToTap = requiredFitSize() < SEAT_MIN;
        zoomBtn.hidden = !zoomed && !tooSmallToTap;

        const suggestZoom = !zoomed && tooSmallToTap;
        zoomBtn.classList.toggle('zoomtoggle--suggest', suggestZoom);
        zoomHint.textContent = zoomed ? ZOOM_HINT : (tooSmallToTap ? FIT_SMALL_HINT : FIT_HINT);
    }

    /* ---------- 확대 모드 미니맵 ---------- */

    // 큰 홀에서 우하단에 고정된 미니맵이 그 자리에 오는 좌석을 완전히 가려 클릭을
    // 못 받는 문제가 있다(elementsFromPoint 로 확인 — 그 좌석 자리 클릭이 항상
    // .minimap 으로 간다). 근본 해결은 아니지만 패널을 줄이면 겹치는 면적 자체가
    // 줄어든다. 아래 .minimap 의 opacity 와 함께 본다.
    const MINI_MAX_W = 130;
    const MINI_MAX_H = 95;
    const minimap = document.getElementById('minimap');
    const minimapInner = document.getElementById('minimapInner');
    const minimapZones = document.getElementById('minimapZones');
    const minimapView = document.getElementById('minimapView');
    /* 스크롤 좌표 → 미니맵 좌표 배율. 0 이면 아직 만들어지지 않은 상태다. */
    let miniK = 0;
    /* 구역별 대표 등급은 좌석이 바뀌지 않는 한 그대로다. 핀치를 놓을 때마다 다시 만드는데
       매번 좌석 2,481개를 세지 않도록 구역 요소를 키로 기억해둔다. */
    const dominantGrade = new WeakMap();

    function gradeOf(floor) {
        if (!dominantGrade.has(floor)) {
            const counts = {};
            floor.querySelectorAll('.seat').forEach(seat => {
                const g = seat.dataset.grade;
                if (g) counts[g] = (counts[g] || 0) + 1;
            });
            let best = 'A', most = -1;
            Object.entries(counts).forEach(([g, c]) => { if (c > most) { most = c; best = g; } });
            dominantGrade.set(floor, best);
        }
        return dominantGrade.get(floor);
    }

    /*
       블록 안에 넣을 짧은 이름. 구역 이름의 마지막 토막만 쓴다 — 층은 블록의 세로 위치가
       이미 말해주므로 같은 층 안에서 구역을 가르는 글자만 있으면 된다("1층 C" → "C").

       두 글자를 넘으면 넣지 않는다. 예술의전당 리사이틀홀처럼 구역명이 알파벳이 아닌
       홀("1층 왼쪽사이드")은 16px 짜리 블록에 넣을 방법이 없다 — 그런 홀은 색과 title 로만
       안내하고 글자는 비운다. 억지로 줄이면 "왼쪽…" 같은 알아볼 수 없는 조각이 남는다.
    */
    function shortLabelOf(name) {
        const last = name.trim().split(/\s+/).pop() || '';
        return last.length <= 2 ? last : '';
    }

    /** 격자가 실제로 넘치는지. 다 보이면 미니맵은 알려줄 게 없다. */
    function mapOverflows() {
        return scroller.scrollWidth > scroller.clientWidth + 1
                || scroller.scrollHeight > scroller.clientHeight + 1;
    }

    /*
       구역 블록을 다시 만든다. 좌표는 전부 "스크롤 좌표"로 통일한다 —
       (요소의 화면 위치 - 스크롤러의 화면 위치) + 현재 스크롤량. 이렇게 재면 스크롤러의
       padding(--tooltip-bleed)이 자동으로 포함되어 scrollLeft/scrollTop 과 같은 원점을 쓴다.
       요소별 offsetLeft 를 쓰면 offsetParent 가 제각각이라 이 원점이 안 맞는다.

       핀치 도중에는 부르면 안 된다 — 그때는 houseContent 에 transform 이 걸려 있어서
       getBoundingClientRect 가 변형된 크기를 돌려준다. 그래서 확정(commitPinch) 뒤에만 부른다.
    */
    function buildMinimap() {
        const totalW = scroller.scrollWidth;
        const totalH = scroller.scrollHeight;
        if (!totalW || !totalH) return false;

        miniK = Math.min(MINI_MAX_W / totalW, MINI_MAX_H / totalH);
        minimapInner.style.width = Math.round(totalW * miniK) + 'px';
        minimapInner.style.height = Math.round(totalH * miniK) + 'px';

        const base = scroller.getBoundingClientRect();
        const frag = document.createDocumentFragment();
        const place = (el, className, name) => {
            const r = el.getBoundingClientRect();
            const w = Math.max(2, r.width * miniK);
            const h = Math.max(2, r.height * miniK);
            const box = document.createElement('div');
            box.className = className;
            box.style.left = ((r.left - base.left + scroller.scrollLeft) * miniK) + 'px';
            box.style.top = ((r.top - base.top + scroller.scrollTop) * miniK) + 'px';
            // 아주 얇은 구역이 0px 가 되어 사라지지 않게 하한을 둔다.
            box.style.width = w + 'px';
            box.style.height = h + 'px';
            if (name) {
                box.title = name;
                // 글자가 블록을 넘치면 안 읽히느니 안 넣는 게 낫다.
                const short = shortLabelOf(name);
                if (short && w >= 12 && h >= 10) box.textContent = short;
            }
            frag.appendChild(box);
        };

        /*
           블록은 .zone(열)이 아니라 .floor(구역) 단위로 그린다 — 이름이 붙는 단위가 구역이고,
           한 열에 구역이 둘 이상 쌓인 홀에서는 열 단위로 그리면 둘이 한 블록으로 합쳐진다.
           기하는 .floor 가 아니라 그 안의 .house(좌석 격자)에서 잰다. .floor 에는 구역 이름을
           얹으려고 비워둔 padding-top(57px)이 있어서, 그대로 재면 블록 위에 빈 띠가 생긴다.
        */
        scroller.querySelectorAll('.floor').forEach(floor => {
            const house = floor.querySelector('.house');
            if (!house) return;
            const name = (floor.querySelector('.floorname')?.textContent || '').trim();
            place(house, 'minimap-zone grade-' + gradeOf(floor), name);
        });
        const stage = scroller.querySelector('.stage');
        if (stage) place(stage, 'minimap-stage', '');

        minimapZones.replaceChildren(frag);
        return true;
    }

    /** 보이는 범위 사각형만 갱신한다. 스크롤할 때마다 부르므로 구역은 건드리지 않는다. */
    function syncMinimapView() {
        if (minimap.hidden || !miniK) return;
        minimapView.style.left = (scroller.scrollLeft * miniK) + 'px';
        minimapView.style.top = (scroller.scrollTop * miniK) + 'px';
        minimapView.style.width = (scroller.clientWidth * miniK) + 'px';
        minimapView.style.height = (scroller.clientHeight * miniK) + 'px';
    }

    /*
       미니맵을 다시 만든다. 실제 작업은 다음 프레임으로 미룬다.

       이 함수는 좌석 크기를 바꾼 직후(확대 토글·핀치 확정)에 불린다. 그 시점에 레이아웃이
       더러운 상태라, scrollWidth 나 getBoundingClientRect 를 읽는 순간 브라우저가 3,022석
       전체를 그 자리에서 다시 배치한다(강제 리플로). 실측으로 확대 토글이 140ms → 250ms 로
       늘었다. 다음 프레임에 읽으면 브라우저가 어차피 해야 하는 레이아웃 뒤에 읽는 것이라
       같은 계산을 두 번 하지 않는다.

       읽기를 전부(넘침 판정까지) 콜백 안에 두는 게 핵심이다 — 하나라도 밖에 남기면
       거기서 리플로가 걸려 미루는 의미가 없어진다.
    */
    let miniBuildFrame = null;
    function syncMinimap() {
        if (!zoomed) { minimap.hidden = true; miniK = 0; return; }
        if (miniBuildFrame !== null) return;
        miniBuildFrame = requestAnimationFrame(() => {
            miniBuildFrame = null;
            if (!zoomed) { minimap.hidden = true; miniK = 0; return; }
            const show = mapOverflows();
            minimap.hidden = !show;
            if (!show) { miniK = 0; return; }
            if (buildMinimap()) syncMinimapView();
        });
    }

    /* 스크롤도 pointermove 처럼 화면 주사율보다 자주 올 수 있으므로 프레임당 한 번만 반영한다. */
    let miniFrame = null;
    scroller.addEventListener('scroll', () => {
        if (minimap.hidden || miniFrame !== null) return;
        miniFrame = requestAnimationFrame(() => { miniFrame = null; syncMinimapView(); });
    }, { passive: true });

    /* 미니맵을 누르거나 끌면 그 지점이 화면 가운데로 오게 지도를 옮긴다.
       미니맵은 격자 바깥의 fixed 요소라 격자의 끌기 처리와 겹치지 않는다. */
    let miniDrag = false;
    function miniScrollTo(clientX, clientY) {
        if (!miniK) return;
        const r = minimapInner.getBoundingClientRect();
        scroller.scrollLeft = (clientX - r.left) / miniK - scroller.clientWidth / 2;
        scroller.scrollTop = (clientY - r.top) / miniK - scroller.clientHeight / 2;
        syncMinimapView();
    }
    minimap.addEventListener('pointerdown', (e) => {
        miniDrag = true;
        try { minimap.setPointerCapture(e.pointerId); } catch (ignored) { /* 캡처 없이 진행 */ }
        miniScrollTo(e.clientX, e.clientY);
        e.preventDefault();
    });
    minimap.addEventListener('pointermove', (e) => { if (miniDrag) miniScrollTo(e.clientX, e.clientY); });
    function endMiniDrag(e) {
        if (!miniDrag) return;
        miniDrag = false;
        if (minimap.hasPointerCapture(e.pointerId)) minimap.releasePointerCapture(e.pointerId);
    }
    minimap.addEventListener('pointerup', endMiniDrag);
    minimap.addEventListener('pointercancel', endMiniDrag);

    applySeatSize();

    /* 맞춤이 아예 불가능한 홀·화면은 지도 모드로 시작한다.
       좁은 화면에서는 하한(9px)까지 줄여도 안 들어간다 — 한 층이 75석 폭인 홀은 그것만 675px 라
       휴대폰 폭을 넘는다. 그때 맞춤 모드로 두면 "작은 좌석 + 가로 스크롤"로 양쪽을 다 잃는다. */
    if (requiredFitSize() < SEAT_FIT_MIN) {
        setZoomed(true);
        scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
    }
    syncZoomBtn();

    zoomBtn.addEventListener('click', () => {
        /* setZoomed 가 좌석 크기·격자 높이를 바꾸기 전에 앵커부터 잡는다. 나중에
           elementFromPoint 로 다시 찾으려 하면 그 사이 좌석 크기가 바뀌고 페이지도 스크롤돼서
           같은 좌표가 전혀 다른 곳을 가리키게 된다 — 요소 자체를 들고 있어야 한다. */
        const focusAnchor = (!zoomed && lastFocusPoint) ? elementAt(lastFocusPoint.x, lastFocusPoint.y) : null;

        setZoomed(!zoomed);
        if (zoomed) {
            /* 버튼으로 들어왔을 때는 지도를 화면 위쪽으로 끌어와 꽉 채운다(스크롤 후 다시 계산).
               스크롤 목표는 격자가 아니라 인원수·확대 줄이다 — 격자에 맞추면 「전체 보기」 버튼이
               화면 위로 밀려나서 되돌아갈 방법이 안 보인다. */
            const controls = document.querySelector('.partysize');
            window.scrollTo({ top: controls.getBoundingClientRect().top + window.scrollY - 8 });
            sizeMapViewport();

            if (focusAnchor) {
                // 맞춤 모드에서 가리키고 있던 자리를 확대 화면 가운데로 옮긴다.
                const sr = scroller.getBoundingClientRect(), ar = focusAnchor.getBoundingClientRect();
                scroller.scrollLeft += (ar.left + ar.width / 2) - (sr.left + sr.width / 2);
                scroller.scrollTop += (ar.top + ar.height / 2) - (sr.top + sr.height / 2);
            } else {
                // 가리킨 곳이 없으면 종전대로 무대 정면(가로 가운데, 맨 위)을 보여준다.
                scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
                scroller.scrollTop = 0;
            }
        }
    });

    /* ---------- 확대 모드에서 끌어 움직이기 ----------
       마우스만 처리한다. 터치·펜은 브라우저 기본 스크롤이 이미 같은 일을 하고, pointer 로
       가로채면 touch-action 을 꺼야 해서 오히려 관성 스크롤을 잃는다.

       좌석이 버튼이라 끌기와 클릭이 겹친다. 문턱(4px)을 넘게 움직였으면 그 다음 click 을
       캡처 단계에서 한 번 막는다 — 안 그러면 지도를 끌 때마다 지나간 좌석이 선택된다.

       포인터 캡처는 문턱을 넘은 뒤에 건다. pointerdown 에서 바로 걸면 이어지는 click 이
       좌석이 아니라 캡처 대상(컨테이너)으로 배달돼서, 확대 모드에서 좌석을 아예 고를 수 없다.
       움직이지 않은 클릭은 캡처를 거치지 않으므로 종전대로 좌석까지 간다. */
    const DRAG_THRESHOLD = 4;
    let pan = null;
    let panFrame = null;
    let swallowClick = false;

    scroller.addEventListener('pointerdown', (e) => {
        swallowClick = false;
        if (!zoomed || e.pointerType !== 'mouse' || e.button !== 0) return;
        pan = { id: e.pointerId, x: e.clientX, y: e.clientY,
                left: scroller.scrollLeft, top: scroller.scrollTop, moved: false, dx: 0, dy: 0 };
    });

    /* pointermove 는 화면 주사율(보통 초당 60~수백 회, 폴링레이트가 높은 마우스는 그 이상)보다
       자주 올 수 있는데, 매번 scrollLeft/scrollTop 을 바로 쓰면 브라우저가 그만큼 자주 다시
       그리려 든다. 최신 델타만 기억해뒀다가 프레임당 한 번만 반영한다 — 입력이 밀리는 게
       아니라 그리는 횟수만 줄어든다(한 프레임 안에 여러 이벤트가 와도 가장 최근 값이 남는다). */
    function applyPan() {
        panFrame = null;
        if (!pan) return;
        scroller.scrollLeft = pan.left - pan.dx;
        scroller.scrollTop = pan.top - pan.dy;
    }

    scroller.addEventListener('pointermove', (e) => {
        if (!pan) return;
        const dx = e.clientX - pan.x;
        const dy = e.clientY - pan.y;
        if (!pan.moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        if (!pan.moved) {
            pan.moved = true;
            scroller.classList.add('dragging');
            // 여기서부터는 커서가 격자를 벗어나도 계속 따라와야 한다.
            // 포인터가 이미 놓인 뒤라면 setPointerCapture 가 던진다. 그때도 끌기 자체는
            // 계속돼야 하므로(격자 안에서는 이벤트가 그대로 올라온다) 삼켜둔다.
            try { scroller.setPointerCapture(pan.id); } catch (ignored) { /* 캡처 없이 진행 */ }
        }
        pan.dx = dx;
        pan.dy = dy;
        if (panFrame === null) panFrame = requestAnimationFrame(applyPan);
    });

    function endPan() {
        if (!pan) return;
        // 대기 중인 프레임이 있으면 취소하고 지금 바로 반영한다 — 마지막 위치가 한 프레임
        // 밀려서 손을 뗀 지점과 어긋나 보이지 않게.
        if (panFrame !== null) { cancelAnimationFrame(panFrame); panFrame = null; }
        applyPan();
        swallowClick = pan.moved;
        if (pan.moved && scroller.hasPointerCapture(pan.id)) scroller.releasePointerCapture(pan.id);
        pan = null;
        scroller.classList.remove('dragging');
    }
    scroller.addEventListener('pointerup', endPan);
    scroller.addEventListener('pointercancel', endPan);

    scroller.addEventListener('click', (e) => {
        if (!swallowClick) return;
        swallowClick = false;
        e.stopPropagation();
        e.preventDefault();
    }, true);

    /* ---------- 터치: 두 손가락으로 확대·축소 ----------
       한 손가락 이동은 브라우저 기본 스크롤에 맡긴다(CSS 의 touch-action: pan-x pan-y).
       관성 스크롤을 직접 구현하면 절대 기본 동작만큼 자연스럽지 않다.

       두 손가락일 때만 가로챈다. 움직이는 동안은 좌석 크기를 건드리지 않고 래퍼(#housecontent)를
       transform: scale 로 확대해 보여주고, 손을 떼는 순간 실제 좌석 크기로 확정한다.
       좌석 크기를 직접 바꾸면 2,481개가 전부 다시 배치돼서 한 단계에 300ms 가 걸린다.

       확정할 때는 두 손가락 중간점에 있던 좌석이 제자리에 있어야 한다 — 안 그러면 손을 뗄 때
       화면이 튄다. 앵커는 계산으로 맞추지 않고 <b>그 자리에 있던 요소를 그대로 추적</b>한다.
       확정 뒤 그 요소가 얼마나 밀렸는지 재서 그만큼 스크롤을 되돌린다.

       비율로 환산하는 방식은 두 번 틀렸다. 좌석 크기 비율로 하면 행 라벨(고정 16px)이 오차가
       되고, 콘텐츠 크기(scrollWidth/Height) 비율로 해도 무대·구역 제목·밴드 사이 간격처럼
       좌석과 무관하게 고정된 높이가 남아서 앵커의 "비율 위치"가 보존되지 않는다. 실측으로는
       24px -> 44px 확대에서 세로로 94px(좌석 두 줄 넘게) 밀렸다. 요소를 직접 추적하면 그 고정분이
       무엇이든 자동으로 상쇄된다. */
    let pinch = null;
    let pinchFrame = null;
    const houseContent = document.getElementById('housecontent');

    function touchDistance(a, b) {
        return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    }

    scroller.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 2) { cancelPinch(); return; }
        const rect = scroller.getBoundingClientRect();
        const size = currentSeatSize();
        pinch = {
            distance: touchDistance(e.touches[0], e.touches[1]),
            size: size,
            // 손가락 중간점(격자 좌표계)과 그때의 스크롤. 미리보기 스크롤 보정에 쓴다.
            px: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left,
            py: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top,
            left: scroller.scrollLeft,
            top: scroller.scrollTop,
            scale: 1
        };
        scroller.classList.add('pinching');
    }, { passive: true });

    // 팬(pan)과 같은 이유로 프레임당 한 번만 반영한다 — 터치스크린도 60~120Hz 이상으로
    // touchmove 를 쏟아낼 수 있어서, 매번 transform·scrollLeft·scrollTop 세 가지를 다시
    // 쓰면 그만큼 자주 다시 그리게 된다.
    function applyPinch() {
        pinchFrame = null;
        if (!pinch) return;
        houseContent.style.transform = 'scale(' + pinch.scale + ')';
        scroller.scrollLeft = pinch.scale * (pinch.left + pinch.px) - pinch.px;
        scroller.scrollTop = pinch.scale * (pinch.top + pinch.py) - pinch.py;
    }

    scroller.addEventListener('touchmove', (e) => {
        if (!pinch || e.touches.length !== 2) return;
        const distance = touchDistance(e.touches[0], e.touches[1]);
        if (!distance || !pinch.distance) return;
        e.preventDefault();   // 브라우저 확대 대신 우리가 처리한다

        // 좌석 크기 한계를 배율 한계로 환산한다. 그래야 한계에 닿았을 때 미리보기도 같이 멈춘다.
        const raw = distance / pinch.distance;
        pinch.scale = Math.min(SEAT_PINCH_MAX / pinch.size,
                Math.max(SEAT_FIT_MIN / pinch.size, raw));
        if (pinchFrame === null) pinchFrame = requestAnimationFrame(applyPinch);
    }, { passive: false });

    /** 미리보기를 실제 좌석 크기로 확정한다. 레이아웃은 여기서 한 번만 일어난다. */
    function commitPinch() {
        if (!pinch) return;
        // 곧바로 최종 크기로 넘어가므로, 대기 중이던 미리보기 갱신은 반영하지 않고 버린다.
        if (pinchFrame !== null) { cancelAnimationFrame(pinchFrame); pinchFrame = null; }
        const next = Math.round(Math.min(SEAT_PINCH_MAX,
                Math.max(SEAT_FIT_MIN, pinch.size * pinch.scale)));
        const rect = scroller.getBoundingClientRect();
        // 확정 전(변형된 화면)에서 손가락 중간점에 있던 요소를 앵커로 잡는다.
        const anchor = elementAt(rect.left + pinch.px, rect.top + pinch.py);
        const before = anchor && anchor.getBoundingClientRect();

        houseContent.style.transform = '';
        scroller.classList.remove('pinching');
        pinch = null;

        zoomSize = next;
        if (!zoomed) setZoomed(true); else applySeatSize();

        if (!anchor) {
            // setZoomed 를 탄 경우엔 그 안에서 이미 만들었지만, 이미 확대 중이었다면 여기서 만든다.
            syncMinimap();
            return;
        }
        const after = anchor.getBoundingClientRect();
        scroller.scrollLeft += (after.left + after.width / 2) - (before.left + before.width / 2);
        scroller.scrollTop += (after.top + after.height / 2) - (before.top + before.height / 2);
        // 좌석 크기가 바뀌었으니 구역 블록까지 다시 만든다(보이는 범위만 갱신하면 배율이 어긋난다).
        syncMinimap();
    }

    function cancelPinch() {
        if (!pinch) return;
        if (pinchFrame !== null) { cancelAnimationFrame(pinchFrame); pinchFrame = null; }
        houseContent.style.transform = '';
        scroller.classList.remove('pinching');
        pinch = null;
    }

    scroller.addEventListener('touchend', (e) => {
        if (pinch && e.touches.length < 2) commitPinch();
    }, { passive: true });
    scroller.addEventListener('touchcancel', cancelPinch, { passive: true });

    // 창 크기가 바뀌면 다시 맞춘다. 리사이즈는 연속으로 들어오므로 한 프레임에 한 번만 계산한다.
    let fitPending = false;
    window.addEventListener('resize', () => {
        if (fitPending) return;
        fitPending = true;
        requestAnimationFrame(() => {
            fitPending = false;
            applySeatSize();
            // 화면을 좁히거나 기기를 돌려서 맞춤이 불가능해졌으면 지도 모드로 넘긴다.
            if (!zoomed && requiredFitSize() < SEAT_FIT_MIN) {
                setZoomed(true);
                scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
            }
            sizeMapViewport();
            syncZoomBtn();
            syncMinimap();
        });
    });

    /* ---------- 등급 필터 (가격표가 곧 필터) ----------
       가격은 이번 회차에 실제로 만든 좌석에서 직접 읽어온다. 그 김에 좌석이 하나도 없는
       등급은 버튼을 비활성화한다 — 눌러도 결과가 빈 화면이라 누를 수 있으면 안 된다. */
    const gradeFilter = document.getElementById('gradeFilter');
    /** 고른 등급들. 비어 있으면 필터 없음(= 전체 보기)이다. */
    const activeGrades = new Set();

    gradeFilter.querySelectorAll('button').forEach(btn => {
        const grade = btn.dataset.grade;
        const sample = document.querySelector(`.seat[data-grade="${grade}"]`);
        if (!sample) {
            btn.disabled = true;
            return;
        }
        btn.querySelector('.legend-price').textContent =
                Number(sample.dataset.price).toLocaleString() + '원';
        btn.addEventListener('click', () => {
            if (activeGrades.has(grade)) activeGrades.delete(grade);
            else activeGrades.add(grade);
            btn.setAttribute('aria-pressed', String(activeGrades.has(grade)));
            applyGradeFilter();
        });
    });

    /*
       고른 등급 목록을 컨테이너 속성 하나로 넘긴다. 좌석마다 클래스를 붙이지 않는 이유는
       CSS 쪽 주석 참고 — 3,022석 홀에서 토글할 때마다 전체를 순회하지 않기 위해서다.
       아무것도 안 골랐으면 속성 자체를 지워 "필터 없음"으로 되돌린다.
    */
    function applyGradeFilter() {
        const value = [...activeGrades].join(' ');
        [scroller, minimap].forEach(el => {
            if (value) el.dataset.gradeFilter = value;
            else delete el.dataset.gradeFilter;
        });
    }

    /* ---------- 고정 바에 가려지는 높이 ----------
       좌석 표시·가격표가 예매 바 안에 있고 바는 화면 아래에 고정이다. 그만큼 본문 끝이 가려지므로
       실측한 높이를 --footer-h 로 넘겨 body 의 아래 여백으로 쓴다. 좁은 화면에서 범례가 여러 줄로
       접히거나 고른 좌석 칩이 늘어나면 높이가 변하니 ResizeObserver 로 따라간다.
       (바는 position: fixed 라 body 여백을 바꿔도 높이가 안 변한다 — 되먹임 없음) */
    function syncFooterHeight() {
        document.documentElement.style.setProperty('--footer-h', bookbar.offsetHeight + 'px');
        // 지도 모드의 격자 높이도 바 높이에서 빼고 있으므로 같이 맞춘다.
        sizeMapViewport();
        // 격자 높이가 바뀌면 "보이는 범위"의 크기도 달라진다.
        syncMinimapView();
    }
    syncFooterHeight();
    new ResizeObserver(syncFooterHeight).observe(bookbar);

    const partySizeSelect = document.getElementById('partySize');
    const pickedBox = document.getElementById('picked');
    const bookBtn = document.getElementById('bookBtn');

    /** 선택한 좌석 DOM 엘리먼트들. 선택 순서를 그대로 유지한다. */
    let selectedSeats = [];

    function partySize() {
        return Number(partySizeSelect.value);
    }

    function renderPicked() {
        if (selectedSeats.length === 0) {
            pickedBox.innerHTML = '<p class="pickedlist">좌석을 선택하세요</p>';
            bookBtn.disabled = true;
            return;
        }
        const chips = selectedSeats.map(s => `<span class="pickchip">${s.dataset.label}</span>`).join('');
        const total = selectedSeats.reduce((sum, s) => sum + Number(s.dataset.price), 0).toLocaleString();
        pickedBox.innerHTML =
            `<p class="pickedlist">${chips}</p>` +
            `<p class="pickedtotal">${selectedSeats.length}석 · 총 <strong>${total}원</strong></p>`;
        bookBtn.disabled = false;
    }

    function deselect(seat) {
        seat.classList.remove('selected');
        selectedSeats = selectedSeats.filter(s => s !== seat);
    }

    // 인원수를 줄이면 초과분은 선택 해제한다.
    partySizeSelect.addEventListener('change', () => {
        while (selectedSeats.length > partySize()) {
            deselect(selectedSeats[selectedSeats.length - 1]);
        }
        renderPicked();
    });

    document.querySelectorAll('.seat').forEach(seat => {
        seat.addEventListener('click', () => {
            if (seat.classList.contains('selected')) {
                deselect(seat);
                renderPicked();
                return;
            }
            if (selectedSeats.length >= partySize()) {
                alert(`인원수(${partySize()}명)만큼만 좌석을 선택할 수 있습니다.`);
                return;
            }
            seat.classList.add('selected');
            selectedSeats.push(seat);
            renderPicked();
        });
    });

    const PENDING_HOLD_KEY = 'pendingHold';

    /** 좌석 선점을 시도한다. 비로그인 상태면 authRequired 만 true 로 반환하고 리다이렉트는 호출부가 처리한다. */
    async function attemptHold(seatIds) {
        const res = await fetch('/api/reservations/hold', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [CSRF_HEADER]: CSRF_TOKEN
            },
            body: JSON.stringify({ seatIds, strategy: 'PESSIMISTIC' })
        });

        if (res.redirected || !res.headers.get('content-type')?.includes('application/json')) {
            return { authRequired: true };
        }
        return { authRequired: false, ok: res.ok, data: await res.json() };
    }

    /** 실패한 좌석만 선택 해제하고 판매 불가로 표시한다. 나머지는 여전히 선택된 채로 둬서
        사용자가 실패한 좌석만 바꿔 다시 시도할 수 있게 한다 (전체 재선택 강요 X). */
    function markFailedSeats(failedSeatIds) {
        const failedIds = new Set(failedSeatIds || []);
        selectedSeats.filter(s => failedIds.has(Number(s.dataset.seatId))).forEach(s => {
            s.dataset.status = 'HELD';
            s.disabled = true;
            s.classList.remove('selected');
        });
        selectedSeats = selectedSeats.filter(s => !failedIds.has(Number(s.dataset.seatId)));
    }

    bookBtn.addEventListener('click', async () => {
        if (selectedSeats.length === 0) return;
        bookBtn.disabled = true;
        bookBtn.textContent = '선점 중...';

        const seatIds = selectedSeats.map(s => Number(s.dataset.seatId));

        try {
            const result = await attemptHold(seatIds);

            if (result.authRequired) {
                // 로그인하고 돌아왔을 때 방금 고른 좌석 그대로 결제 페이지까지 바로 이어가기 위해 남겨둔다.
                sessionStorage.setItem(PENDING_HOLD_KEY, JSON.stringify({ pathname: location.pathname, seatIds }));
                location.href = '/login?returnTo=' + encodeURIComponent(location.pathname + location.search);
                return;
            }

            if (result.ok) {
                // 결제 페이지로. 여기서 토스페이먼츠 결제창을 띄운다.
                location.href = `/reservations/${result.data.reservationNo}/payment`;
            } else {
                alert(result.data.message);
                markFailedSeats(result.data.failedSeatIds);
                renderPicked();
            }
        } catch (e) {
            alert('요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            bookBtn.textContent = '예매하기';
            bookBtn.disabled = selectedSeats.length === 0;
        }
    });

    /** 로그인하느라 이 화면을 떠났다가 돌아온 직후라면, 아까 고르던 좌석을 화면에 그대로 표시하고
        선점을 자동으로 재시도해 결제 페이지까지 바로 이어간다. */
    (async function resumePendingHold() {
        const raw = sessionStorage.getItem(PENDING_HOLD_KEY);
        if (!raw) return;
        sessionStorage.removeItem(PENDING_HOLD_KEY);

        let pending;
        try { pending = JSON.parse(raw); } catch { return; }
        if (!pending || pending.pathname !== location.pathname) return;

        pending.seatIds.forEach(seatId => {
            const seat = document.querySelector(`.seat[data-seat-id="${seatId}"]`);
            if (seat && seat.dataset.status === 'AVAILABLE') {
                seat.classList.add('selected');
                selectedSeats.push(seat);
            }
        });
        renderPicked();
        if (selectedSeats.length === 0) return;

        bookBtn.disabled = true;
        bookBtn.textContent = '선점 중...';
        const result = await attemptHold(selectedSeats.map(s => Number(s.dataset.seatId)));

        if (!result.authRequired && result.ok) {
            location.href = `/reservations/${result.data.reservationNo}/payment`;
            return;
        }
        if (!result.authRequired) {
            alert(result.data.message);
            markFailedSeats(result.data.failedSeatIds);
        }
        renderPicked();
        bookBtn.textContent = '예매하기';
        bookBtn.disabled = selectedSeats.length === 0;
    })();
</script>
</body>
</html>
